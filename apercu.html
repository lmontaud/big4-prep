/* Big4 Prep — feuille de style.
   Même charte qu'English Pro (formes, typographie, composants), avec une couleur d'accent
   différente : vert sapin et menthe au lieu du bleu marine et du jaune. */

:root {
  color-scheme: light;
  --paper: #f1f5f4;
  --surface: #ffffff;
  --ink: #0f2321;
  --ink-2: #4a6360;
  --line: #d3e0dd;
  --primary: #12403c;
  --on-primary: #ffffff;
  --mark: #7ee0c3;
  --on-mark: #0c2b28;
  --good: #0f7a57;
  --good-bg: #e2f4ec;
  --bad: #c2302a;
  --bad-bg: #fce8e6;
  --mid: #8a5a00;
  --mid-bg: #fff2cf;
  --flame: #e2570c;
  --heart: #d2326a;
  --bolt: #b98a00;
  --ice: #2a78d6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --chart-surface: #ffffff;
  --shadow: 0 1px 2px rgba(15, 35, 33, .06), 0 6px 18px rgba(15, 35, 33, .06);
  --ui: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --en: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Noto Serif", Georgia, serif;
  --radius: 16px;
  --tap: 52px;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #0b1716;
    --surface: #13231f;
    --ink: #e9f3f1;
    --ink-2: #a5bcb8;
    --line: #24403b;
    --primary: #7ee0c3;
    --on-primary: #0c2b28;
    --mark: #3fbf9b;
    --on-mark: #06201b;
    --good: #4fd1a1;
    --good-bg: #0f3327;
    --bad: #ff8a80;
    --bad-bg: #40191a;
    --mid: #ffcf66;
    --mid-bg: #3a2c0a;
    --flame: #ff8a3d;
    --heart: #ff6f9c;
    --bolt: #ffdd55;
    --ice: #6aa9f2;
    --series-1: #3987e5;
    --series-2: #d95926;
    --chart-surface: #13231f;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
.en { font-family: var(--en); }
.center { text-align: center; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }

.main {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.main-sub { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
.is-loading .main::before { content: "Chargement du contenu…"; color: var(--ink-2); padding: 40px 0; text-align: center; }

/* ---------- Barre d'onglets ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; justify-content: center;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1 1 0; max-width: 140px; min-height: 60px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: 0; color: var(--ink-2); font-size: 12px; font-weight: 600;
}
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .icon { background: var(--mark); color: var(--on-mark); }
.tab .icon { display: grid; place-items: center; width: 48px; height: 28px; border-radius: 14px; }
.icon { display: inline-flex; vertical-align: middle; }
.icon svg { display: block; }

/* ---------- Accueil ---------- */
.home-head { display: flex; flex-direction: column; gap: 12px; }
.brand { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pill {
  display: flex; align-items: center; gap: 5px; min-height: 44px; padding: 6px 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; white-space: nowrap; overflow: hidden;
}
.pill strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.pill-label { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.pill-streak .icon { color: var(--ink-2); }
.pill-streak.is-on .icon:first-child { color: var(--flame); }
.pill-streak .freeze { color: var(--ice); }
.pill-hearts .icon { color: var(--heart); }
.pill-xp .icon { color: var(--bolt); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);
}
.card h2 { font-size: 17px; font-weight: 700; }
.goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.goal-xp { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.due-line { font-size: 15px; color: var(--ink-2); }
.due-line strong { color: var(--ink); font-size: 17px; }
.cta-note { font-size: 13.5px; color: var(--ink-2); }

.bar { height: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--mark); border-radius: 7px; transition: width .35s ease; min-width: 0; }
.bar-done .bar-fill { background: var(--good); }
.bar-thin { height: 8px; }
.bar-session { flex: 1; height: 12px; }

.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.section-title { font-size: 15px; font-weight: 700; color: var(--ink-2); margin: 4px 2px 8px; }
.page-title { font-size: 24px; font-weight: 800; }
.lead { color: var(--ink-2); font-size: 15.5px; }
.empty { color: var(--ink-2); font-size: 15px; padding: 8px 2px; }

.theme-list { display: flex; flex-direction: column; gap: 8px; }
.theme-row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 68px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px;
}
.theme-icon { font-size: 24px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--paper); border-radius: 12px; flex: none; }
.theme-body { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.theme-title { font-weight: 700; font-size: 16px; }
.theme-meta { font-size: 12.5px; color: var(--ink-2); }
.theme-pct { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; flex: none; }
.theme-desc { color: var(--ink-2); font-size: 15px; }

.banner { border-radius: 12px; padding: 10px 14px; font-size: 14.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.banner-info { background: var(--mid-bg); color: var(--ink); }
.banner-warn { background: var(--bad-bg); color: var(--ink); }

/* ---------- Boutons ---------- */
.btn {
  min-height: var(--tap); padding: 12px 18px; border-radius: 14px; border: 1px solid transparent;
  font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; text-align: center;
}
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 3px 0 rgba(0, 0, 0, .28); }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .28); }
.btn-primary:disabled { background: var(--line); color: var(--ink-2); box-shadow: none; transform: none; }
.btn-soft { background: var(--surface); border-color: var(--line); flex-direction: column; gap: 0; }
.btn-quiet { background: none; color: var(--ink-2); }
.btn-danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.btn-title { font-size: 16px; }
.btn-sub { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.link { background: none; border: 0; padding: 8px 4px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 14.5px; font-weight: 600; min-height: 40px; white-space: nowrap; }
.link-danger { color: var(--bad); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink-2); flex: none; }

/* ---------- Sous-écrans ---------- */
.sub-head { display: flex; align-items: center; gap: 4px; margin-left: -10px; }
.sub-head h1 { font-size: 21px; font-weight: 800; }
.stat-row, .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-grid { grid-template-columns: repeat(2, 1fr); }
.stat-box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.stat-grid .stat-box, .summary .stat-box { background: var(--surface); }
.stat-box strong { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat-box span { font-size: 12.5px; color: var(--ink-2); }
.term-list, .word-list, .missed, .pair-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.term-list li { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.term-list .en { font-weight: 700; }
.term-fr { color: var(--ink-2); font-size: 15px; flex: 1; }

/* ---------- Session ---------- */
.main-session { min-height: 100vh; min-height: 100dvh; padding-bottom: 0; gap: 12px; }
.session-head { display: flex; align-items: center; gap: 8px; margin-left: -10px; }
.session-hearts { display: flex; align-items: center; gap: 4px; color: var(--heart); font-weight: 800; font-size: 18px; }
.session-hearts strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.session-hearts.is-muted { opacity: .45; }
.session-body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px; }
.session-foot {
  position: sticky; bottom: 0; margin: 0 -16px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--paper) 78%, transparent);
}
.session-foot.has-feedback { position: static; padding: 0; background: none; }
.ex-meta { display: flex; }
.tag { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.tag-new { background: var(--mark); color: var(--on-mark); border-color: transparent; }
.tag-retry { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.instruction { font-size: 20px; font-weight: 800; line-height: 1.25; }
.ex { display: flex; flex-direction: column; gap: 14px; }
.sentence { font-size: 21px; line-height: 1.5; white-space: pre-line; }
.sentence.fr { font-size: 19px; font-weight: 600; }
.sentence.question { font-size: 18px; }
.blank {
  display: inline-block; min-width: 3.4em; padding: 0 .35em; margin: 0; text-align: center;
  background: var(--mark); color: var(--on-mark); border-radius: 4px; font-weight: 600;
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
.hint { font-size: 14.5px; color: var(--ink-2); }
.hint span { font-style: italic; }
.hint-reveal { background: var(--mid-bg); color: var(--ink); padding: 8px 12px; border-radius: 10px; font-size: 16px; }
.hint-reveal span { font-style: normal; font-weight: 700; }
.hint-btn { align-self: flex-start; white-space: normal; text-align: left; }

.answer-input, .input {
  width: 100%; min-height: var(--tap); padding: 12px 14px; font-size: 19px; color: var(--ink);
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; font-family: var(--ui); resize: none;
}
.answer-input.en { font-family: var(--en); }
.answer-input:focus, .input:focus { outline: none; border-color: var(--ink); }
.answer-input.is-right { border-color: var(--good); background: var(--good-bg); }
.answer-input.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.answer-input.is-almost { border-color: var(--mid); background: var(--mid-bg); }

.choices { display: flex; flex-direction: column; gap: 10px; }
.choices-bank { flex-direction: row; flex-wrap: wrap; }
.choice, .chip, .pair, .word {
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; color: var(--ink);
  box-shadow: 0 2px 0 var(--line);
}
.choice { min-height: var(--tap); padding: 12px 14px; text-align: left; font-size: 18px; line-height: 1.35; }
.choice.fr { font-size: 16.5px; }
.choices-bank .choice { flex: 1 1 40%; text-align: center; }
.choice[aria-pressed="true"], .pair[aria-pressed="true"], .word[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 2px 0 var(--ink); background: var(--mark); color: var(--on-mark); }
.is-right, .choice.is-right { border-color: var(--good) !important; background: var(--good-bg) !important; color: var(--ink) !important; box-shadow: none !important; }
.is-wrong, .choice.is-wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; color: var(--ink) !important; box-shadow: none !important; }
.is-target { border-color: var(--good) !important; background: var(--good-bg) !important; text-decoration: line-through; text-decoration-color: var(--bad); }

.order-answer {
  min-height: 116px; padding: 10px; display: flex; flex-wrap: wrap; align-content: flex-start; align-items: center; gap: 8px;
  border: 2px dashed var(--line); border-radius: 14px; background: var(--surface);
}
.order-pool, .words { display: flex; flex-wrap: wrap; gap: 8px; }
.chip, .word { min-height: 46px; padding: 8px 14px; font-size: 19px; }
.order-end { font-family: var(--en); font-size: 22px; font-weight: 700; }
.words { gap: 6px 6px; }
.word { padding: 6px 10px; }

.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pairs-col { display: flex; flex-direction: column; gap: 10px; }
.pair { min-height: 60px; padding: 8px 10px; font-size: 16px; line-height: 1.25; }
.pair.en { font-size: 17.5px; }
.pair:disabled { opacity: .75; }

.audio { display: flex; align-items: center; gap: 16px; }
.play { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0, 0, 0, .28); flex: none; }
.play:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .28); }
.audio-side { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.audio-label { font-size: 14px; color: var(--ink-2); }
.chip-toggle { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-size: 14.5px; font-weight: 700; }
.chip-toggle[aria-pressed="true"] { background: var(--mark); color: var(--on-mark); border-color: var(--ink); }
.speak { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-grid; place-items: center; flex: none; vertical-align: middle; }
.speak-inline { margin-left: 6px; }

.chart-card { margin: 0; background: var(--chart-surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 8px 4px; }
.ep-chart { width: 100%; height: auto; display: block; font-family: var(--ui); }
.ep-chart-title { font-size: 13px; font-weight: 700; fill: var(--ink); }
.ep-chart-legend, .ep-chart-label { font-size: 11px; fill: var(--ink-2); }
.ep-chart-value { font-size: 11px; font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
.ep-chart-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.ep-chart-axis { stroke: var(--ink-2); stroke-width: 1; }

/* ---------- Retour après réponse ---------- */
.feedback {
  margin: 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  border-top: 3px solid var(--line); display: flex; flex-direction: column; gap: 8px;
  animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.fb-correct { background: var(--good-bg); border-color: var(--good); }
.fb-almost { background: var(--mid-bg); border-color: var(--mid); }
.fb-wrong { background: var(--bad-bg); border-color: var(--bad); }
.fb-title { font-size: 20px; font-weight: 800; }
.fb-correct .fb-title { color: var(--good); }
.fb-almost .fb-title { color: var(--mid); }
.fb-wrong .fb-title { color: var(--bad); }
.fb-label { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.fb-answer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.answer-line { font-size: 19px; line-height: 1.4; font-weight: 600; }
.fb-answer-quiet .answer-line { font-weight: 400; font-size: 17px; }
.answer-sub { font-size: 15.5px; color: var(--ink-2); }
.answer-line mark, mark { background: var(--mark); color: var(--on-mark); padding: 0 .25em; border-radius: 3px; }
.fb-explain { font-size: 15.5px; }
.fb-note { font-size: 14px; color: var(--ink-2); }
.fb-heart { font-size: 14.5px; font-weight: 700; color: var(--heart); display: flex; align-items: center; gap: 4px; }
.btn-continue { margin-top: 6px; background: var(--ink); color: var(--paper); }
.fb-correct .btn-continue { background: var(--good); color: #fff; }
.fb-wrong .btn-continue { background: var(--bad); color: #fff; }
@media (prefers-color-scheme: dark) {
  .fb-correct .btn-continue, .fb-wrong .btn-continue { color: #0b1716; }
}
.pair-list li { font-size: 16px; }
.pair-list .en { font-weight: 700; }

/* ---------- Fin de session ---------- */
.summary { display: flex; flex-direction: column; gap: 16px; padding-top: 24px; text-align: center; }
.summary h1 { font-size: 26px; font-weight: 800; }
.summary .card { text-align: left; }
.sum-badge { width: 96px; height: 96px; border-radius: 50%; background: var(--mark); color: var(--on-mark); display: grid; place-items: center; margin: 0 auto; }
.sum-note { font-size: 15px; display: flex; gap: 6px; align-items: flex-start; }
.sum-note .icon { flex: none; margin-top: 1px; }
.sum-good .icon { color: var(--flame); }

/* ---------- Flashcards ---------- */
.flash-card {
  flex: 1; min-height: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  padding: 24px 20px; display: flex; flex-direction: column; justify-content: center; gap: 14px; text-align: center;
}
.flash-side { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.flash-main { font-size: 28px; line-height: 1.25; font-weight: 700; }
.flash-main.fr { font-size: 25px; }
.flash-fr { font-size: 19px; color: var(--ink-2); }
.flash-example { font-size: 18px; line-height: 1.45; border-top: 1px solid var(--line); padding-top: 14px; }
.flash-count { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trio .btn { padding: 12px 6px; font-size: 16px; }
.btn-bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.btn-mid { background: var(--mid-bg); color: var(--mid); border-color: var(--mid); }
.btn-good { background: var(--good-bg); color: var(--good); border-color: var(--good); }

/* ---------- Formulaires, réglages ---------- */
.form { gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; font-weight: 700; color: var(--ink-2); }
.field-row { flex-direction: row; align-items: center; justify-content: space-between; }
.input { font-size: 17px; font-weight: 400; }
.input-time { width: auto; min-width: 130px; }
select.input { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 22px) 55%, calc(100% - 16px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; min-height: 160px; }
.form-error { color: var(--bad); font-size: 14.5px; font-weight: 600; }
.setting { display: flex; flex-direction: column; gap: 6px; }
.setting-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.setting-label { font-size: 14.5px; font-weight: 700; color: var(--ink-2); }
.seg { display: flex; gap: 0; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--paper); }
.seg-btn { flex: 1; min-height: 48px; border: 0; background: none; font-weight: 700; font-size: 15.5px; color: var(--ink-2); padding: 6px 4px; }
.seg-btn + .seg-btn { border-left: 2px solid var(--line); }
.seg-btn[aria-pressed="true"] { background: var(--mark); color: var(--on-mark); }
.switch { width: 58px; height: 34px; border-radius: 17px; border: 2px solid var(--line); background: var(--paper); padding: 0; position: relative; flex: none; }
.switch-knob { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-2); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--good); border-color: var(--good); }
.switch[aria-checked="true"] .switch-knob { transform: translateX(24px); background: #fff; }
.switch:disabled { opacity: .45; }

.word-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.word-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.word-en { font-weight: 700; font-size: 18px; }
.word-ex { font-size: 15px; color: var(--ink-2); font-style: italic; }
.word-status { font-size: 12.5px; color: var(--ink-2); }

.table { width: 100%; border-collapse: collapse; font-size: 15px; }
.table th, .table td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.table thead th { font-size: 12.5px; color: var(--ink-2); }
.table tbody th { font-weight: 600; }
.table td { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.table thead th:not(:first-child) { text-align: right; }
.missed { counter-reset: m; gap: 0; }
.missed li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.missed li:last-child { border-bottom: 0; }
.missed-n { margin-left: auto; font-size: 13px; color: var(--bad); font-weight: 700; white-space: nowrap; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
.week-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.week-val { font-size: 11px; color: var(--ink-2); min-height: 14px; font-variant-numeric: tabular-nums; }
.week-track { width: 100%; height: 84px; display: flex; align-items: flex-end; background: var(--paper); border-radius: 6px; overflow: hidden; }
.week-bar { width: 100%; background: var(--series-1); border-radius: 4px 4px 0 0; min-height: 0; }
.week-day { font-size: 12px; color: var(--ink-2); }
.week-col.is-today .week-day { color: var(--ink); font-weight: 800; }

/* ---------- Modale, message ---------- */
.modal-layer { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 24, .55); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.modal { width: 100%; max-width: 520px; background: var(--surface); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; margin-bottom: env(safe-area-inset-bottom); max-height: 86vh; overflow: auto; }
.modal-title { font-size: 19px; font-weight: 800; }
.modal-body { display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.modal-actions .btn { flex: 1 1 auto; }
.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); z-index: 30;
  max-width: min(92vw, 480px); background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 14px;
  font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.in-sub .toast { bottom: calc(110px + env(safe-area-inset-bottom)); }

@media (min-width: 700px) {
  .modal-layer { align-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- Synchronisation ---------- */
.howto { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--paper); font-size: 14.5px; }
.howto summary { font-weight: 700; cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.howto ol { margin: 8px 0 2px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.code-input { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }

/* ======================================================================
   Big4 Prep — composants propres à l'application
   ====================================================================== */
:root { --fig-ink: var(--ink); --fig-grey: #8fa5a1; --warn: #b4560a; --series-1: #1f8a70; --series-3: #8a5cd6; }
.pill { padding: 6px 8px; gap: 4px; }
.pill .icon svg { width: 18px; height: 18px; }
@media (prefers-color-scheme: dark) { :root { --fig-grey: #6f8a85; --warn: #ffb066; --series-1: #3fbf9b; } }

.pill-goal .icon { color: var(--good); }
.level { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.level-eval { background: var(--paper); color: var(--ink-2); border: 1px solid var(--line); }
.level-low { background: var(--bad-bg); color: var(--bad); }
.level-mid { background: var(--mid-bg); color: var(--mid); }
.level-good { background: var(--good-bg); color: var(--good); }
.level-top { background: var(--good); color: #fff; }
.speed { font-size: 12px; color: var(--ink-2); }
.speed-slow { color: var(--warn); font-weight: 700; }
.btn-hero { min-height: 64px; font-size: 18px; }
.next-app { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.countdown { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; text-align: right; }
.countdown small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.muted { color: var(--ink-2); font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { justify-content: space-between; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-static { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }

/* Lancement d'une question */
.run-head { display: flex; align-items: center; gap: 8px; margin-left: -10px; position: sticky; top: 0; z-index: 4; background: var(--paper); padding: 6px 0; }
.run-count { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 17px; padding: 4px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.clock.is-over { color: var(--warn); border-color: var(--warn); }
.clock.is-low { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.calc-btn { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; color: var(--ink); }
.q-prompt { font-size: 18.5px; font-weight: 700; line-height: 1.35; }
.q-prompt.en, .passage.en, .choice.en { font-family: var(--en); }
.q-sub { font-size: 14px; color: var(--ink-2); }
.data-table { width: 100%; border-collapse: collapse; font-size: 14.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.data-table caption { text-align: left; font-weight: 700; font-size: 13.5px; padding: 0 2px 6px; }
.data-table th, .data-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.data-table th:first-child, .data-table td:first-child { text-align: left; }
.data-table thead th { font-size: 12.5px; color: var(--ink-2); background: var(--paper); }
.data-table tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.passage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; font-size: 16px; line-height: 1.55; max-height: 42vh; overflow-y: auto; }
.passage h3 { font-size: 15px; margin-bottom: 6px; }
.statement { font-size: 18px; font-weight: 700; border-left: 4px solid var(--mark); padding: 4px 0 4px 12px; }
.vfn { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.vfn .choice { text-align: center; font-size: 15.5px; padding: 10px 6px; }
.choice-letter { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; font-weight: 800; margin-right: 10px; flex: none; }
.choice { display: flex; align-items: center; }
.choice[aria-pressed="true"] .choice-letter { background: var(--surface); }

.fig { width: 100%; height: auto; display: block; }
.fig-black { fill: var(--fig-ink); stroke: var(--fig-ink); stroke-width: 2.5; }
.fig-white { fill: var(--surface); stroke: var(--fig-ink); stroke-width: 2.5; }
.fig-grey { fill: var(--fig-grey); stroke: var(--fig-ink); stroke-width: 2.5; }
.fig-line { stroke: var(--fig-ink); stroke-width: 2.5; }
.seq { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.seq-cell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; aspect-ratio: 1; display: grid; place-items: center; }
.seq-q { font-size: 28px; font-weight: 800; color: var(--ink-2); border-style: dashed; }
.fig-choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.fig-choice { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 4px 4px 18px; box-shadow: 0 2px 0 var(--line); }
.fig-choice .fig-label { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 800; color: var(--ink-2); }
.fig-choice[aria-pressed="true"] { border-color: var(--ink); background: var(--mark); box-shadow: 0 2px 0 var(--ink); }
.terms { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.terms span { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.terms .t-q { border-style: dashed; color: var(--ink-2); }

.sjt-situation { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; font-size: 16px; line-height: 1.5; }
.sjt-opt { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.sjt-opt-text { font-size: 15.5px; line-height: 1.4; }
.sjt-marks { display: flex; gap: 8px; }
.sjt-mark { flex: 1; min-height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.sjt-mark[aria-pressed="true"].best { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.sjt-mark[aria-pressed="true"].worst { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.sjt-opt.is-best { border-color: var(--good); }
.sjt-opt.is-worst { border-color: var(--bad); }
.rank-btn { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; }
.rank-badge { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-weight: 800; flex: none; }
.rank-badge.is-set { background: var(--mark); color: var(--on-mark); border: 2px solid var(--ink); }
.score-dots { font-size: 12.5px; font-weight: 800; color: var(--ink-2); }

.fb-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.fb-tip { font-size: 14.5px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; }
.fb-err { font-size: 14px; font-weight: 700; color: var(--bad); }
.fb-time { font-size: 13.5px; color: var(--ink-2); }
.fb-ref { font-size: 13.5px; color: var(--ink-2); font-style: italic; }
.fb-opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.fb-opts li { font-size: 14.5px; background: var(--surface); border-radius: 10px; padding: 8px 10px; border: 1px solid var(--line); }
.fb-opts strong { display: block; }

/* Calculatrice et brouillon */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; animation: rise .18s ease-out; }
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sheet-tabs { display: flex; gap: 6px; flex: 1; }
.sheet-tab { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-weight: 700; font-size: 14px; }
.sheet-tab[aria-pressed="true"] { background: var(--mark); color: var(--on-mark); border-color: var(--ink); }
.calc-screen { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; text-align: right; min-height: 64px; display: flex; flex-direction: column; justify-content: center; }
.calc-expr { font-size: 15px; color: var(--ink-2); min-height: 20px; word-break: break-all; font-variant-numeric: tabular-nums; }
.calc-val { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; word-break: break-all; }
.calc-keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.ck { min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-size: 20px; font-weight: 700; }
.ck-op { background: var(--surface); color: var(--ink); }
.ck-eq { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.ck-fn { font-size: 15px; color: var(--ink-2); }
.scratch { width: 100%; min-height: 220px; font-size: 16px; }
.with-sheet { padding-bottom: 420px !important; }

/* Bilan */
.big-score { font-size: 46px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.percentile { font-size: 15px; }
.note-estim { font-size: 12.5px; color: var(--ink-2); }
.err-bars { display: flex; flex-direction: column; gap: 8px; }
.err-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14px; align-items: center; }
.err-row .bar { grid-column: 1 / -1; height: 8px; }
.err-row .bar-fill { background: var(--bad); }
.review-list { display: flex; flex-direction: column; gap: 8px; }
.review-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.review-item summary { cursor: pointer; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
.review-item summary .tag { flex: none; }
.tag-ok { background: var(--good-bg); color: var(--good); border-color: transparent; }
.tag-ko { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.tag-skip { background: var(--paper); }

/* Plan */
.plan-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.plan-day { display: grid; grid-template-columns: 74px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14.5px; }
.plan-day.is-today { border: 2px solid var(--ink); }
.plan-day.is-past { opacity: .55; }
.plan-date { font-weight: 800; font-variant-numeric: tabular-nums; }
.plan-type-simulation .plan-date { color: var(--flame); }

/* Candidatures */
.app-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.app-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.app-firm { font-weight: 800; font-size: 17px; }
.status { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); white-space: nowrap; }
.status-a-passer { background: var(--mid-bg); color: var(--mid); border-color: transparent; }
.status-passe { background: var(--paper); }
.status-reussi { background: var(--good-bg); color: var(--good); border-color: transparent; }
.status-refuse { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.app-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.app-actions .btn { min-height: 42px; padding: 8px 12px; font-size: 14.5px; }

/* Fiches */
.fiche h2 { font-size: 17px; }
.fiche ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15.5px; }

/* Mini-jeux */
.game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 0 auto; width: 100%; }
.game-cell { aspect-ratio: 1; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); transition: background .12s; }
.game-cell.is-lit { background: var(--mark); border-color: var(--ink); }
.game-cell.is-ok { background: var(--good-bg); border-color: var(--good); }
.game-cell.is-ko { background: var(--bad-bg); border-color: var(--bad); }
.game-stage { min-height: 200px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.game-symbol { width: 110px; height: 110px; }
.game-score { font-size: 20px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.balloon { width: 120px; height: 120px; border-radius: 50%; background: var(--mark); border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 20px; transition: transform .1s; }
.balloon.is-burst { background: var(--bad-bg); border-color: var(--bad); border-style: dashed; }

</style>
</head>

  <script>window.BP_CONTENT = [{"module":"technique","title":"Comptabilité générale (PCG)","items":[{"id":"T001","module":"technique","lang":"fr","type":"qcm","theme":"principes","q":"Quel principe impose de constater les pertes probables mais interdit d'enregistrer les gains seulement latents ?","answer":"Le principe de prudence","distractors":["Le principe de permanence des méthodes","Le principe d'indépendance des exercices","Le principe de non-compensation"],"explain":"La prudence conduit à une appréciation raisonnable des faits pour éviter de transférer sur l'avenir des incertitudes présentes : les pertes probables sont provisionnées, les gains latents ne sont pas comptabilisés (seuls les bénéfices réalisés peuvent être inscrits).","ref":"Code de commerce, art. L.123-20 et L.123-21","difficulty":1,"time":30},{"id":"T002","module":"technique","lang":"fr","type":"qcm","theme":"principes","q":"Une société détient une créance de 10 000 € sur un client qui est aussi son fournisseur (dette de 4 000 €). Aucun accord de compensation n'existe. Comment présenter ces montants au bilan ?","answer":"Créance de 10 000 € à l'actif et dette de 4 000 € au passif","distractors":["Créance nette de 6 000 € à l'actif","Dette nette de 6 000 € au passif","Aucun montant : les deux s'annulent partiellement"],"explain":"Le principe de non-compensation interdit de compenser des postes d'actif et de passif (ou de charges et de produits). Chaque élément est évalué et présenté séparément.","ref":"Code de commerce, art. L.123-19","difficulty":1,"time":40},{"id":"T003","module":"technique","lang":"fr","type":"qcm","theme":"principes","q":"Que signifie le principe de permanence des méthodes ?","answer":"Les méthodes d'évaluation et de présentation ne changent pas d'un exercice à l'autre, sauf changement justifié","distractors":["Les immobilisations sont conservées à leur coût historique","Les comptes sont établis en supposant la poursuite de l'activité","Chaque exercice supporte les charges et produits qui le concernent"],"explain":"La permanence des méthodes assure la comparabilité des comptes dans le temps. Un changement n'est possible que s'il est justifié (changement exceptionnel ou meilleure information) et doit être expliqué en annexe.","ref":"Code de commerce, art. L.123-17","difficulty":1,"time":30},{"id":"T004","module":"technique","lang":"fr","type":"qcm","theme":"principes","q":"Pendant combien de temps les documents comptables et les pièces justificatives doivent-ils être conservés selon le Code de commerce ?","answer":"10 ans","distractors":["3 ans","6 ans","5 ans"],"explain":"Le Code de commerce impose de conserver les documents comptables et les pièces justificatives pendant dix ans. Ne pas confondre avec le délai de reprise fiscal, en principe plus court.","ref":"Code de commerce, art. L.123-22","difficulty":1,"time":30},{"id":"T005","module":"technique","lang":"fr","type":"qcm","theme":"principes","q":"Les comptes annuels doivent être réguliers, sincères et donner une image fidèle. De quoi ?","answer":"Du patrimoine, de la situation financière et du résultat de l'entreprise","distractors":["Du chiffre d'affaires et de la trésorerie","De la valeur de marché de l'entreprise","Des prévisions de l'exercice suivant"],"explain":"L'objectif d'image fidèle porte sur le patrimoine, la situation financière et le résultat. C'est aussi ce que le commissaire aux comptes certifie.","ref":"Code de commerce, art. L.123-14","difficulty":1,"time":30},{"id":"T006","module":"technique","lang":"fr","type":"qcm","theme":"principes","q":"Quel principe suppose que l'entreprise poursuivra son activité dans un avenir prévisible ?","answer":"La continuité d'exploitation","distractors":["La prudence","L'importance relative","Le coût historique"],"explain":"Les comptes sont établis dans une hypothèse de continuité d'exploitation. Si elle est compromise, les méthodes d'évaluation (valeurs liquidatives) et l'information en annexe changent, et l'auditeur doit l'apprécier.","ref":"Code de commerce, art. L.123-20 ; NEP 570 / ISA 570","difficulty":1,"time":30},{"id":"T007","module":"technique","lang":"fr","type":"qcm","theme":"principes","q":"À leur date d'entrée dans le patrimoine, les biens acquis à titre onéreux sont enregistrés :","answer":"À leur coût d'acquisition","distractors":["À leur valeur de marché à la clôture","À leur valeur d'usage","À leur valeur de remplacement"],"explain":"C'est le principe du coût historique : l'entrée se fait au coût d'acquisition (biens acquis à titre onéreux), au coût de production (biens produits) ou à la valeur vénale (biens reçus à titre gratuit).","ref":"Code de commerce, art. L.123-18","difficulty":1,"time":30},{"id":"T008","module":"technique","lang":"fr","type":"qcm","theme":"ecritures","q":"Achat de marchandises à crédit : 1 000 € HT, TVA 20 %. Quelle écriture ?","answer":"Débit 607 : 1 000 ; débit 44566 : 200 ; crédit 401 : 1 200","distractors":["Débit 401 : 1 200 ; crédit 607 : 1 000 ; crédit 44566 : 200","Débit 607 : 1 200 ; crédit 401 : 1 200","Débit 607 : 1 000 ; débit 44571 : 200 ; crédit 401 : 1 200"],"explain":"L'achat est une charge (607) au HT, la TVA payée au fournisseur est déductible (44566), et la dette fournisseur (401) est enregistrée TTC. Le compte 44571 est la TVA collectée sur les ventes.","ref":"PCG, liste des comptes (classes 4 et 6)","difficulty":1,"time":45},{"id":"T009","module":"technique","lang":"fr","type":"qcm","theme":"ecritures","q":"Facturation d'une prestation de services à crédit : 5 000 € HT, TVA 20 %. Quelle écriture ?","answer":"Débit 411 : 6 000 ; crédit 706 : 5 000 ; crédit 44571 : 1 000","distractors":["Débit 706 : 5 000 ; débit 44571 : 1 000 ; crédit 411 : 6 000","Débit 411 : 5 000 ; crédit 706 : 5 000","Débit 512 : 6 000 ; crédit 706 : 6 000"],"explain":"Le client (411) est débité du TTC ; le produit (706, prestations de services) est crédité du HT ; la TVA collectée (44571) est une dette envers l'État.","ref":"PCG, liste des comptes (classes 4 et 7)","difficulty":1,"time":45},{"id":"T010","module":"technique","lang":"fr","type":"qcm","theme":"ecritures","q":"Un client règle sa facture par virement. Quelle écriture ?","answer":"Débit 512 ; crédit 411","distractors":["Débit 411 ; crédit 512","Débit 512 ; crédit 706","Débit 401 ; crédit 512"],"explain":"La banque augmente (débit 512) et la créance client s'éteint (crédit 411). Le produit a déjà été comptabilisé lors de la facturation.","ref":"PCG, liste des comptes (classes 4 et 5)","difficulty":1,"time":30},{"id":"T011","module":"technique","lang":"fr","type":"qcm","theme":"regularisations","q":"À la clôture, une facture d'honoraires de décembre (2 400 € HT, TVA 20 %) n'est pas encore reçue. Quelle écriture ?","answer":"Débit 6226 : 2 400 ; débit 44586 : 480 ; crédit 408 : 2 880","distractors":["Débit 408 : 2 880 ; crédit 6226 : 2 400 ; crédit 44586 : 480","Débit 6226 : 2 400 ; crédit 401 : 2 400","Débit 486 : 2 400 ; crédit 6226 : 2 400"],"explain":"La charge appartient à l'exercice : on la rattache via une facture non parvenue (408, fournisseurs – factures non parvenues). La TVA correspondante transite par le 44586 (TVA sur factures non parvenues) en attendant la facture.","ref":"PCG, comptes 408 et 4458 ; principe de séparation des exercices","difficulty":2,"time":50},{"id":"T012","module":"technique","lang":"fr","type":"qcm","theme":"regularisations","q":"À la clôture, une prestation réalisée en décembre n'a pas encore été facturée au client. Quel compte de tiers utilise-t-on ?","answer":"418 – Clients, produits non encore facturés","distractors":["408 – Fournisseurs, factures non parvenues","487 – Produits constatés d'avance","416 – Clients douteux"],"explain":"Le produit est acquis sur l'exercice : on débite le 418 (factures à établir) par le crédit du compte de produit et de la TVA sur factures à établir (44587).","ref":"PCG, compte 418","difficulty":2,"time":50},{"id":"T013","module":"technique","lang":"fr","type":"calcul","theme":"regularisations","q":"Une prime d'assurance annuelle de 12 000 € couvrant la période du 1er octobre N au 30 septembre N+1 a été payée et comptabilisée en charge. Exercice clos au 31/12/N. Quel montant de charge constatée d'avance ?","answer":"9 000 €","distractors":["3 000 €","12 000 €","6 000 €"],"explain":"Seuls 3 mois (octobre à décembre) concernent N, soit 3 000 €. Les 9 mois de N+1 (9 000 €) sont sortis des charges : débit 486, crédit 616.","ref":"PCG, compte 486 ; principe de séparation des exercices","difficulty":2,"time":60},{"id":"T014","module":"technique","lang":"fr","type":"calcul","theme":"regularisations","q":"Un abonnement de 6 mois (1er décembre N au 31 mai N+1) a été facturé et comptabilisé en produit pour 3 600 € HT. Clôture au 31/12/N. Quel produit constaté d'avance ?","answer":"3 000 €","distractors":["600 €","3 600 €","1 800 €"],"explain":"Le produit est de 600 € par mois. Seul décembre concerne N (600 €) ; les 5 mois de N+1 (3 000 €) sont reportés : débit 706, crédit 487.","ref":"PCG, compte 487 ; principe de séparation des exercices","difficulty":2,"time":60},{"id":"T015","module":"technique","lang":"fr","type":"qcm","theme":"regularisations","q":"Quel compte enregistre la dette relative aux congés payés acquis mais non pris à la clôture ?","answer":"4282 – Dettes provisionnées pour congés à payer","distractors":["421 – Personnel, rémunérations dues","151 – Provisions pour risques","4286 – Autres charges à payer"],"explain":"Les congés acquis et non pris constituent une dette certaine dans son principe et estimée de façon fiable : on la constate au 4282 (avec les charges sociales correspondantes au 4382). Ce n'est pas une provision pour risque.","ref":"PCG, compte 4282","difficulty":2,"time":40},{"id":"T016","module":"technique","lang":"fr","type":"qcm","theme":"regularisations","q":"Comment comptabiliser à la clôture les intérêts d'emprunt courus mais non encore échus ?","answer":"Débit 661 ; crédit 1688","distractors":["Débit 1688 ; crédit 661","Débit 661 ; crédit 164","Débit 486 ; crédit 661"],"explain":"Les intérêts courus sont une charge de l'exercice (661) et une dette rattachée à l'emprunt (1688, intérêts courus). Le compte 164 enregistre le seul capital emprunté.","ref":"PCG, comptes 1688 et 661","difficulty":2,"time":40},{"id":"T017","module":"technique","lang":"fr","type":"calcul","theme":"rapprochement","q":"Rapprochement bancaire au 31/12. Compte 512 : solde débiteur de 12 500 €. Relevé : 15 280 € en faveur de l'entreprise. Un chèque émis de 2 100 € n'est pas encore débité ; un virement client de 800 € et des frais bancaires de 120 € figurent sur le relevé mais pas en comptabilité. Quel est le solde rapproché ?","answer":"13 180 €","distractors":["15 280 €","12 500 €","13 420 €"],"explain":"Côté banque : 15 280 − 2 100 (chèque non débité) = 13 180. Côté entreprise : 12 500 + 800 (virement reçu) − 120 (frais) = 13 180. Les deux soldes rectifiés concordent.","ref":"Procédure de rapprochement bancaire","difficulty":2,"time":75},{"id":"T018","module":"technique","lang":"fr","type":"qcm","theme":"rapprochement","q":"Dans un rapprochement bancaire, quelles opérations donnent lieu à une écriture dans la comptabilité de l'entreprise ?","answer":"Celles qui figurent sur le relevé mais pas encore en comptabilité (frais, virements reçus…)","distractors":["Les chèques émis non encore débités par la banque","Toutes les différences, quel que soit leur côté","Aucune : le rapprochement est un simple contrôle"],"explain":"Les opérations connues de la banque mais pas de l'entreprise (frais, agios, virements reçus, prélèvements) sont à comptabiliser. Les décalages côté banque (chèques non encore débités, remises non créditées) se résorbent seuls.","ref":"Procédure de rapprochement bancaire","difficulty":2,"time":45},{"id":"T019","module":"technique","lang":"fr","type":"calcul","theme":"tva","q":"Sur le mois, la TVA collectée s'élève à 18 000 € et la TVA déductible à 11 500 €. Quel est le montant de TVA à décaisser ?","answer":"6 500 €","distractors":["29 500 €","11 500 €","18 000 €"],"explain":"TVA due = TVA collectée − TVA déductible = 18 000 − 11 500 = 6 500 € (compte 44551, TVA à décaisser).","ref":"CGI, art. 271 (droit à déduction) ; PCG, compte 44551","difficulty":1,"time":40},{"id":"T020","module":"technique","lang":"fr","type":"qcm","theme":"tva","q":"La TVA déductible du mois (6 500 €) dépasse la TVA collectée (4 000 €). Où enregistre-t-on la différence ?","answer":"44567 – Crédit de TVA à reporter","distractors":["44551 – TVA à décaisser","44571 – TVA collectée","4456 – TVA déductible"],"explain":"Un excédent de TVA déductible constitue un crédit de TVA (2 500 €), imputable sur les déclarations suivantes ou remboursable sous conditions.","ref":"PCG, compte 44567","difficulty":2,"time":40},{"id":"T021","module":"technique","lang":"fr","type":"calcul","theme":"capitaux","q":"Bénéfice de l'exercice : 80 000 € (pas de pertes antérieures). Capital : 200 000 €. Réserve légale déjà constituée : 15 000 €. Quelle dotation minimale à la réserve légale ?","answer":"4 000 €","distractors":["5 000 €","8 000 €","0 €"],"explain":"Il faut prélever au moins 5 % du bénéfice (4 000 €) jusqu'à ce que la réserve atteigne 10 % du capital (20 000 €). Il reste 5 000 € avant le plafond : la dotation minimale est donc de 4 000 €.","ref":"Code de commerce, art. L.232-10","difficulty":2,"time":60},{"id":"T022","module":"technique","lang":"fr","type":"qcm","theme":"bilan","q":"Dans quelle rubrique du bilan figure le résultat de l'exercice ?","answer":"Les capitaux propres","distractors":["Les dettes","Les provisions","L'actif circulant"],"explain":"Le résultat (bénéfice ou perte) appartient aux associés tant qu'il n'est pas affecté : il figure dans les capitaux propres, au passif.","ref":"PCG, modèle de bilan","difficulty":1,"time":30},{"id":"T023","module":"technique","lang":"fr","type":"calcul","theme":"stocks","q":"Achats de marchandises : 300 000 €. Stock initial : 40 000 €. Stock final : 52 000 €. Quel est le coût d'achat des marchandises vendues ?","answer":"288 000 €","distractors":["312 000 €","300 000 €","352 000 €"],"explain":"Coût d'achat des marchandises vendues = achats + stock initial − stock final = 300 000 + 40 000 − 52 000 = 288 000 €. La variation de stock (6037) vaut ici −12 000 € (stockage).","ref":"PCG, compte 6037 (variation des stocks de marchandises)","difficulty":2,"time":60},{"id":"T024","module":"technique","lang":"fr","type":"calcul","theme":"stocks","q":"Ventes de marchandises : 420 000 €. Achats : 300 000 €. Stock initial : 40 000 €. Stock final : 52 000 €. Quelle est la marge commerciale ?","answer":"132 000 €","distractors":["120 000 €","108 000 €","80 000 €"],"explain":"Coût d'achat des marchandises vendues = 300 000 + 40 000 − 52 000 = 288 000 €. Marge commerciale = 420 000 − 288 000 = 132 000 €. Oublier la variation de stock donne 120 000 €.","ref":"PCG, soldes intermédiaires de gestion","difficulty":2,"time":60},{"id":"T025","module":"technique","lang":"fr","type":"qcm","theme":"bilan","q":"Lequel de ces éléments ne fait PAS partie des capitaux propres ?","answer":"Les provisions pour risques","distractors":["Le capital social","Les réserves","Le report à nouveau"],"explain":"Les provisions pour risques et charges forment une rubrique distincte, entre les capitaux propres et les dettes. Capital, réserves, report à nouveau et résultat composent les capitaux propres.","ref":"PCG, modèle de bilan","difficulty":1,"time":30},{"id":"T026","module":"technique","lang":"fr","type":"calcul","theme":"creances","q":"Un client en redressement judiciaire doit 12 000 € TTC (TVA 20 %). La perte probable est estimée à 60 %. Quel montant de dépréciation ?","answer":"6 000 €","distractors":["7 200 €","12 000 €","4 800 €"],"explain":"La dépréciation se calcule sur le HT (10 000 €), car la TVA collectée pourra être récupérée si la créance devient définitivement irrécouvrable : 10 000 × 60 % = 6 000 €.","ref":"PCG (dépréciation des créances) ; pratique comptable et fiscale constante","difficulty":2,"time":70},{"id":"T027","module":"technique","lang":"fr","type":"qcm","theme":"creances","q":"Quelle écriture constate la dépréciation d'une créance client douteuse à la clôture ?","answer":"Débit 6817 ; crédit 491","distractors":["Débit 491 ; crédit 6817","Débit 6817 ; crédit 411","Débit 416 ; crédit 491"],"explain":"La dotation aux dépréciations des actifs circulants (6817) est une charge ; la dépréciation est inscrite en diminution de l'actif au 491 (dépréciations des comptes clients). La créance elle-même reste au 416.","ref":"PCG, comptes 491 et 6817","difficulty":2,"time":40},{"id":"T028","module":"technique","lang":"fr","type":"qcm","theme":"creances","q":"Un client devient douteux. Quelle écriture de reclassement passe-t-on (montant TTC) ?","answer":"Débit 416 ; crédit 411","distractors":["Débit 411 ; crédit 416","Débit 491 ; crédit 411","Débit 654 ; crédit 411"],"explain":"On isole la créance douteuse au 416 (clients douteux ou litigieux) sans changer son montant TTC. La dépréciation éventuelle fait l'objet d'une écriture distincte.","ref":"PCG, compte 416","difficulty":1,"time":40},{"id":"T029","module":"technique","lang":"fr","type":"qcm","theme":"plan-comptes","q":"Que regroupent les comptes de la classe 2 du plan comptable ?","answer":"Les immobilisations","distractors":["Les stocks","Les comptes de tiers","Les charges"],"explain":"Classe 1 : capitaux ; 2 : immobilisations ; 3 : stocks ; 4 : tiers ; 5 : financiers ; 6 : charges ; 7 : produits.","ref":"PCG, cadre comptable","difficulty":1,"time":25},{"id":"T030","module":"technique","lang":"fr","type":"qcm","theme":"plan-comptes","q":"À quoi correspond le compte 4091 ?","answer":"Fournisseurs – avances et acomptes versés sur commandes","distractors":["Clients – avances et acomptes reçus sur commandes","Fournisseurs d'immobilisations","Fournisseurs – factures non parvenues"],"explain":"Un acompte versé à un fournisseur est une créance de l'entreprise : il est enregistré au débit du 4091 jusqu'à la réception de la facture. L'acompte reçu d'un client va au 4191.","ref":"PCG, compte 4091","difficulty":1,"time":25},{"id":"T031","module":"technique","lang":"fr","type":"qcm","theme":"plan-comptes","q":"Un client verse un acompte avant la livraison. Quel compte est crédité ?","answer":"4191 – Clients, avances et acomptes reçus sur commandes","distractors":["411 – Clients","706 – Prestations de services","4091 – Fournisseurs, avances versées"],"explain":"Tant que la vente n'est pas réalisée, l'acompte reçu est une dette envers le client (4191), pas un produit.","ref":"PCG, compte 4191","difficulty":1,"time":25},{"id":"T032","module":"technique","lang":"fr","type":"qcm","theme":"paie","q":"Dans l'écriture de paie, quel compte est crédité du salaire net à payer ?","answer":"421 – Personnel, rémunérations dues","distractors":["641 – Rémunérations du personnel","431 – Sécurité sociale","645 – Charges de sécurité sociale"],"explain":"Le salaire brut est débité au 641 ; le net à payer est crédité au 421 et les cotisations salariales aux comptes d'organismes sociaux (431, 437…). Les cotisations patronales passent par le 645.","ref":"PCG, comptes 421 et 641","difficulty":1,"time":30},{"id":"T033","module":"technique","lang":"fr","type":"qcm","theme":"paie","q":"Les cotisations patronales de sécurité sociale sont enregistrées en charge au compte :","answer":"645 – Charges de sécurité sociale et de prévoyance","distractors":["641 – Rémunérations du personnel","421 – Personnel, rémunérations dues","431 – Sécurité sociale"],"explain":"La part patronale est une charge (645) dont la contrepartie est la dette envers les organismes sociaux (431, 437…).","ref":"PCG, compte 645","difficulty":1,"time":30},{"id":"T034","module":"technique","lang":"fr","type":"calcul","theme":"immobilisations","q":"Une machine est achetée 50 000 € HT. Transport : 2 000 €. Installation : 3 000 €. Formation du personnel : 1 500 €. Quel est son coût d'entrée ?","answer":"55 000 €","distractors":["56 500 €","50 000 €","53 000 €"],"explain":"Le coût d'acquisition comprend le prix d'achat et les coûts directement attribuables à la mise en état de fonctionnement (transport, installation). Les frais de formation du personnel en sont exclus et vont en charges.","ref":"PCG (coût d'acquisition des immobilisations corporelles) ; IAS 16, § 16-19","difficulty":2,"time":60},{"id":"T035","module":"technique","lang":"fr","type":"qcm","theme":"immobilisations","q":"Une dépense d'entretien courant d'une machine (vidange, petites pièces) doit être :","answer":"Comptabilisée en charges","distractors":["Immobilisée et amortie","Inscrite en charges constatées d'avance","Provisionnée"],"explain":"L'entretien courant maintient l'actif en état sans augmenter ses avantages économiques : c'est une charge (615, entretien et réparations). Seul le remplacement d'un composant identifié est immobilisé.","ref":"PCG (dépenses ultérieures, approche par composants)","difficulty":1,"time":35},{"id":"T036","module":"technique","lang":"fr","type":"qcm","theme":"immobilisations","q":"Un logiciel acquis auprès d'un éditeur et utilisé durablement est enregistré :","answer":"En immobilisation incorporelle (compte 205)","distractors":["En immobilisation corporelle (compte 218)","En charges externes","En stock"],"explain":"Les concessions, brevets, licences et logiciels acquis sont des immobilisations incorporelles (205).","ref":"PCG, compte 205","difficulty":1,"time":30},{"id":"T037","module":"technique","lang":"fr","type":"qcm","theme":"immobilisations","q":"En PCG, les frais de recherche (hors développement) sont :","answer":"Toujours comptabilisés en charges","distractors":["Immobilisés obligatoirement","Immobilisés au choix de l'entreprise","Inscrits en charges constatées d'avance"],"explain":"Les dépenses de recherche sont des charges. Seuls les frais de développement peuvent être immobilisés en PCG (option) lorsque les conditions sont remplies ; en IFRS (IAS 38), leur activation est obligatoire si les critères sont satisfaits.","ref":"PCG (frais de développement : activation optionnelle) ; IAS 38, § 54-57","difficulty":2,"time":40},{"id":"T038","module":"technique","lang":"fr","type":"calcul","theme":"bilan","q":"Total de l'actif : 900 k€. Dettes : 520 k€. Provisions pour risques et charges : 60 k€. Quel est le montant des capitaux propres ?","answer":"320 k€","distractors":["380 k€","440 k€","260 k€"],"explain":"Actif = capitaux propres + provisions + dettes. Capitaux propres = 900 − 520 − 60 = 320 k€.","ref":"PCG, modèle de bilan","difficulty":1,"time":40},{"id":"T039","module":"technique","lang":"fr","type":"qcm","theme":"outils","q":"Que permet le lettrage d'un compte de tiers ?","answer":"Rapprocher chaque facture des règlements qui la soldent","distractors":["Classer les écritures par ordre chronologique","Calculer la TVA due","Répartir les charges par service"],"explain":"Le lettrage associe factures et règlements par une même lettre : les montants non lettrés font apparaître ce qui reste dû, base de la balance âgée et du suivi des relances.","ref":"Pratique comptable","difficulty":1,"time":30},{"id":"T040","module":"technique","lang":"fr","type":"qcm","theme":"outils","q":"À quoi sert principalement une balance âgée clients en audit ?","answer":"Identifier les créances anciennes susceptibles d'être dépréciées","distractors":["Vérifier l'exhaustivité du chiffre d'affaires","Contrôler les taux de TVA","Calculer le délai fournisseurs"],"explain":"La balance âgée ventile les créances par ancienneté. Les retards importants signalent un risque de non-recouvrement : on les rapproche des dépréciations (assertion d'évaluation).","ref":"Pratique d'audit (assertion d'évaluation)","difficulty":1,"time":30},{"id":"T041","module":"technique","lang":"fr","type":"qcm","theme":"outils","q":"Quel document regroupe toutes les écritures compte par compte ?","answer":"Le grand livre","distractors":["Le journal","La balance","La liasse fiscale"],"explain":"Le journal enregistre les écritures dans l'ordre chronologique ; le grand livre les reprend par compte ; la balance récapitule les totaux et soldes de chaque compte.","ref":"Code de commerce, art. L.123-12 ; PCG (livres comptables)","difficulty":1,"time":25},{"id":"T042","module":"technique","lang":"fr","type":"qcm","theme":"ecritures","q":"Un rabais obtenu d'un fournisseur sur une facture d'achat de marchandises déjà comptabilisée, accordé par un avoir séparé, est enregistré :","answer":"Au crédit du compte 609 (rabais, remises et ristournes obtenus sur achats)","distractors":["Au crédit du compte 607","Au débit du compte 609","Au crédit du compte 709"],"explain":"Les réductions obtenues hors facture d'origine vont au crédit du 609, qui vient en diminution des achats. Le 709 concerne les réductions accordées aux clients.","ref":"PCG, compte 609","difficulty":2,"time":40},{"id":"T043","module":"technique","lang":"fr","type":"qcm","theme":"ecritures","q":"Paiement d'un fournisseur par virement : quelle écriture ?","answer":"Débit 401 ; crédit 512","distractors":["Débit 512 ; crédit 401","Débit 607 ; crédit 512","Débit 401 ; crédit 607"],"explain":"La dette fournisseur s'éteint (débit 401) et la trésorerie diminue (crédit 512).","ref":"PCG, comptes 401 et 512","difficulty":1,"time":30},{"id":"T044","module":"technique","lang":"fr","type":"qcm","theme":"principes","q":"Une méthode comptable est changée en cours de vie de l'entreprise. Que faut-il faire ?","answer":"Justifier le changement et en donner l'incidence dans l'annexe","distractors":["Rien : l'entreprise est libre de ses méthodes","Le soumettre à l'administration fiscale pour accord préalable","Retraiter les comptes des dix derniers exercices"],"explain":"Un changement de méthode déroge à la permanence des méthodes : il doit être justifié (meilleure information, changement de réglementation) et son incidence doit être expliquée en annexe.","ref":"Code de commerce, art. L.123-17 ; PCG (changements de méthodes) ; IAS 8","difficulty":2,"time":40},{"id":"T045","module":"technique","lang":"fr","type":"qcm","theme":"tva","q":"Pour une prestation de services, la TVA devient en principe exigible :","answer":"Lors de l'encaissement du prix","distractors":["Lors de l'émission de la facture","Lors de la signature du contrat","À la fin du trimestre civil"],"explain":"Pour les prestations de services, l'exigibilité intervient en principe à l'encaissement (sauf option pour les débits). Pour les livraisons de biens, elle intervient à la livraison.","ref":"CGI, art. 269","difficulty":2,"time":40},{"id":"T046","module":"technique","lang":"fr","type":"calcul","theme":"tva","q":"Un prix est affiché 1 440 € TTC avec une TVA à 20 %. Quel est le montant de TVA ?","answer":"240 €","distractors":["288 €","200 €","1 200 €"],"explain":"HT = 1 440 ÷ 1,2 = 1 200 € ; TVA = 1 440 − 1 200 = 240 €. Appliquer 20 % au TTC (288 €) est l'erreur classique.","ref":"CGI, art. 278 (taux normal de 20 %)","difficulty":1,"time":35},{"id":"T047","module":"technique","lang":"fr","type":"calcul","theme":"regularisations","q":"Un loyer trimestriel de 9 000 € couvrant décembre N, janvier et février N+1 a été payé et comptabilisé en charge le 1er décembre N. Clôture au 31/12/N. Charge constatée d'avance ?","answer":"6 000 €","distractors":["3 000 €","9 000 €","4 500 €"],"explain":"Le loyer mensuel est de 3 000 €. Janvier et février N+1 (6 000 €) ne concernent pas N et sont portés en charges constatées d'avance (486).","ref":"PCG, compte 486","difficulty":2,"time":55},{"id":"T048","module":"technique","lang":"fr","type":"calcul","theme":"regularisations","q":"Un contrat de maintenance de 12 mois commençant le 1er novembre N a été facturé 24 000 € HT et comptabilisé en produit. Clôture au 31/12/N. Produit constaté d'avance ?","answer":"20 000 €","distractors":["4 000 €","24 000 €","18 000 €"],"explain":"2 000 € par mois ; seuls novembre et décembre (4 000 €) sont acquis en N. Les 10 mois restants (20 000 €) sont reportés au 487.","ref":"PCG, compte 487","difficulty":2,"time":55},{"id":"T049","module":"technique","lang":"fr","type":"calcul","theme":"regularisations","q":"Un emprunt de 200 000 € au taux de 3 % paie ses intérêts chaque année le 1er juillet. Montant des intérêts courus à comptabiliser au 31 décembre ?","answer":"3 000 €","distractors":["6 000 €","1 500 €","0 €"],"explain":"Du 1er juillet au 31 décembre, 6 mois d'intérêts ont couru : 200 000 × 3 % × 6/12 = 3 000 € (débit 661, crédit 1688).","ref":"PCG, compte 1688","difficulty":2,"time":60},{"id":"T050","module":"technique","lang":"fr","type":"qcm","theme":"regularisations","q":"La facture d'électricité de novembre-décembre N n'arrivera qu'en janvier N+1 (estimée à 3 600 € HT). Que faut-il faire à la clôture ?","answer":"Constater une charge à payer de 3 600 € HT (fournisseur – facture non parvenue)","distractors":["Rien : la facture sera comptabilisée à réception","Constater une provision pour risques","Constater une charge constatée d'avance"],"explain":"La consommation de novembre-décembre est une charge de N : on la rattache par le 408 (et la TVA par le 44586). Ce n'est pas une provision : le montant et l'échéance sont connus avec une précision suffisante.","ref":"PCG, compte 408 ; principe de séparation des exercices","difficulty":2,"time":40}]},{"module":"technique","title":"Calculs : amortissements, provisions, stocks, analyse financière","items":[{"id":"T051","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Machine acquise et mise en service le 1er janvier pour 60 000 € HT, amortie en linéaire sur 5 ans. Dotation annuelle ?","answer":"12 000 €","distractors":["15 000 €","6 000 €","10 000 €"],"explain":"Annuité linéaire = base amortissable ÷ durée = 60 000 ÷ 5 = 12 000 € (taux 20 %).","ref":"PCG (amortissement des actifs) ; IAS 16, § 50-62","difficulty":1,"time":40},{"id":"T052","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Matériel de 48 000 € HT mis en service le 1er octobre N, amorti en linéaire sur 4 ans. Exercice clos le 31 décembre. Dotation de l'exercice N ?","answer":"3 000 €","distractors":["12 000 €","9 000 €","4 000 €"],"explain":"Annuité pleine : 48 000 ÷ 4 = 12 000 €. Prorata temporis de 3 mois (octobre à décembre) : 12 000 × 3/12 = 3 000 €. En linéaire, le prorata part de la date de mise en service.","ref":"PCG (amortissement des actifs) ; IAS 16, § 50-62","difficulty":2,"time":60},{"id":"T053","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Véhicule acquis 30 000 €, valeur résiduelle estimée et significative de 6 000 € au bout de 4 ans d'utilisation. Dotation linéaire annuelle ?","answer":"6 000 €","distractors":["7 500 €","4 500 €","9 000 €"],"explain":"La base amortissable est le coût diminué de la valeur résiduelle (lorsqu'elle est significative et mesurable) : (30 000 − 6 000) ÷ 4 = 6 000 €.","ref":"PCG (amortissement des actifs) ; IAS 16, § 50-62","difficulty":2,"time":50},{"id":"T054","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Immobilisation de 80 000 € amortie en linéaire sur 8 ans, mise en service un 1er janvier. Valeur nette comptable après 3 ans ?","answer":"50 000 €","distractors":["30 000 €","60 000 €","70 000 €"],"explain":"Annuité : 10 000 €. Amortissements cumulés après 3 ans : 30 000 €. VNC = 80 000 − 30 000 = 50 000 €.","ref":"PCG (amortissement des actifs) ; IAS 16, § 50-62","difficulty":1,"time":45},{"id":"T055","module":"technique","lang":"fr","type":"qcm","theme":"amortissements","q":"Quel coefficient fiscal d'amortissement dégressif s'applique à un bien dont la durée d'utilisation est de 5 ans ?","answer":"1,75","distractors":["1,25","2,25","2"],"explain":"Coefficients : 1,25 pour 3 ou 4 ans ; 1,75 pour 5 ou 6 ans ; 2,25 au-delà de 6 ans.","ref":"CGI, art. 39 A","difficulty":2,"time":35},{"id":"T056","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Quel est le taux d'amortissement dégressif d'un bien amortissable sur 5 ans ?","answer":"35 %","distractors":["20 %","40 %","25 %"],"explain":"Taux linéaire 20 % × coefficient 1,75 = 35 %.","ref":"CGI, art. 39 A","difficulty":2,"time":45},{"id":"T057","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Matériel industriel de 20 000 € acquis le 1er janvier, amorti en dégressif sur 5 ans. Première annuité ?","answer":"7 000 €","distractors":["4 000 €","8 000 €","5 000 €"],"explain":"Taux dégressif = 20 % × 1,75 = 35 %. Première annuité = 20 000 × 35 % = 7 000 € (exercice complet).","ref":"CGI, art. 39 A","difficulty":2,"time":50},{"id":"T058","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Bien de 40 000 € acquis le 15 avril N, amorti en dégressif sur 5 ans. Exercice clos le 31 décembre. Dotation de l'exercice N ?","answer":"10 500 €","distractors":["9 917 €","14 000 €","8 167 €"],"explain":"En dégressif, le prorata se calcule en mois entiers à partir du premier jour du mois d'acquisition : 9 mois (avril à décembre). 40 000 × 35 % × 9/12 = 10 500 €. Le calcul au jour près (9 917 €) est celui du linéaire.","ref":"CGI, art. 39 A","difficulty":3,"time":75},{"id":"T059","module":"technique","lang":"fr","type":"qcm","theme":"amortissements","q":"En amortissement dégressif, à quel moment passe-t-on à l'amortissement linéaire ?","answer":"Quand l'annuité linéaire calculée sur la durée restante devient supérieure à l'annuité dégressive","distractors":["Après la moitié de la durée d'utilisation","Quand la VNC devient inférieure à la moitié du coût","Jamais : le mode choisi est conservé jusqu'au bout"],"explain":"L'annuité dégressive (VNC × taux) diminue chaque année. Dès que la VNC ÷ nombre d'années restantes la dépasse, on bascule en linéaire pour amortir complètement le bien dans la durée prévue.","ref":"CGI, art. 39 A","difficulty":3,"time":50},{"id":"T060","module":"technique","lang":"fr","type":"qcm","theme":"amortissements","q":"Quel coefficient dégressif s'applique à un bien amortissable sur 3 ans ?","answer":"1,25","distractors":["1,75","2,25","1,5"],"explain":"3 ou 4 ans : 1,25 ; 5 ou 6 ans : 1,75 ; plus de 6 ans : 2,25. Un bien de 3 ans a donc un taux de 33,33 % × 1,25 = 41,67 %.","ref":"CGI, art. 39 A","difficulty":2,"time":30},{"id":"T061","module":"technique","lang":"fr","type":"calcul","theme":"immobilisations","q":"Une immobilisation de valeur nette comptable 14 000 € est cédée 18 000 €. Quel est le résultat de cession ?","answer":"Plus-value de 4 000 €","distractors":["Moins-value de 4 000 €","Plus-value de 18 000 €","Plus-value de 32 000 €"],"explain":"Résultat de cession = prix de cession − VNC = 18 000 − 14 000 = + 4 000 €.","ref":"PCG (sortie d'actifs) ; IAS 16, § 68-71","difficulty":1,"time":40},{"id":"T062","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Un bâtiment de 900 000 € (hors terrain) comprend une toiture de 150 000 € (durée 25 ans) et une structure de 750 000 € (durée 50 ans). Dotation annuelle linéaire ?","answer":"21 000 €","distractors":["18 000 €","36 000 €","15 000 €"],"explain":"Approche par composants : toiture 150 000 ÷ 25 = 6 000 € ; structure 750 000 ÷ 50 = 15 000 €. Total = 21 000 €. Amortir le tout sur 50 ans donnerait 18 000 €.","ref":"PCG (approche par composants) ; IAS 16, § 43-47","difficulty":3,"time":70},{"id":"T063","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Un ensemble immobilier est acquis 800 000 € : terrain 200 000 €, construction 600 000 € amortie sur 40 ans. Dotation annuelle ?","answer":"15 000 €","distractors":["20 000 €","5 000 €","0 €"],"explain":"Le terrain n'est pas amortissable (durée d'utilisation illimitée). Dotation = 600 000 ÷ 40 = 15 000 €.","ref":"PCG (amortissement des actifs) ; IAS 16, § 50-62","difficulty":2,"time":50},{"id":"T064","module":"technique","lang":"fr","type":"calcul","theme":"amortissements","q":"Une machine de 100 000 € est amortie selon les unités d'œuvre (capacité totale 50 000 heures). Elle a fonctionné 8 000 heures sur l'exercice. Dotation ?","answer":"16 000 €","distractors":["20 000 €","8 000 €","12 500 €"],"explain":"Le mode des unités d'œuvre reflète le rythme réel de consommation : 100 000 × 8 000 ÷ 50 000 = 16 000 €.","ref":"PCG (amortissement des actifs) ; IAS 16, § 50-62","difficulty":2,"time":55},{"id":"T065","module":"technique","lang":"fr","type":"qcm","theme":"provisions","q":"Selon l'avocat de la société, une condamnation dans un litige est « possible mais pas probable ». Quel traitement ?","answer":"Pas de provision, information en annexe si l'enjeu est significatif","distractors":["Provision pour la totalité de la demande","Provision pour la moitié de la demande","Dépréciation de l'actif concerné"],"explain":"Une provision exige une sortie de ressources probable. Une sortie seulement possible relève du passif éventuel : pas de provision, mais une information en annexe si elle est significative.","ref":"PCG (provisions) ; IAS 37, § 14 et 86","difficulty":2,"time":50},{"id":"T066","module":"technique","lang":"fr","type":"calcul","theme":"provisions","q":"Une entreprise accorde une garantie de 1 an. Historiquement, les coûts de garantie représentent 1,5 % du chiffre d'affaires. CA de l'exercice : 2 000 000 €. Provision pour garantie ?","answer":"30 000 €","distractors":["20 000 €","300 000 €","15 000 €"],"explain":"Obligation actuelle (garantie donnée), sortie probable et estimable sur la base statistique : 2 000 000 × 1,5 % = 30 000 €.","ref":"PCG (provisions pour garanties) ; IAS 37","difficulty":2,"time":45},{"id":"T067","module":"technique","lang":"fr","type":"calcul","theme":"provisions","q":"Une provision pour litige de 20 000 € avait été constituée. Le litige se règle cette année par le paiement de 12 000 €. Quel est l'impact net sur le résultat de l'exercice ?","answer":"+ 8 000 €","distractors":["− 12 000 €","+ 20 000 €","− 32 000 €"],"explain":"La reprise de la provision (+ 20 000 €) compense la charge réelle (− 12 000 €) : impact net + 8 000 €. La perte avait déjà été anticipée l'an dernier.","ref":"PCG (reprises de provisions) ; IAS 37, § 59-61","difficulty":3,"time":60},{"id":"T068","module":"technique","lang":"fr","type":"calcul","theme":"stocks","q":"Un stock coûte 50 000 €. Sa valeur nette de réalisation (prix de vente estimé moins frais de vente) est de 42 000 €. Dépréciation ?","answer":"8 000 €","distractors":["0 €","42 000 €","50 000 €"],"explain":"Les stocks sont évalués au plus faible du coût et de la valeur nette de réalisation : 50 000 − 42 000 = 8 000 € de dépréciation.","ref":"PCG (évaluation des stocks) ; IAS 2, § 9","difficulty":1,"time":40},{"id":"T069","module":"technique","lang":"fr","type":"calcul","theme":"stocks","q":"Stock initial : 100 unités à 10 €. Entrée : 300 unités à 12 €. Coût unitaire moyen pondéré après l'entrée ?","answer":"11,50 €","distractors":["11,00 €","12,00 €","11,25 €"],"explain":"CUMP = (100 × 10 + 300 × 12) ÷ 400 = (1 000 + 3 600) ÷ 400 = 11,50 €. La moyenne simple des prix (11 €) ignore les quantités.","ref":"PCG (méthodes d'évaluation des stocks) ; IAS 2, § 25","difficulty":2,"time":55},{"id":"T070","module":"technique","lang":"fr","type":"calcul","theme":"stocks","q":"Stock initial : 100 unités à 10 €. Entrée : 300 unités à 12 €. Sortie : 250 unités. Valeur du stock final selon la méthode PEPS (premier entré, premier sorti) ?","answer":"1 800 €","distractors":["1 725 €","1 500 €","2 000 €"],"explain":"PEPS : les 250 sorties consomment d'abord les 100 unités à 10 €, puis 150 à 12 €. Restent 150 unités à 12 € = 1 800 €. Au CUMP (11,50 €), on obtiendrait 1 725 €.","ref":"PCG (méthodes d'évaluation des stocks) ; IAS 2, § 25","difficulty":2,"time":60},{"id":"T071","module":"technique","lang":"fr","type":"qcm","theme":"stocks","q":"Quelle méthode d'évaluation des sorties de stock n'est admise ni en PCG ni en IFRS ?","answer":"DEPS (dernier entré, premier sorti)","distractors":["PEPS (premier entré, p
