fr","type":"best-worst","theme":"qualite","situation":"Vous terminez un test avec un écart non expliqué de 800 €, alors que le seuil des anomalies manifestement insignifiantes de la mission est de 2 000 €.","question":"Quelle est la réponse la plus efficace, et la moins efficace ?","options":[{"t":"Documenter l'écart, conclure selon la méthodologie et le mentionner à votre senior lors de la revue.","score":4,"why":"Le traitement est conforme et transparent."},{"t":"Modifier le test pour faire disparaître l'écart.","score":1,"why":"Falsification de la documentation."},{"t":"Passer une demi-journée à chercher l'origine de l'écart.","score":2,"why":"Effort disproportionné au regard du seuil, sauf indice particulier."},{"t":"Documenter l'écart sans en parler au senior.","score":3,"why":"La documentation est correcte ; en parler reste préférable pour la revue."}],"principle":"Qualité et proportionnalité","explain":"Le seuil des anomalies manifestement insignifiantes guide l'effort. Un écart se documente toujours honnêtement.","difficulty":2,"time":90},{"id":"S47","module":"sjt","lang":"fr","type":"rank","theme":"delais","situation":"Vous terminez votre section avec une journée d'avance sur le planning.","question":"Classez ces réponses de la plus efficace à la moins efficace.","options":[{"t":"Prévenir votre senior et proposer votre aide sur une autre section.","score":4,"why":"Vous contribuez à l'avancement global de la mission."},{"t":"Relire votre section pour l'améliorer avant de la remettre, puis prévenir votre senior.","score":3,"why":"La qualité y gagne, mais l'équipe aurait pu profiter de votre disponibilité plus tôt."},{"t":"Garder la journée pour vous former en ligne sans prévenir.","score":2,"why":"Vous vous formez, mais l'équipe ignore votre disponibilité."},{"t":"Ne rien dire et remettre la section à la date prévue.","score":1,"why":"L'équipe perd une journée de ressource."}],"principle":"Esprit d'équipe","explain":"Une disponibilité se signale : elle permet de rééquilibrer la charge de l'équipe.","difficulty":1,"time":120},{"id":"S48","module":"sjt","lang":"fr","type":"best-worst","theme":"integrite","situation":"En testant les achats, vous trouvez un paiement de 15 000 € à une société de conseil sans contrat ni facture détaillée, validé par le directeur général.","question":"Quelle est la réponse la plus efficace, et la moins efficace ?","options":[{"t":"Documenter le constat, demander les justificatifs par écrit au service comptable et informer votre senior.","score":4,"why":"Vous collectez les éléments et escaladez un risque potentiel de fraude ou de corruption."},{"t":"Demander directement au directeur général de justifier ce paiement.","score":2,"why":"Vous risquez d'alerter la personne concernée et ce n'est pas votre rôle."},{"t":"Considérer que le directeur général a le pouvoir de valider ce paiement.","score":1,"why":"L'absence de justificatifs est un signal d'alerte que vous ignorez."},{"t":"Exclure ce paiement de votre échantillon et en tirer un autre.","score":3,"why":"Vous évitez le problème au lieu de le traiter ; le signal est perdu."}],"principle":"Intégrité et scepticisme","explain":"Un paiement non justifié validé par un dirigeant est un signal de risque majeur. Il se documente et s'escalade.","difficulty":3,"time":90},{"id":"S49","module":"sjt","lang":"fr","type":"best-worst","theme":"equipe","situation":"En télétravail, vous n'avez pas de nouvelles de votre senior depuis deux jours et vous êtes bloqué sur une question technique.","question":"Quelle est la réponse la plus efficace, et la moins efficace ?","options":[{"t":"Lui envoyer un message précis expliquant le blocage, puis, sans réponse, solliciter un autre membre de l'équipe ou le manager.","score":4,"why":"Vous cherchez activement à débloquer la situation par le bon canal."},{"t":"Attendre qu'il revienne vers vous.","score":1,"why":"Le blocage peut durer et retarder la mission."},{"t":"Avancer sur une autre partie de votre travail en attendant.","score":3,"why":"Productif, mais le blocage n'est pas traité."},{"t":"Prendre une décision seul sur la question technique.","score":2,"why":"Risque d'erreur sur un point que vous ne maîtrisez pas."}],"principle":"Communication et autonomie","explain":"À distance, l'autonomie consiste à rendre visible un blocage et à chercher la bonne personne, pas à attendre.","difficulty":2,"time":90},{"id":"S50","module":"sjt","lang":"fr","type":"rank","theme":"erreur","situation":"En préparant le dossier de cette année, vous découvrez qu'une erreur significative est passée inaperçue dans les comptes de l'an dernier, que le cabinet a certifiés.","question":"Classez ces réponses de la plus efficace à la moins efficace.","options":[{"t":"Documenter précisément le constat et en informer immédiatement le senior et le manager.","score":4,"why":"Le sujet est grave et doit être traité au plus haut niveau sans délai."},{"t":"En parler d'abord au senior pour vérifier votre analyse.","score":3,"why":"Vérifier est utile, mais l'information doit monter rapidement."},{"t":"Corriger l'erreur dans les comptes de cette année sans rien dire.","score":1,"why":"Vous dissimulez un problème qui engage la responsabilité du cabinet."},{"t":"Attendre la revue de fin de mission pour en parler.","score":2,"why":"Le délai prive l'équipe du temps nécessaire pour traiter un sujet sensible."}],"principle":"Transparence et qualité","explain":"Une erreur dans des comptes déjà certifiés est un sujet majeur : il doit être documenté et remonté sans délai.","difficulty":3,"time":120}]},{"module":"anglais","title":"Anglais professionnel","items":[{"id":"E01","module":"anglais","lang":"en","type":"qcm","theme":"grammaire","q":"The audit team ___ the inventory count last Friday.","answer":"attended","distractors":["has attended","attends","was attending to"],"explain":"Événement daté et terminé (« last Friday ») : prétérit simple. Le present perfect est incompatible avec une date passée précise.","difficulty":1,"time":30},{"id":"E02","module":"anglais","lang":"en","type":"qcm","theme":"grammaire","q":"We ___ the client for the bank confirmation three times since Monday.","answer":"have chased","distractors":["chased","are chasing","had chased"],"explain":"« Since Monday » : action commencée dans le passé et liée au présent → present perfect.","difficulty":2,"time":30},{"id":"E03","module":"anglais","lang":"en","type":"qcm","theme":"grammaire","q":"If the client ___ the documents tomorrow, we will finish on time.","answer":"sends","distractors":["will send","sent","would send"],"explain":"Conditionnel de type 1 : « if » + présent simple, puis « will » dans la principale.","difficulty":1,"time":30},{"id":"E04","module":"anglais","lang":"en","type":"qcm","theme":"grammaire","q":"The financial statements ___ by the board next week.","answer":"will be approved","distractors":["will approve","are approving","have been approved"],"explain":"Voix passive au futur : les comptes sont approuvés PAR le conseil.","difficulty":2,"time":30},{"id":"E05","module":"anglais","lang":"en","type":"qcm","theme":"grammaire","q":"Neither the CFO nor the controllers ___ aware of the issue.","answer":"were","distractors":["was","is","has been"],"explain":"Avec « neither… nor », le verbe s'accorde avec le sujet le plus proche (« the controllers », pluriel).","difficulty":2,"time":30},{"id":"E06","module":"anglais","lang":"en","type":"qcm","theme":"grammaire","q":"I look forward to ___ from you.","answer":"hearing","distractors":["hear","heard","be hearing"],"explain":"« Look forward to » est suivi d'un verbe en -ing : « to » est ici une préposition.","difficulty":2,"time":30},{"id":"E07","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"Which word means « créances clients » in a balance sheet?","answer":"Trade receivables","distractors":["Trade payables","Accrued expenses","Retained earnings"],"explain":"Trade receivables = créances clients ; trade payables = dettes fournisseurs ; accrued expenses = charges à payer ; retained earnings = réserves / résultats non distribués.","difficulty":1,"time":30},{"id":"E08","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"« Commissaire aux comptes » is best translated as:","answer":"Statutory auditor","distractors":["Chartered accountant","Comptroller","Internal auditor"],"explain":"Le commissaire aux comptes est le « statutory auditor » (audit légal). « Chartered accountant » désigne l'expert-comptable britannique.","difficulty":1,"time":30},{"id":"E09","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"An « anomalie significative » is called a:","answer":"Material misstatement","distractors":["Significant anomaly","Major mistake","Relevant error"],"explain":"Le terme normalisé (ISA) est « material misstatement ».","difficulty":2,"time":30},{"id":"E10","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"« Provision pour risques » in IFRS English is:","answer":"Provision","distractors":["Allowance","Reserve","Depreciation"],"explain":"En IFRS, « provision » désigne un passif (IAS 37). « Allowance » s'emploie pour une dépréciation d'actif (créances), « reserve » pour des réserves en capitaux propres.","difficulty":2,"time":30},{"id":"E11","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"« Charges constatées d'avance » are called:","answer":"Prepaid expenses","distractors":["Accrued expenses","Deferred income","Payables"],"explain":"Prepaid expenses = charges constatées d'avance (actif) ; accrued expenses = charges à payer ; deferred income = produits constatés d'avance.","difficulty":2,"time":30},{"id":"E12","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"« Seuil de signification » in audit English is:","answer":"Materiality","distractors":["Threshold of meaning","Significance level","Tolerance"],"explain":"« Materiality » (ISA 320). « Performance materiality » correspond au seuil de planification.","difficulty":2,"time":30},{"id":"E13","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"The word « deadline » means:","answer":"The latest time by which something must be done","distractors":["A line in a spreadsheet that has been deleted","A meeting that has been cancelled","The end of a financial year"],"explain":"Deadline = date ou heure limite.","difficulty":1,"time":30},{"id":"E14","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"To « follow up » with a client means to:","answer":"Contact them again about a pending request","distractors":["End the relationship","Audit them a second time","Send them an invoice"],"explain":"« Follow up » = relancer, faire le suivi d'une demande en attente.","difficulty":2,"time":30},{"id":"E15","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"A « going concern » uncertainty relates to:","answer":"The entity's ability to continue operating in the foreseeable future","distractors":["A pending lawsuit against the auditor","The entity's tax position","The rotation of the audit partner"],"explain":"Going concern = continuité d'exploitation.","difficulty":3,"time":30},{"id":"E16","module":"anglais","lang":"en","type":"qcm","theme":"comprehension","q":"« Please find attached the revised schedule. » What does the sender mean?","answer":"The updated schedule is enclosed with the email","distractors":["The schedule will be sent later","The schedule has been cancelled","The schedule needs to be revised by you"],"explain":"« Please find attached » introduit une pièce jointe ; « revised » = mis à jour, révisé.","difficulty":2,"time":30},{"id":"E17","module":"anglais","lang":"en","type":"qcm","theme":"comprehension","q":"« We are unable to sign off until the outstanding items are cleared. » This means:","answer":"The report cannot be finalised before the open points are resolved","distractors":["The report has been signed","The outstanding items are not important","The client must sign the report"],"explain":"Sign off = valider, signer ; outstanding items = points en suspens.","difficulty":2,"time":30},{"id":"E18","module":"anglais","lang":"en","type":"qcm","theme":"comprehension","q":"« The variance is immaterial, so no adjustment is proposed. » What does the auditor conclude?","answer":"The difference is too small to require a correction","distractors":["The difference must be corrected","The difference cannot be explained","The figures are missing"],"explain":"Immaterial = non significatif ; no adjustment proposed = aucune correction demandée.","difficulty":3,"time":30},{"id":"E19","module":"anglais","lang":"en","type":"qcm","theme":"grammaire","q":"The manager asked me ___ the file before the meeting.","answer":"to review","distractors":["reviewing","review","that I review it"],"explain":"« Ask someone to do something » : infinitif avec « to ».","difficulty":2,"time":30},{"id":"E20","module":"anglais","lang":"en","type":"qcm","theme":"grammaire","q":"By the time the partner arrived, we ___ all the tests.","answer":"had completed","distractors":["completed","have completed","were completing"],"explain":"Action achevée avant un autre moment du passé : past perfect.","difficulty":3,"time":30},{"id":"E21","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"« Rapprochement bancaire » is called a:","answer":"Bank reconciliation","distractors":["Bank statement","Bank confirmation","Bank transfer"],"explain":"Bank reconciliation = rapprochement ; bank statement = relevé ; bank confirmation = confirmation (circularisation) bancaire.","difficulty":2,"time":30},{"id":"E22","module":"anglais","lang":"en","type":"qcm","theme":"vocabulaire","q":"« Amortissement » of a machine (IFRS) is called:","answer":"Depreciation","distractors":["Amortisation of a loan","Impairment","Write-off"],"explain":"Pour les immobilisations corporelles : depreciation ; « amortisation » s'emploie pour les incorporelles. Impairment = dépréciation exceptionnelle (perte de valeur).","difficulty":3,"time":30},{"id":"E23","module":"anglais","lang":"en","type":"qcm","theme":"comprehension","q":"« Could you get back to me by EOD? » means:","answer":"Please reply before the end of the day","distractors":["Please call me tomorrow morning","Please send the document by post","Please end the discussion"],"explain":"EOD = end of day, avant la fin de la journée.","difficulty":1,"time":30},{"id":"E24","module":"anglais","lang":"en","type":"qcm","theme":"grammaire","q":"The number of errors ___ decreased since last year.","answer":"has","distractors":["have","are","were"],"explain":"« The number of » + verbe au singulier ; « since » appelle le present perfect.","difficulty":2,"time":30}]},{"module":"fiches","fiches":[{"id":"formats","icon":"🗂️","title":"Ce qui vous attend chez chaque cabinet","intro":"Synthèse des retours de candidats et des sites spécialisés consultés le 17 novembre 2026. Les formats changent d'une année et d'un poste à l'autre : fiez-vous toujours d'abord au courriel d'invitation du cabinet.","sections":[{"h":"Deloitte","p":["Tests en ligne en première étape pour de nombreux postes : aptitudes cognitives (numérique, logique) et mises en situation.","Des candidats en audit citent aussi un test d'anglais, un test de personnalité et, parfois, un test de connaissances en comptabilité et audit."]},{"h":"PwC","p":["Les évaluations en ligne combinent des tests d'aptitude classiques (numérique, verbal, logique inductive) et une évaluation sous forme de jeux.","Des candidats auditeurs juniors à Neuilly-sur-Seine (fin 2025) mentionnent un test d'anglais avec un niveau B2 minimum (écrit et oral), un test psychotechnique et un test de comptabilité."]},{"h":"EY","p":["Évaluation en ligne : numérique, verbal et jugement situationnel, parfois sous forme de « job simulation ».","À Paris, des candidats citent un test d'anglais, de logique et de mise en situation, ou des tests de logique et de personnalité à passer sous 72 heures."]},{"h":"KPMG","p":["Les tests de présélection seraient fournis par Cappfinity : jugement situationnel, numérique, verbal, souvent suivis d'un entretien vidéo.","Des candidats en France décrivent un appel RH puis des tests en ligne dont un test psychotechnique."]},{"h":"À retenir","p":["Préparez-vous au socle commun : numérique, verbal, logique, mises en situation, anglais. Les connaissances techniques et la personnalité viennent souvent en plus.","Les éditeurs (SHL, Cappfinity, Aon, Arctic Shores, Saville…) adaptent leurs formats : l'application entraîne les compétences, pas un format exact.","Passez les tests dans un endroit calme, avec une connexion fiable, une calculatrice et du brouillon si c'est autorisé."]}]},{"id":"strategie","icon":"⏱️","title":"Stratégie de temps","intro":"Les tests d'aptitude sont conçus pour que peu de candidats finissent. La gestion du temps compte autant que la justesse.","sections":[{"h":"Avant de commencer","p":["Lisez les consignes : pénalité ou non pour une mauvaise réponse ? Retour en arrière possible ou non ?","Sans pénalité, ne laissez jamais une question vide en fin de temps : répondez au mieux.","Calculez votre budget : durée ÷ nombre de questions (environ 1 min en numérique, 35 à 40 s par affirmation en verbal)."]},{"h":"Pendant le test numérique","p":["Lisez la question AVANT le tableau : vous saurez quelles données chercher.","Vérifiez l'unité (k€, M€, %) et la période demandées.","Estimez un ordre de grandeur avant de calculer : vous éliminerez souvent deux ou trois propositions.","Si une question dépasse 1 min 30, choisissez la réponse la plus plausible et passez : les points suivants valent autant."]},{"h":"Pendant le test verbal","p":["Jugez uniquement d'après le texte, jamais d'après vos connaissances.","« Vrai » : le texte l'affirme ou l'implique nécessairement. « Faux » : le texte affirme le contraire. « On ne peut pas savoir » : le texte ne permet pas de trancher.","Méfiez-vous des mots absolus (toujours, tous, uniquement) et des nuances (la plupart, certains, peut)."]},{"h":"Pendant les mises en situation","p":["Il n'y a pas de piège de rapidité : prenez le temps de lire chaque option.","Cherchez la réponse qui protège la qualité, l'intégrité et le client tout en restant transparente avec le responsable.","Les pires réponses sont souvent : cacher une erreur, céder à une pression du client, décider seul d'une chose qui ne relève pas de vous."]}]},{"id":"personnalite","icon":"🧭","title":"Tests de personnalité","intro":"Ils ne se « réussissent » pas : ils décrivent votre façon habituelle de travailler. Il n'y a pas de quiz ici, et c'est volontaire.","sections":[{"h":"Ce qu'ils mesurent","p":["Des préférences de comportement : organisation, rapport aux règles, travail en équipe, gestion du stress, goût pour l'analyse ou pour le contact.","Le résultat est comparé à un profil de référence du poste et sert souvent de base à des questions en entretien."]},{"h":"Pourquoi la cohérence compte","p":["Le questionnaire repose les mêmes questions sous des formes différentes. Des réponses contradictoires abaissent l'indice de cohérence et peuvent vous pénaliser davantage qu'un trait « non idéal ».","Les questions à choix forcé (« lequel vous ressemble le plus / le moins ») rendent difficile toute tentative de manipulation."]},{"h":"Pourquoi ne pas chercher le « bon » profil","p":["Vous ne connaissez pas le profil exact attendu, et un profil trop parfait est souvent repéré.","Si votre profil est ensuite discuté en entretien, vous devrez défendre des réponses qui ne vous ressemblent pas.","Un poste qui ne correspond pas à votre fonctionnement réel sera difficile à vivre au quotidien."]},{"h":"Comment s'y préparer","p":["Répondez spontanément, en pensant à votre comportement au travail (stage, alternance), pas en privé.","Évitez les réponses extrêmes systématiques comme les réponses neutres systématiques.","Préparez des exemples concrets (rigueur, travail sous pression, désaccord avec un collègue as l'entreprise."]},{"h":"Méthode rapide","p":["1. Lisez l'affirmation et repérez son mot clé.","2. Cherchez la phrase du texte qui en parle.","3. Elle dit la même chose : Vrai. Elle dit le contraire : Faux. Rien de précis : On ne peut pas savoir."]}]}]}];</script>

  /* ---------------- N19 Ratio de liquidité ---------------- */
  def({
    id: 'N19', title: 'Ratio de liquidité', skill: 'Ratios', difficulty: 3, targetSec: 80, range: [0.1, 6],
    make: function (rng, lang) {
      var st = ri(rng, 200, 1500, 10), cl = ri(rng, 300, 2000, 10), oc = ri(rng, 50, 400, 10), cash = ri(rng, 100, 1200, 10);
      var fo = ri(rng, 800, 2600, 10), fs = ri(rng, 200, 900, 10), lt = ri(rng, 500, 4000, 10);
      var quick = rng() < 0.45;
      var ca = st + cl + oc + cash, cd = fo + fs;
      var v = quick ? (ca - st) / cd : ca / cd;
      var rows = [
        [T(lang, 'Stocks', 'Inventories'), n0(st, lang)], [T(lang, 'Créances clients', 'Trade receivables'), n0(cl, lang)],
        [T(lang, 'Autres créances', 'Other receivables'), n0(oc, lang)], [T(lang, 'Trésorerie', 'Cash'), n0(cash, lang)],
        [T(lang, 'Dettes fournisseurs', 'Trade payables'), n0(fo, lang)], [T(lang, 'Dettes fiscales et sociales', 'Tax and social liabilities'), n0(fs, lang)],
        [T(lang, 'Emprunts à plus d\'un an', 'Borrowings due after one year'), n0(lt, lang)]
      ];
      var ch = C.buildChoices(rng, v, [
        { v: quick ? ca / cd : (ca - st) / cd, err: 'lecture' },
        { v: 1 / v, err: 'sens' },
        { v: (quick ? ca - st : ca) / (cd + lt), err: 'lecture' },
        { v: (quick ? ca - st - cash : ca - cash) / cd, err: 'lecture' }
      ], function (x) { return U.fmtNum(x, lang, 2); }, 5, { dec: 2, positive: true });
      return {
        prompt: quick
          ? T(lang, 'Quel est le ratio de liquidité réduite (actif circulant hors stocks ÷ dettes à court terme) ?', 'What is the quick ratio (current assets excluding inventories ÷ current liabilities)?')

        visual: table(T(lang, 'Extrait du bilan au 31/12/2025 (k€)', 'Balance sheet extract at 31/12/2025 (€k)'), [T(lang, 'Poste', 'Item'), T(lang, 'Montant', 'Amount')], rows),
        unit: 'x', dec: 2, value: v, choices: ch.choices, answer: ch.answer,
        explain: [
          'Actif circulant = ' + [st, cl, oc, cash].map(function (x) { return n0(x, 'fr'); }).join(' + ') + ' = ' + n0(ca, 'fr') + ' k€' + (quick ? ' ; hors stocks : ' + n0(ca - st, 'fr') + ' k€.' : '.'),
          'Dettes à court terme = ' + n0(fo, 'fr') + ' + ' + n0(fs, 'fr') + ' = ' + n0(cd, 'fr') + ' k€ (les emprunts à plus d\'un an n\'en font pas partie).',
          'Ratio = ' + n0(quick ? ca - st : ca, 'fr') + ' ÷ ' + n0(cd, 'fr') + ' = ' + U.fmtNum(v, 'fr', 2) + '.'

  def({

  <script>
/* Big4 Prep — générateurs de raisonnement abstrait / logique inductive.
   Figures décrites par des données (formes, rotations, couleurs, nombre d'éléments) et dessinées en SVG.
   Chaque générateur applique une ou deux règles, calcule la bonne figure et fabrique des distracteurs
   qui ne respectent qu'une partie de la règle. La clé canonique d'une figure tient compte des symétries
   (un carré tourné de 90° est identique) : deux propositions ne peuvent pas être visuellement identiques.
   Types d'erreurs : partielle (une règle sur deux), pas (mauvais pas), sens (mauvais sens), decalage (une étape de trop ou de moins), autre. */
(function (root) {
  'use strict';
  var BP = root.BP = root.BP || {};
  var U = BP.util || (typeof require !== 'undefined' ? require('../core/util.js') : null);
  var ri = U.randInt, pick = U.pick;

  var ERR_LABELS = {
    partielle: 'Une seule des règles appliquée',
    pas: 'Mauvais pas de progression',
    sens: 'Mauvais sens de rotation / de déplacement',
    decalage: 'Une étape de trop ou de moins',
    autre: 'Règle mal identifiée'
  };

  /* ---------------- Figures ---------------- */

  function mod(a, n) { return ((a % n) + n) % n; }
  function symOf(it) {
    if (it.t === 'circle') return 1;
    if (it.t === 'poly') return 360 / it.sides;
    if (it.t === 'star') return 72;
    return 360;
  }
  /** Clé canonique d'une figure (rotations ramenées selon la symétrie de la forme). */
  function key(fig) {
    return JSON.stringify(fig.map(function (it) {
      var o = {};
      Object.keys(it).sort().forEach(function (k) { o[k] = it[k]; });
      if ('rot' in o) o.rot = symOf(it) === 1 ? 0 : mod(o.rot, symOf(it));
      if (o.t === 'quarters') o.q = o.q.join('');

    }));
  }

  var FILL = { black: 'fig-black', white: 'fig-white', grey: 'fig-grey' };
  function rotPt(x, y, deg) {
    var a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return [50 + x * c - y * s, 50 + x * s + y * c];
  }
  function pts(list) { return list.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }

  var DICE = {
    1: [[50, 50]], 2: [[32, 32], [68, 68]], 3: [[30, 30], [50, 50], [70, 70]], 4: [[32, 32], [68, 32], [32, 68], [68, 68]],
    5: [[30, 30], [70, 30], [50, 50], [30, 70], [70, 70]], 6: [[32, 28], [68, 28], [32, 50], [68, 50], [32, 72], [68, 72]],
    7: [[30, 28], [70, 28], [30, 50], [50, 50], [70, 50], [30, 72], [70, 72]], 8: [[30, 26], [50, 26], [70, 26], [30, 50], [70, 50], [30, 74], [50, 74], [70, 74]],
    9: [[28, 28], [50, 28], [72, 28], [28, 50], [50, 50], [72, 50], [28, 72], [50, 72], [72, 72]]
  };
  var SMALL = { // points à l'intérieur d'un polygone
    1: [[50, 54]], 2: [[42, 54], [58, 54]], 3: [[40, 58], [50, 46], [60, 58]], 4: [[42, 46], [58, 46], [42, 60], [58, 60]],
    5: [[40, 46], [60, 46], [50, 53], [40, 60], [60, 60]], 6: [[40, 44], [50, 44], [60, 44], [40, 60], [50, 60], [60, 60]],
    7: [[40, 44], [50, 44], [60, 44], [50, 52], [40, 60], [50, 60], [60, 60]], 8: [[38, 44], [46, 44], [54, 44], [62, 44], [38, 60], [46, 60], [54, 60], [62, 60]]
  };

  function itemSVG(it) {
    var cls = FILL[it.fill || 'white'] || 'fig-white';
    var r, i, p, out = [];
    switch (it.t) {
      case 'circle':
        return '<circle class="' + cls + '" cx="50" cy="50" r="' + (it.r || 32) + '"/>';
      case 'poly':
        r = it.r || 34; p = [];
        for (i = 0; i < it.sides; i++) { var a = -90 + i * 360 / it.sides; p.push(rotPt(r * Math.cos(a * Math.PI / 180), r * Math.sin(a * Math.PI / 180), it.rot || 0)); }
        return '<polygon class="' + cls + '" points="' + pts(p) + '"/>';
      case 'star':
        p = [];
        for (i = 0; i < 10; i++) { var rr = i % 2 ? 15 : 36, b = -90 + i * 36; p.push(rotPt(rr * Math.cos(b * Math.PI / 180), rr * Math.sin(b * Math.PI / 180), it.rot || 0)); }
        return '<polygon class="' + cls + '" points="' + pts(p) + '"/>';
      case 'arrow':
        p = [[0, -36], [-20, -10], [-8, -10], [-8, 32], [8, 32], [8, -10], [20, -10]].map(function (q) { return rotPt(q[0], q[1], it.rot || 0); });
        return '<polygon class="' + cls + '" points="' + pts(p) + '"/>';
      case 'dots':
        return (it.inner ? SMALL : DICE)[it.n].map(function (q) { return '<circle class="' + cls + '" cx="' + q[0] + '" cy="' + q[1] + '" r="' + (it.inner ? 3.6 : 7) + '"/>'; }).join('');
      case 'marker':
        var ang = (-90 + it.pos * 45) * Math.PI / 180;
        return '<circle class="' + cls + '" cx="' + (50 + 42 * Math.cos(ang)).toFixed(1) + '" cy="' + (50 + 42 * Math.sin(ang)).toFixed(1) + '" r="6.5"/>';
      case 'lines':
        out.push('<rect class="fig-white" x="20" y="20" width="60" height="60"/>');
        for (i = 1; i <= it.n; i++) {
          var c = 20 + 60 * i / (it.n + 1);
          out.push(it.dir === 'h' ? '<line class="fig-line" x1="20" x2="80" y1="' + c.toFixed(1) + '" y2="' + c.toFixed(1) + '"/>' : '<line class="fig-line" y1="20" y2="80" x1="' + c.toFixed(1) + '" x2="' + c.toFixed(1) + '"/>');
        }
        return out.join('');
      case 'quarters':
        // quarts : 0 haut-droit, 1 bas-droit, 2 bas-gauche, 3 haut-gauche
        var paths = ['M50 50 L50 16 A34 34 0 0 1 84 50 Z', 'M50 50 L84 50 A34 34 0 0 1 50 84 Z', 'M50 50 L50 84 A34 34 0 0 1 16 50 Z', 'M50 50 L16 50 A34 34 0 0 1 50 16 Z'];
        return it.q.map(function (f, k) { return '<path class="' + (f ? 'fig-black' : 'fig-white') + '" d="' + paths[k] + '"/>'; }).join('');
      default: return '';
    }
  }

  function figureSVG(fig, label) {
    return '<svg class="fig" viewBox="0 0 100 100" role="img" aria-label="' + (label || 'Figure') + '" xmlns="http://www.w3.org/2000/svg">' +
      fig.map(itemSVG).join('') + '</svg>';
  }

  /* ---------------- Outils ---------------- */

  /** Assemble les propositions : la bonne d'abord, puis des distracteurs de clés différentes. */
  function options(rng, correct, wrongs, count) {
    count = count || 5;
    var seen = {}, out = [{ fig: correct, err: null }];
    seen[key(correct)] = 1;
    wrongs.forEach(function (w) {
      if (out.length >= count || !w || !w.fig) return;
      var k = key(w.fig);
      if (seen[k]) return;
      seen[k] = 1; out.push({ fig: w.fig, err: w.err || 'autre' });
    });
    var sh = U.shuffle(out, rng);
    return { choices: sh, answer: sh.indexOf(out[0]) };
  }
  function numOptions(rng, correct, wrongs, count, fmt) {
    count = count || 5; fmt = fmt || String;
    var seen = {}, out = [{ text: fmt(correct), value: correct, err: null }];
    seen[fmt(correct)] = 1;

        h('button', { class: 'btn btn-soft', type: 'button', onclick: function () { openSub('plan'); } }, [h('span', { class: 'btn-title', text: 'Plan de préparation' }), h('span', { class: 'btn-sub', text: st.plan.testDate ? 'Test le ' + UI.formatDay(st.plan.testDate) : '2 ou 4 semaines' })]),

  /* ====================== Liste des modules ====================== */

  function renderModules() {
    var fiches = app.content.fiches;
    function ficheRow(id) {
      var f = fiches.filter(function (x) { return x.id === id; })[0];
      if (!f) return null;

        h('span', { class: 'theme-icon', text: f.icon }), h('span', { class: 'theme-body' }, [h('span', { class: 'theme-title', text: f.title }), h('span', { class: 'theme-meta', text: 'Fiche' })])

    setMain([
      h('h1', { class: 'page-title', text: 'S\'entraîner' }),

      h('div', { class: 'theme-list' }, Q.ORDER.map(function (m) {

          h('span', { class: 'theme-icon', text: M.icon }),
          h('span', { class: 'theme-body' }, [h('span', { class: 'theme-title', text: M.title }), h('span', { class: 'theme-meta', text: due ? due + ' révision' + (due > 1 ? 's' : '') + ' à faire' : M.desc.split('.')[0] + '.' })]),
          levelChip(m)
        ]);
      })),
      h('h2', { class: 'section-title', text: 'Tests de personnalité et jeux' }),
      h('div', { class: 'theme-list' }, [
        ficheRow('personnalite'),
        h('button', { class: 'theme-row', type: 'button', id: 'open-games', onclick: function () { openSub('game', null); } }, [
          h('span', { class: 'theme-icon', text: '🎮' }), h('span', { class: 'theme-body' }, [h('span', { class: 'theme-title', text: 'Tests « jeux » : fiche et mini-jeux' }), h('span', { class: 'theme-meta', text: 'Familiarisation, pas une reproduction' })])
        ])
      ]),
      h('h2', { class: 'section-title', text: 'Fiches' }),
      h('div', { class: 'theme-list' }, [ficheRow('formats'), ficheRow('strategie'), ficheRow('verbal')])
    ]);
  }

  /* ====================== Écran d'un module ====================== */

  function renderModule(m) {
    var M = Q.MODULES[m], st = app.state, s = STATS.moduleStats(st.log, m), lv = STATS.levelLabel(s);
    var F = SC.FORMATS[m];
    var parts = [subHeader(M.title), h('p', { class: 'theme-desc', text: M.desc })];
    parts.push(h('div', { class: 'stat-row' }, [
      statBox(s.n ? Math.round(s.acc * 100) + ' %' : '–', 'réussite récente'),
      statBox(s.n ? Math.round(s.avgMs / 1000) + ' s' : '–', 'temps moyen'),
      statBox(lv.label, 'niveau')
    ]));
    parts.push(h('p', { class: 'cta-note', text: 'Temps cible : environ ' + M.target + ' s par question. ' + (s.n ? 'Vitesse : ' + (STATS.speedLabel(s) || '–') + '.' : '') }));

    if (m === 'anglais') {
      parts.push(h('section', { class: 'card' }, [
        h('h2', { text: 'Anglais : allez plus loin avec English Pro' }),
        h('p', { class: 'cta-note', text: 'Ce module ne contient que quelques questions de type test de recrutement. Votre application English Pro couvre l\'anglais professionnel en profondeur.' }),
        h('a', { class: 'btn btn-soft btn-block', href: ENGLISH_PRO_URL, target: '_blank', rel: 'noopener' }, 'Ouvrir English Pro')
      ]));
    }
    var actions = [h('button', { class: 'btn btn-primary btn-block', id: 'train-btn', type: 'button', onclick: function () { startTraining(m); } }, 'Entraînement (' + TRAIN_SIZE + ' questions)')];
    if (F) actions.push(h('button', { class: 'btn btn-soft btn-block', id: 'sim-btn', type: 'button', onclick: function () { startSim(m); } }, [
      h('span', { class: 'btn-title', text: 'Simulation' }), h('span', { class: 'btn-sub', text: F.n + ' questions en ' + F.minutes + ' minutes, sans retour en arrière' })
    ]));
    if (m === 'verbal') actions.push(h('button', { class: 'btn btn-quiet btn-block', type: 'button', onclick: function () { openSub('fiche', 'verbal'); } }, 'Fiche méthode : Vrai / Faux / On ne peut pas savoir'));
    parts.push(h('section', { class: 'card' }, actions));

    if (m === 'numerique' || m === 'abstrait') {
      var gens = m === 'numerique' ? BP.gen.numeric.GENS : BP.gen.abstract.GENS, gs = STATS.genStats(st.log, m);
      var errs = STATS.errorStats(st.log, m);
      var errKeys = Object.keys(errs).sort(function (a, b) { return errs[b] - errs[a]; });
      if (errKeys.length) {
        var maxE = errs[errKeys[0]];
        parts.push(h('section', { class: 'card' }, [
          h('h2', { text: 'Vos erreurs les plus fréquentes' }),
          h('div', { class: 'err-bars' }, errKeys.slice(0, 5).map(function (k) {
            return h('div', { class: 'err-row' }, [h('span', { text: Q.errLabel(m, k) }), h('strong', { text: String(errs[k]) }), progressBar(errs[k], maxE, 'bar-thin')]);
          })),
          h('p', { class: 'cta-note', text: 'L\'entraînement fait revenir plus souvent les types de questions que vous réussissez le moins.' })
        ]));
      }
      parts.push(h('h2', { class: 'section-title', text: 'S\'entraîner sur un type précis' }));
      parts.push(h('div', { class: 'theme-list' }, gens.map(function (g) {
        var x = gs[g.id];
        return h('button', { class: 'theme-row', type: 'button', 'data-gen': g.id, onclick: function () { startTraining(m, { gen: g.id, label: g.title }); } }, [
          h('span', { class: 'theme-body' }, [h('span', { class: 'theme-title', text: g.title }), h('span', { class: 'theme-meta', text: (g.skill ? g.skill + ' · ' : '') + 'difficulté ' + g.difficulty + '/3 · ' + g.targetSec + ' s' })]),
          h('span', { class: 'theme-pct', text: x && x.n ? Math.round(x.ok / x.n * 100) + ' %' : '–' })
        ]);
      })));
    }
    if (m === 'technique') {
      var themes = {};
      itemsOf('technique').forEach(function (it) { themes[it.theme] = (themes[it.theme] || 0) + 1; });
      var terr = STATS.errorStats(st.log, 'technique');
      parts.push(h('h2', { class: 'section-title', text: 'Par thème' }));
      parts.push(h('div', { class: 'theme-list' }, Object.keys(themes).sort(function (a, b) { return (terr[b] || 0) - (terr[a] || 0) || themes[b] - themes[a]; }).map(function (th) {
        return h('button', { class: 'theme-row', type: 'button', onclick: function () { startTraining('technique', { filter: function (it) { return it.theme === th; }, label: Q.THEMES[th] || th }); } }, [
          h('span', { class: 'theme-body' }, [h('span', { class: 'theme-title', text: Q.THEMES[th] || th }), h('span', { class: 'theme-meta', text: themes[th] + ' questions' + (terr[th] ? ' · ' + terr[th] + ' erreur(s) récente(s)' : '') })])
        ]);
      })));
    }
    setMain(parts, 'main-sub');
  }

  /* ====================== Lancement d'une série de questions ====================== */

  function newRunId() { return 'run-' + app.state.deviceId + '-' + now().toString(36); }

  function queueFor(module, n, opts) {
    return Q.buildQueue(module, {
      content: app.content, state: app.state, today: today(), rng: Math.random, pref: app.state.settings.questionLang,
      n: n, gen: opts && opts.gen, filter: opts && opts.filter, sim: !!(opts && opts.sim)
    });
  }

  /** Entraînement : correction après chaque question, chrono indicatif. */
  function startTraining(module, opts) {
    opts = opts || {};
    var queue = queueFor(module, TRAIN_SIZE, opts);
    if (!queue.length) { UI.toast('Aucune question disponible pour ce module.'); return; }
    closeSheet();
    app.run = {
      id: newRunId(), mode: 'train', module: module, label: opts.label || Q.MODULES[module].title, opts: { gen: opts.gen || null },
      filter: opts.filter || null,
      sections: [{ module: module, n: queue.length, minutes: null, start: now(), queue: queue, answers: [] }],
      sec: 0, idx: 0, qStart: now(), phase: 'answer', scratch: {}, startedAt: now()
    };
    openSub('run');
  }

  /**
   * Simulation : conditions réelles. kind = module | 'complete' | 'custom' (opts.sections, opts.label).
   * Chaque section a son propre chronomètre, lancé quand on commence la section.
   */
  function startSim(kind, opts) {
    opts = opts || {};
    var F = SC.FORMATS[kind], sections;
    if (kind === 'complete' || kind === 'custom') sections = (opts.sections || SC.FORMATS.complete.sections).map(function (s) { return { module: s.module, n: s.n, minutes: s.minutes }; });
    else sections = [{ module: kind, n: F.n, minutes: F.minutes }];
    sections.forEach(function (s) {
      s.queue = queueFor(s.module, s.n, { sim: true });
      s.n = s.queue.length; s.start = null; s.answers = [];
    });
    closeSheet();
    app.run = {
      id: newRunId(), mode: 'sim', module: kind === 'custom' ? 'complete' : kind,
      label: opts.label || (F ? 'Simulation — ' + F.label : 'Simulation'),
      sections: sections, sec: 0, idx: 0, qStart: null, phase: 'intro', scratch: {}, startedAt: now()
    };
    app.pendingSim = null;
    app.store.saveSim(app.run);
    openSub('run');
  }

  function resumeSim() {
    if (!app.pendingSim) return;
    app.run = app.pendingSim; app.pendingSim = null;
    openSub('run');
    checkExpiry();
  }

  function curSection() { return app.run.sections[app.run.sec]; }
  function curQ() { var s = curSection(); return s.queue[app.run.idx]; }

  function persistSim() { if (app.run && app.run.mode === 'sim') app.store.saveSim(app.run); }

  /** Enregistre la réponse à la question en cours. resp = null : question passée ou non traitée. */
  function record(resp, reason) {
    var run = app.run, s = curSection(), q = curQ(), t = now();
    var ms = run.qStart ? TM.questionTime(run.qStart, t) : 0;
    var ev = Q.evaluate(q, resp);
    var ans = { resp: resp, points: ev.points, err: ev.err, ms: ms, targetSec: q.targetSec, module: q.module, result: ev.result };
    s.answers[run.idx] = ans;
    var st = app.state;
    // Journal (statistiques, adaptation) — une question non traitée compte comme ratée sans type d'erreur
    ST.logAnswer(st, { m: q.module, g: q.g, ok: ev.points == null ? 0 : (ev.points >= 1 ? 1 : ev.points >= 0.5 ? 0.5 : 0), ms: ms, tgt: q.targetSec, e: ev.points == null ? (reason || 'non-repondu') : ev.err, s: run.mode === 'sim' ? 's' : 't', l: q.lang }, t);
    // Répétition espacée (technique, SJT, anglais)
    if (q.srs && ev.points != null) st.cards[q.srs] = SRS.review(st.cards[q.srs], ev.result === 'correct' ? 'correct' : ev.result === 'almost' ? 'almost' : 'wrong', today(), t);
    if (q.passage) st.seenPassages[q.passage.id] = today();
    var xp = ev.points == null ? 0 : ev.result === 'correct' ? G.XP.correct : ev.result === 'almost' ? G.XP.almost : G.XP.wrong;
    var g = G.addActivity(st, xp, ms, today());
    app.store.save(st);
    if (g.reachedNow) UI.toast(g.freezeEarned ? 'Objectif du jour atteint ! Un gel de série gagné.' : 'Objectif du jour atteint !');
    return { ans: ans, ev: ev };
  }

  /* ---------- Chronomètre ---------- */

  function startTick() {
    stopTick();
    app.tick = setInterval(function () { updateClock(); checkExpiry(); }, 500);
  }
  function stopTick() { if (app.tick) { clearInterval(app.tick); app.tick = null; } }

  function updateClock() {
    var el = document.getElementById('run-clock');
    if (!el || !app.run) return;
    var run = app.run, s = curSection(), t = now();
    if (run.mode === 'sim' && s.start != null) {
      var rem = TM.remaining(TM.countdown(s.start, s.minutes * 60000), t);
      el.textContent = TM.format(rem);
      el.className = 'clock' + (rem < 60000 ? ' is-low' : '');
    } else if (run.mode === 'train' && run.qStart && run.phase === 'answer') {
      var q = curQ(), e = t - run.qStart;
      el.textContent = TM.format(e) + ' / ' + TM.format(q.targetSec * 1000);
      el.className = 'clock' + (e > q.targetSec * 1000 ? ' is-over' : '');
    }
  }

  /** Temps écoulé en simulation : la section se termine, les questions restantes sont non traitées. */
  function checkExpiry() {
    var run = app.run;
    if (!run || run.mode !== 'sim' || run.phase !== 'answer') return;
    var s = curSection();
    if (s.start == null || !TM.expired(TM.countdown(s.start, s.minutes * 60000), now())) return;
    // Une réponse complète déjà sélectionnée mais non validée est prise en compte.
    var pending = app.currentView ? app.currentView.response() : null;
    record(pending, 'non-repondu');
    for (var i = run.idx + 1; i < s.queue.length; i++) {
      s.answers[i] = { resp: null, points: null, err: null, ms: 0, targetSec: s.queue[i].targetSec, module: s.queue[i].module, result: 'skipped' };
      ST.logAnswer(app.state, { m: s.queue[i].module, g: s.queue[i].g, ok: 0, ms: 0, tgt: s.queue[i].targetSec, e: 'non-repondu', s: 's', l: s.queue[i].lang }, now());
    }
    app.store.save(app.state);
    UI.toast('Temps écoulé pour cette section.');
    endSection();
  }

  function endSection() {
    var run = app.run;
    if (run.sec < run.sections.length - 1) {
      run.sec++; run.idx = 0; run.phase = 'intro'; run.qStart = null;
      persistSim(); renderRun();
    } else finishRun();
  }

  /* ---------- Écran de question ---------- */

  function renderRun() {
    var run = app.run;
    if (!run) { closeSub(); return; }
    var s = curSection();
    if (run.phase === 'intro') return renderSectionIntro();
    var q = curQ();
    if (!run.qStart) run.qStart = now();
    var calcAllowed = q.module === 'numerique' || q.module === 'technique';
    var head = h('div', { class: 'run-head' }, [
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Quitter', onclick: quitRun, html: ICONS.close }),
      h('div', { class: 'bar bar-session' }, h('div', { class: 'bar-fill', style: 'width:' + Math.round(run.idx / s.queue.length * 100) + '%' })),
      h('span', { class: 'run-count', text: (run.idx + 1) + '/' + s.queue.length }),
      (run.mode === 'sim' || app.state.settings.indicativeTimer) ? h('span', { class: 'clock', id: 'run-clock', 'aria-live': 'off' }) : null,
      calcAllowed ? h('button', { class: 'calc-btn', type: 'button', id: 'calc-open', 'aria-label': 'Calculatrice et brouillon', onclick: function () { openSheet('calc'); }, html: ICONS.calc }) : null
    ]);
    var meta = h('div', { class: 'ex-meta row' }, [
      h('span', { class: 'tag', text: Q.MODULES[q.module].short + (run.sections.length > 1 ? ' · section ' + (run.sec + 1) + '/' + run.sections.length : '') }),
      q.lang === 'en' ? h('span', { class: 'tag', text: 'EN' }) : null
    ]);
    var view, checkBtn, skipBtn;
    view = Q.renderQuestion(q, { onChange: function () { if (checkBtn) checkBtn.disabled = !view.response(); } });
    app.currentView = view;
    var foot;
    if (run.mode === 'train') {
      checkBtn = h('button', { class: 'btn btn-primary btn-block', id: 'check', type: 'button', disabled: true, onclick: function () {
        var resp = view.response();
        if (!resp) return;
        var r = record(resp);
        run.phase = 'feedback';
        view.lock(r.ev);
        showFeedback(q, resp, r);
      } }, 'Valider');
      foot = h('div', { class: 'session-foot', id: 'foot' }, [checkBtn]);
    } else {
      checkBtn = h('button', { class: 'btn btn-primary btn-block', id: 'check', type: 'button', disabled: true, onclick: function () {
        var resp = view.response();
        if (!resp) return;
        record(resp); next();
      } }, run.idx === s.queue.length - 1 ? 'Valider et terminer la section' : 'Valider et suivante');
      skipBtn = h('button', { class: 'btn btn-quiet btn-block', id: 'skip', type: 'button', onclick: function () { record(null, 'passe'); next(); } }, 'Passer (sans retour possible)');
      foot = h('div', { class: 'session-foot', id: 'foot' }, [checkBtn, skipBtn]);
    }
    setMain([head, meta, h('div', { class: 'session-body', 'data-q': q.qid, 'data-module': q.module }, view.el), foot], 'main-sub main-session' + (app.sheet ? ' with-sheet' : ''));
    updateClock();
    if (app.sheet) renderSheet();
    startTick();
  }

  function next() {
    var run = app.run, s = curSection();
    if (app.sheet && app.sheet.tab === 'calc') { /* la calculatrice reste ouverte */ }
    if (run.idx < s.queue.length - 1) {
      run.idx++; run.qStart = now(); run.phase = 'answer';
      persistSim();
      renderRun();
      window.scrollTo(0, 0);
    } else if (run.mode === 'sim') endSection();
    else finishRun();
  }

  function showFeedback(q, resp, r) {
    var foot = document.getElementById('foot');
    var res = r.ev.result;
    var title = res === 'correct' ? 'Bonne réponse' : res === 'almost' ? 'Presque' : 'Réponse incorrecte';
    var cont = h('button', { class: 'btn btn-block btn-continue', id: 'continue', type: 'button', onclick: function () { next(); } }, app.run.idx === curSection().queue.length - 1 ? 'Voir le bilan' : 'Continuer');
    var fb = h('div', { class: 'feedback fb-' + (res === 'correct' ? 'correct' : res === 'almost' ? 'almost' : 'wrong'), role: 'status' }, [
      h('p', { class: 'fb-title', text: title }),
      Q.feedbackBody(q, resp, r.ev, r.ans.ms),
      cont
    ]);
    UI.clear(foot);
    foot.className = 'session-foot has-feedback';
    foot.appendChild(fb);
    var clock = document.getElementById('run-clock');
    if (clock) clock.textContent = TM.format(r.ans.ms);
    setTimeout(function () { try { fb.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { /* rien */ } }, 50);
  }

  function renderSectionIntro() {
    var run = app.run, s = curSection(), M = Q.MODULES[s.module];
    stopTick();
    var tips = {
      numerique: 'Lisez la question avant le tableau. Calculatrice et brouillon : bouton en haut à droite.',
      verbal: 'Jugez uniquement d\'après le texte. « On ne peut pas savoir » quand le texte ne permet pas de trancher.',
      abstrait: 'Isolez chaque élément (forme, couleur, nombre, position) et cherchez sa règle séparément.',
      sjt: 'Pas de piège de vitesse : lisez toutes les options. Pensez qualité, intégrité, transparence avec le responsable.',
      technique: 'Questions de cours et petits calculs. Calculatrice disponible.',
      anglais: 'Questions courtes : répondez vite et passez.'
    };
    setMain([
      subHeader(run.label, quitRun),
      h('section', { class: 'card' }, [
        h('p', { class: 'muted', text: run.sections.length > 1 ? 'Section ' + (run.sec + 1) + ' sur ' + run.sections.length : 'Simulation' }),
        h('h2', { text: M.icon + ' ' + M.title }),
        h('div', { class: 'stat-row' }, [statBox(String(s.queue.length), 'questions'), statBox(s.minutes + ' min', 'chronomètre'), statBox(Math.round(s.minutes * 60 / s.queue.length) + ' s', 'par question')]),
        h('p', { class: 'cta-note', text: tips[s.module] }),
        h('p', { class: 'cta-note', text: 'Pas de correction avant la fin. Une question validée ou passée ne peut plus être modifiée. Le chronomètre continue même si vous quittez l\'application.' }),
        h('button', { class: 'btn btn-primary btn-block btn-hero', id: 'start-section', type: 'button', onclick: function () {
          s.start = now(); run.phase = 'answer'; run.idx = 0; run.qStart = now();
          persistSim(); renderRun();
        } }, 'Démarrer le chronomètre')
      ])
    ], 'main-sub');
  }

  function quitRun() {
    var run = app.run;
    if (!run) return closeSub();
    if (run.mode === 'train') {
      var done = run.sections[0].answers.filter(Boolean).length;
      if (!done) { stopTick(); app.run = null; closeSub(); return; }
      UI.confirmModal('Arrêter l\'entraînement ?', 'Vos ' + done + ' réponse(s) sont enregistrées. Vous verrez le bilan de cette série.', 'Voir le bilan', function () { finishRun(); });
      return;
    }
    UI.modal({
      title: 'Quitter la simulation ?',
      body: 'Le chronomètre ne s\'arrête pas : comme dans un vrai test, il continue de tourner. Vous pouvez revenir plus tard depuis l\'accueil, ou terminer maintenant (les questions restantes seront comptées comme non traitées).',
      actions: [
        { label: 'Continuer le test' },
        { label: 'Revenir plus tard', onClick: function () { persistSim(); stopTick(); app.pendingSim = app.run; app.run = null; closeSheet(); closeSub(); } },
        { label: 'Terminer maintenant', kind: 'danger', onClick: function () { abandonSim(); } }
      ]
    });
  }

  function abandonSim() {
    var run = app.run;
    run.sections.forEach(function (s, si) {
      if (si < run.sec) return;
      for (var i = 0; i < s.queue.length; i++) {
        if (si === run.sec && i < run.idx) continue;
        if (s.answers[i]) continue;
        s.answers[i] = { resp: null, points: null, err: null, ms: 0, targetSec: s.queue[i].targetSec, module: s.queue[i].module, result: 'skipped' };
        ST.logAnswer(app.state, { m: s.queue[i].module, g: s.queue[i].g, ok: 0, ms: 0, tgt: s.queue[i].targetSec, e: 'non-repondu', s: 's', l: s.queue[i].lang }, now());
      }
    });
    finishRun();
  }

  /** Fin d'une série : bilan (et XP de simulation). */
  function finishRun() {
    var run = app.run;
    stopTick(); closeSheet();
    var all = [];

  var calcState = { expr: '', ans: null, last: '' };

  function calcPress(k) {
    var e = calcState.expr;
    if (k === 'C') { calcState.expr = ''; calcState.last = ''; }
    else if (k === '⌫') calcState.expr = e.slice(0, -1);
    else if (k === '=') {
      var r = CALC.evaluate(e);
      if (r.ok) { calcState.last = e.replace(/\*/g, '×').replace(/\//g, '÷') + ' ='; calcState.ans = r.value; calcState.expr = CALC.display(r.value).replace('−', '-'); }
      else calcState.last = r.error;
    } else if (k === 'ANS') { if (calcState.ans != null) calcState.expr = e + CALC.display(calcState.ans).replace('−', '-'); }
    else if (k === '±') calcState.expr = e ? '-(' + e + ')' : '-';
    else calcState.expr = e + k;
    paintCalc();
  }

  function paintCalc() {
    var ex = document.getElementById('calc-expr'), val = document.getElementById('calc-val');
    if (!ex || !val) return;
    var shown = calcState.expr.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
    ex.textContent = calcState.last || '';
    var r = calcState.expr ? CALC.evaluate(calcState.expr) : null;
    val.textContent = shown || '0';
    if (r && r.ok && /[+\-*/%()]/.test(calcState.expr.replace(/^-/, ''))) ex.textContent = (calcState.last ? calcState.last + '  ' : '') + '= ' + CALC.display(r.value);
  }

  function scheduleNotification() {
    clearTimeout(app.notifTimer);
    var st = app.state;
    if (!st.settings.notifications) return;
    var sup = R.notificationSupport(window);
    if (!sup.supported || sup.permission !== 'granted') return;
    var ms = R.msUntil(st.settings.reminderTime, new Date(now()));
    if (ms == null) return;
    app.notifTimer = setTimeout(function () { if (!G.goalReached(app.state, today())) showNotification(); scheduleNotification(); }, Math.min(ms, 2147483000));
  }

  function showNotification() {
    var options = { body: 'Votre entraînement du jour vous attend.', icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'big4-prep-daily' };
    try {
      if (app.swRegistration && app.swRegistration.showNotification) app.swRegistration.showNotification('Big4 Prep', options);
      else new window.Notification('Big4 Prep', options);
    } catch (e) { /* rien */ }
  }

  /* ====================== Démarrage ====================== */

  function registerServiceWorker() {
    if (!('serviceWorker' in navigator) || UI.inFrame()) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
    navigator.serviceWorker.register('sw.js').then(function (reg) { app.swRegistration = reg; }).catch(function (err) { console.warn('[Big4 Prep] Service worker non enregistré :', err); });
  }

  function boot() {
    main = document.getElementById('main');
    nav = document.getElementById('nav');
    var storage = null;
    try { storage = window.localStorage; } catch (e) { storage = null; }
    app.store = ST.createStore(storage);
    initSync();
    app.state = app.store.load(now());
    if (!app.state.createdAt) app.state.createdAt = now();
    var pending = app.store.loadSim();
    if (pending && pending.sections && pending.sections.length) app.pendingSim = pending;

    var initial = (location.hash || '').replace('#', '');
    if (TABS.some(function (t) { return t.id === initial; })) app.tab = initial;

    window.addEventListener('hashchange', function () {
      var id = (location.hash || '').replace('#', '');
      if (!app.sub && id !== app.tab && TABS.some(function (t) { return t.id === id; })) { app.tab = id; render(); }
    });
    window.addEventListener('popstate', function () {
      if (!app.sub) { syncHash(); return; }
      if (app.sub === 'run' && app.run) { try { history.pushState({ bp: 'sub' }, ''); } catch (e) { /* rien */ } quitRun(); }
      else closeSub();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        if (app.run) { updateClock(); checkExpiry(); }
        else if (!app.sub && app.tab === 'accueil') render();
        syncIfStale();
      } else {
        if (app.run) persistSim();
        if (sync.isConnected() && !busy()) { clearTimeout(syncTimer); runSync(false); }
      }
    });
    window.addEventListener('online', function () { if (sync.pending) scheduleSync(1000); });
    window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); app.installPrompt = ev; if (!app.sub && app.tab === 'reglages') render(); });

    loadContent().then(function (files) {
      app.content = C.install((files || []).filter(Boolean));
      if (app.content.errors.length) app.contentErrors = app.contentErrors.concat(app.content.errors);
      G.settleStreak(app.state, today());
      save();
      document.body.classList.remove('is-loading');
      render();
      scheduleNotification();
      registerServiceWorker();
      if (sync.isConnected()) runSync(false);
    }).catch(function (err) {
      console.error(err);
      document.body.classList.remove('is-loading');
      setMain([
        h('h1', { class: 'page-title', text: 'Contenu introuvable' }),
        h('p', { class: 'lead', text: 'Les fichiers de contenu n\'ont pas pu être chargés. Si vous avez ouvert index.html directement depuis un dossier, ouvrez plutôt apercu.html ou déployez l\'application (voir le README).' }),
        h('p', { class: 'form-error', text: String(err && err.message || err) })
      ]);
    });
  }

  app.startTraining = startTraining;
  app.startSim = startSim;
  app.goTab = goTab;
  app.render = render;
  app.runSync = runSync;
  app.openSub = openSub;
  app.finishRun = finishRun;
  app.checkExpiry = checkExpiry;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
