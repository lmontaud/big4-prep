remier sorti)","Coût unitaire moyen pondéré","Identification spécifique pour des biens non interchangeables"],"explain":"Le DEPS (LIFO) est interdit : il peut sous-évaluer durablement les stocks. Les méthodes admises sont le PEPS et le CUMP (et l'identification spécifique pour les éléments non fongibles).","ref":"IAS 2, § 23-25 ; PCG","difficulty":2,"time":35},{"id":"T072","module":"technique","lang":"fr","type":"calcul","theme":"tva","q":"Un montant TTC de 3 000 € comprend une TVA à 20 %. Quel est le montant HT ?","answer":"2 500 €","distractors":["2 400 €","2 600 €","3 600 €"],"explain":"HT = TTC ÷ 1,20 = 3 000 ÷ 1,2 = 2 500 €. Retirer 20 % du TTC (2 400 €) est faux car la TVA se calcule sur le HT.","ref":"CGI, art. 278","difficulty":1,"time":35},{"id":"T073","module":"technique","lang":"fr","type":"calcul","theme":"ratios","q":"Stocks : 120 k€. Créances clients : 260 k€. Dettes fournisseurs : 180 k€. Quel est le besoin en fonds de roulement d'exploitation ?","answer":"200 k€","distractors":["560 k€","380 k€","80 k€"],"explain":"BFRE = stocks + créances d'exploitation − dettes d'exploitation = 120 + 260 − 180 = 200 k€.","ref":"Analyse financière (bilan fonctionnel)","difficulty":1,"time":40},{"id":"T074","module":"technique","lang":"fr","type":"calcul","theme":"ratios","q":"Résultat net : 50 k€. Dotations aux amortissements et provisions : 30 k€. Reprises sur provisions : 5 k€. Pas de cession d'actif. Capacité d'autofinancement ?","answer":"75 k€","distractors":["85 k€","80 k€","45 k€"],"explain":"Méthode additive : CAF = résultat net + dotations − reprises (éléments calculés sans effet sur la trésorerie) = 50 + 30 − 5 = 75 k€.","ref":"Analyse financière (CAF, méthode additive)","difficulty":2,"time":45},{"id":"T075","module":"technique","lang":"fr","type":"calcul","theme":"ratios","q":"Valeur ajoutée : 500 k€. Subventions d'exploitation : 10 k€. Impôts et taxes : 20 k€. Charges de personnel : 330 k€. Excédent brut d'exploitation ?","answer":"160 k€","distractors":["140 k€","170 k€","180 k€"],"explain":"EBE = valeur ajoutée + subventions d'exploitation − impôts et taxes − charges de personnel = 500 + 10 − 20 − 330 = 160 k€.","ref":"PCG (soldes intermédiaires de gestion)","difficulty":2,"time":50},{"id":"T076","module":"technique","lang":"fr","type":"calcul","theme":"ratios","q":"EBE : 160 k€. Dotations aux amortissements : 45 k€. Reprises sur provisions d'exploitation : 5 k€. Pas d'autres produits ni charges d'exploitation. Résultat d'exploitation ?","answer":"120 k€","distractors":["110 k€","200 k€","115 k€"],"explain":"Résultat d'exploitation = EBE − dotations + reprises (et autres produits et charges d'exploitation) = 160 − 45 + 5 = 120 k€.","ref":"PCG (soldes intermédiaires de gestion)","difficulty":2,"time":45},{"id":"T077","module":"technique","lang":"fr","type":"qcm","theme":"fiscalite","q":"Quel est le taux normal de l'impôt sur les sociétés en France ?","answer":"25 %","distractors":["33,33 %","28 %","15 %"],"explain":"Le taux normal est de 25 % depuis 2022. Les PME éligibles bénéficient d'un taux réduit de 15 % sur une première tranche de bénéfice.","ref":"CGI, art. 219","difficulty":1,"time":30},{"id":"T078","module":"technique","lang":"fr","type":"calcul","theme":"fiscalite","q":"PME éligible au taux réduit (CA inférieur à 10 M€, capital entièrement libéré et détenu à 75 % au moins par des personnes physiques). Bénéfice imposable : 100 000 €. Impôt sur les sociétés ?","answer":"20 750 €","distractors":["25 000 €","15 000 €","18 625 €"],"explain":"15 % sur les 42 500 premiers euros = 6 375 € ; 25 % sur les 57 500 € restants = 14 375 €. Total = 20 750 €.","ref":"CGI, art. 219, I-b","difficulty":3,"time":70},{"id":"T079","module":"technique","lang":"fr","type":"qcm","theme":"fiscalite","q":"Comment enregistre-t-on, dans les comptes individuels, l'écart entre un amortissement fiscal dégressif et un amortissement comptable linéaire ?","answer":"En amortissements dérogatoires (provision réglementée, compte 145)","distractors":["En dépréciation de l'immobilisation","En provision pour risques","En charge constatée d'avance"],"explain":"L'excédent d'amortissement fiscal sur l'amortissement économique est une provision réglementée (145) : il permet de bénéficier de l'avantage fiscal sans modifier l'amortissement comptable. Il n'existe pas en IFRS.","ref":"PCG, compte 145","difficulty":2,"time":40},{"id":"T080","module":"technique","lang":"fr","type":"calcul","theme":"change","q":"Créance de 10 000 USD enregistrée au cours de 1 EUR = 1,10 USD. À la clôture, 1 EUR = 1,20 USD. Quelle provision pour perte de change (PCG, pas de couverture) ?","answer":"758 €","distractors":["833 €","909 €","0 €"],"explain":"Valeur d'origine : 10 000 ÷ 1,10 = 9 091 €. Valeur à la clôture : 10 000 ÷ 1,20 = 8 333 €. Perte latente = 758 €, inscrite en écart de conversion actif et couverte par une provision pour risque de change.","ref":"PCG (opérations en devises, écarts de conversion)","difficulty":3,"time":75},{"id":"T081","module":"technique","lang":"fr","type":"qcm","theme":"change","q":"En comptes individuels (PCG), un gain de change latent sur une créance en devise à la clôture est :","answer":"Inscrit en écart de conversion passif, sans effet sur le résultat","distractors":["Comptabilisé en produit financier","Ignoré totalement","Porté en capitaux propres"],"explain":"Par prudence, le PCG n'enregistre pas les gains latents en résultat : l'écart va au passif (écart de conversion passif). En IFRS (IAS 21), l'écart sur un élément monétaire va en résultat, qu'il soit positif ou négatif.","ref":"PCG (écarts de conversion) ; IAS 21, § 23 et 28","difficulty":2,"time":45},{"id":"T082","module":"technique","lang":"fr","type":"calcul","theme":"financement","q":"Emprunt de 100 000 € remboursable par amortissements constants sur 5 ans, taux 4 %. Montant de la première annuité ?","answer":"24 000 €","distractors":["20 000 €","22 463 €","4 000 €"],"explain":"Amortissement constant du capital : 100 000 ÷ 5 = 20 000 €. Intérêts de la 1re année sur le capital restant dû : 100 000 × 4 % = 4 000 €. Annuité = 24 000 € (les suivantes baissent).","ref":"Mathématiques financières (emprunt à amortissement constant)","difficulty":2,"time":50},{"id":"T083","module":"technique","lang":"fr","type":"qcm","theme":"location","q":"Dans les comptes individuels établis selon le PCG, un contrat de crédit-bail est traité par le preneur :","answer":"En charges de loyers, avec une information en annexe sur les engagements","distractors":["En immobilisation avec une dette financière","En stock","En provision pour charges"],"explain":"Le PCG ne retraite pas le crédit-bail dans les comptes individuels : les redevances sont des charges et les engagements figurent en annexe. En IFRS 16, le preneur inscrit un droit d'utilisation et une dette locative.","ref":"PCG ; IFRS 16 pour comparaison","difficulty":2,"time":45},{"id":"T084","module":"technique","lang":"fr","type":"calcul","theme":"location","q":"IFRS 16 : loyers de 10 000 € payables en fin d'année pendant 3 ans, taux d'actualisation 5 %. Montant initial de la dette locative ?","answer":"27 232 €","distractors":["30 000 €","28 594 €","28 500 €"],"explain":"Valeur actuelle = 10 000 ÷ 1,05 + 10 000 ÷ 1,05² + 10 000 ÷ 1,05³ = 9 524 + 9 070 + 8 638 = 27 232 €. Avec des loyers payés en début d'année, on obtiendrait 28 594 €.","ref":"IFRS 16, § 26","difficulty":3,"time":80},{"id":"T085","module":"technique","lang":"fr","type":"calcul","theme":"subventions","q":"Une subvention d'investissement de 30 000 € finance un matériel amorti en linéaire sur 5 ans. L'entreprise étale la subvention. Quote-part reprise en résultat chaque année ?","answer":"6 000 €","distractors":["30 000 €","3 000 €","10 000 €"],"explain":"La subvention inscrite en capitaux propres est rapportée au résultat au même rythme que l'amortissement du bien financé : 30 000 ÷ 5 = 6 000 € par an.","ref":"PCG (subventions d'investissement)","difficulty":2,"time":45},{"id":"T086","module":"technique","lang":"fr","type":"calcul","theme":"ratios","q":"Capitaux permanents : 800 k€. Actif immobilisé net : 650 k€. Quel est le fonds de roulement net global ?","answer":"150 k€","distractors":["1 450 k€","−150 k€","650 k€"],"explain":"FRNG = ressources stables − emplois stables = 800 − 650 = 150 k€.","ref":"Analyse financière (bilan fonctionnel)","difficulty":1,"time":40},{"id":"T087","module":"technique","lang":"fr","type":"calcul","theme":"ratios","q":"Fonds de roulement : 150 k€. Besoin en fonds de roulement : 200 k€. Quelle est la trésorerie nette ?","answer":"−50 k€","distractors":["50 k€","350 k€","−350 k€"],"explain":"Trésorerie nette = FR − BFR = 150 − 200 = −50 k€ : le BFR n'est pas entièrement financé par des ressources stables, l'entreprise recourt à des concours bancaires courants.","ref":"Analyse financière (équilibre fonctionnel)","difficulty":2,"time":40},{"id":"T088","module":"technique","lang":"fr","type":"calcul","theme":"ratios","q":"Stock moyen de marchandises : 60 000 €. Coût d'achat des marchandises vendues : 480 000 €. Durée moyenne de stockage (année de 360 jours) ?","answer":"45 jours","distractors":["8 jours","60 jours","30 jours"],"explain":"Durée = stock moyen ÷ coût d'achat des marchandises vendues × 360 = 60 000 ÷ 480 000 × 360 = 45 jours (rotation de 8 fois par an).","ref":"Analyse financière (ratios de rotation)","difficulty":2,"time":50},{"id":"T089","module":"technique","lang":"fr","type":"calcul","theme":"ratios","q":"Dettes financières nettes : 300 k€. Capitaux propres : 600 k€. Quel est le ratio d'endettement net (gearing) ?","answer":"0,5","distractors":["2","0,33","1,5"],"explain":"Gearing = dettes financières nettes ÷ capitaux propres = 300 ÷ 600 = 0,5.","ref":"Analyse financière (structure financière)","difficulty":1,"time":35},{"id":"T090","module":"technique","lang":"fr","type":"calcul","theme":"cdg","q":"Charges fixes : 240 000 €. Taux de marge sur coût variable : 40 %. Seuil de rentabilité (chiffre d'affaires) ?","answer":"600 000 €","distractors":["96 000 €","400 000 €","336 000 €"],"explain":"Seuil = charges fixes ÷ taux de marge sur coût variable = 240 000 ÷ 0,40 = 600 000 €.","ref":"Contrôle de gestion (analyse coût-volume-profit)","difficulty":2,"time":45},{"id":"T091","module":"technique","lang":"fr","type":"calcul","theme":"materialite","q":"Le cabinet retient un seuil de signification égal à 5 % du résultat courant avant impôt, qui s'élève à 6 M€. Quel est le seuil de signification ?","answer":"300 k€","distractors":["600 k€","30 k€","3 M€"],"explain":"6 000 k€ × 5 % = 300 k€. Le choix de la base (résultat, chiffre d'affaires, capitaux propres…) et du pourcentage relève du jugement professionnel.","ref":"NEP 320 ; ISA 320","difficulty":2,"time":45},{"id":"T092","module":"technique","lang":"fr","type":"calcul","theme":"materialite","q":"Seuil de signification : 300 k€. Le seuil de planification (performance materiality) est fixé à 75 %. Montant ?","answer":"225 k€","distractors":["75 k€","400 k€","300 k€"],"explain":"300 × 75 % = 225 k€. Ce seuil, inférieur au seuil de signification, réduit le risque que le cumul d'anomalies non détectées dépasse le seuil de signification.","ref":"NEP 320 ; ISA 320, § 11","difficulty":2,"time":40},{"id":"T093","module":"technique","lang":"fr","type":"calcul","theme":"materialite","q":"Seuil de signification : 300 k€. Le seuil des anomalies manifestement insignifiantes est fixé à 5 % du seuil de signification. Montant ?","answer":"15 k€","distractors":["5 k€","60 k€","150 k€"],"explain":"300 × 5 % = 15 k€. En dessous, les anomalies relevées ne sont pas cumulées (elles sont manifestement sans incidence, seules ou cumulées).","ref":"NEP 450 ; ISA 450","difficulty":2,"time":40},{"id":"T094","module":"technique","lang":"fr","type":"calcul","theme":"rapprochement","q":"Relevé bancaire : 8 400 € en faveur de l'entreprise. Chèques émis non encore débités : 1 900 €. Remise de chèques déposée non encore créditée : 600 €. Quel solde bancaire rectifié ?","answer":"7 100 €","distractors":["9 700 €","10 900 €","5 900 €"],"explain":"Solde rectifié côté banque = 8 400 − 1 900 + 600 = 7 100 €. Les chèques émis réduiront le solde, la remise l'augmentera.","ref":"Procédure de rapprochement bancaire","difficulty":2,"time":55},{"id":"T095","module":"technique","lang":"fr","type":"qcm","theme":"stocks","q":"Le coût d'entrée d'un stock de marchandises achetées comprend :","answer":"Le prix d'achat, les droits de douane et les frais de transport, déduction faite des remises commerciales","distractors":["Le prix de vente prévu diminué de la marge","Le prix d'achat et les frais de stockage après réception","Le prix d'achat TTC"],"explain":"Le coût d'acquisition comprend le prix d'achat, les droits de douane, le transport, la manutention et les autres coûts directement attribuables, après déduction des rabais et remises. Les frais de stockage postérieurs et la TVA récupérable en sont exclus.","ref":"PCG (coût d'acquisition des stocks) ; IAS 2, § 11 et 16","difficulty":2,"time":45},{"id":"T096","module":"technique","lang":"fr","type":"qcm","theme":"provisions","q":"Quelles conditions doivent être réunies pour constituer une provision ?","answer":"Une obligation existant à la clôture, une sortie de ressources probable et un montant estimable de façon fiable","distractors":["Une perte possible à long terme","Une décision de la direction d'économiser pour une dépense future","Une baisse du résultat prévisionnel"],"explain":"Une provision est un passif dont l'échéance ou le montant est incertain. Il faut une obligation (légale, contractuelle ou implicite) à la clôture, une sortie de ressources probable sans contrepartie au moins équivalente, et une estimation fiable.","ref":"PCG (provisions) ; IAS 37, § 14","difficulty":2,"time":45},{"id":"T097","module":"technique","lang":"fr","type":"qcm","theme":"provisions","q":"Une entreprise prévoit de gros travaux d'entretien sur son siège dans trois ans, sans obligation légale. En IFRS, peut-elle provisionner ces travaux ?","answer":"Non : il n'existe aucune obligation actuelle à la clôture","distractors":["Oui, pour la totalité du devis","Oui, pour un tiers du devis par an","Oui, si le conseil d'administration l'a décidé"],"explain":"Une intention de dépenser n'est pas une obligation : l'entreprise peut éviter la dépense (vendre le bâtiment, renoncer aux travaux). IAS 37 interdit la provision ; les dépenses seront traitées comme composant ou charge le moment venu.","ref":"IAS 37, § 19-20","difficulty":2,"time":45},{"id":"T098","module":"technique","lang":"fr","type":"qcm","theme":"stocks","q":"À quoi sert l'inventaire physique de fin d'exercice ?","answer":"Vérifier l'existence et la quantité réelle des stocks à la clôture","distractors":["Calculer la marge commerciale prévisionnelle","Déterminer le prix de vente des produits","Contrôler les factures fournisseurs"],"explain":"Le comptage permet de comparer les quantités réelles aux quantités théoriques et de corriger les écarts (casse, vol, erreurs). Pour l'auditeur, y assister fournit des éléments probants sur l'existence et l'état des stocks.","ref":"Code de commerce, art. L.123-12 (inventaire annuel) ; NEP 501 / ISA 501","difficulty":1,"time":35},{"id":"T099","module":"technique","lang":"fr","type":"qcm","theme":"ecritures","q":"Une facture d'achat de 1 000 € HT a été enregistrée deux fois par erreur. Comment corriger ?","answer":"Passer une écriture inverse (ou en négatif) annulant le doublon, avec une pièce justificative","distractors":["Supprimer la ligne dans le journal validé","Attendre la facture suivante pour compenser","Passer une provision pour risques"],"explain":"Une écriture validée ne se supprime pas (principe d'intangibilité) : on la contrepasse par une écriture d'annulation documentée.","ref":"Code de commerce, art. L.123-12 et s. ; PCG (caractère définitif des enregistrements)","difficulty":2,"time":45},{"id":"T100","module":"technique","lang":"fr","type":"calcul","theme":"cdg","q":"Chiffre d'affaires : 1 000 000 €. Seuil de rentabilité : 750 000 €. Quelle est la marge de sécurité, en % du chiffre d'affaires ?","answer":"25 %","distractors":["33 %","75 %","250 %"],"explain":"Marge de sécurité = CA − seuil = 250 000 €, soit 250 000 ÷ 1 000 000 = 25 % du CA (indice de sécurité). Diviser par le seuil (33 %) est l'erreur de base.","ref":"Contrôle de gestion (analyse coût-volume-profit)","difficulty":2,"time":50}]},{"module":"technique","title":"Audit (NEP / ISA) et IFRS","items":[{"id":"T101","module":"technique","lang":"fr","type":"qcm","theme":"assertions","q":"La circularisation des clients (demande de confirmation directe) répond principalement à quelle assertion ?","answer":"L'existence (réalité) des créances","distractors":["L'exhaustivité des créances","La présentation des créances","L'exhaustivité des dettes fournisseurs"],"explain":"Le client confirme qu'il doit bien la somme : la créance existe. La confirmation est moins efficace pour l'exhaustivité (un client ne signale pas spontanément une dette non enregistrée) ou l'évaluation (il peut confirmer sans pouvoir payer).","ref":"NEP 505 ; ISA 505","difficulty":2,"time":40},{"id":"T102","module":"technique","lang":"fr","type":"qcm","theme":"assertions","q":"Pour tester l'exhaustivité des dettes fournisseurs, quelle procédure est la plus adaptée ?","answer":"Examiner les factures reçues et les paiements effectués après la clôture","distractors":["Circulariser les fournisseurs ayant les plus gros soldes au bilan","Vérifier les factures des dettes inscrites au bilan","Recalculer le total de la balance fournisseurs"],"explain":"Le risque sur les dettes est la sous-évaluation : il faut partir de sources extérieures au bilan (règlements et factures postérieurs à la clôture) pour repérer des dettes non enregistrées. Partir des soldes inscrits ne détecte pas ce qui manque.","ref":"NEP 500 ; ISA 500 (assertions) ; ISA 330","difficulty":2,"time":45},{"id":"T103","module":"technique","lang":"fr","type":"qcm","theme":"assertions","q":"Le test des bons de livraison émis quelques jours avant et après la clôture vise surtout l'assertion :","answer":"Séparation des exercices (cut-off)","distractors":["Existence des stocks","Droits et obligations","Exactitude des prix"],"explain":"On vérifie que les ventes livrées avant la clôture sont bien facturées sur l'exercice, et que celles livrées après ne le sont pas. C'est le test de rattachement à la bonne période.","ref":"ISA 315 (assertions) ; NEP 315","difficulty":2,"time":45},{"id":"T104","module":"technique","lang":"fr","type":"qcm","theme":"assertions","q":"Comparer le coût unitaire des stocks aux prix de vente pratiqués après la clôture permet de tester :","answer":"L'évaluation des stocks (dépréciation éventuelle)","distractors":["L'existence des stocks","L'exhaustivité des achats","La présentation des stocks"],"explain":"Si le prix de vente diminué des frais de vente est inférieur au coût, une dépréciation est nécessaire : c'est l'assertion d'évaluation.","ref":"IAS 2, § 9 ; ISA 315 (assertions)","difficulty":2,"time":45},{"id":"T105","module":"technique","lang":"fr","type":"qcm","theme":"assertions","q":"Quel élément probant répond le mieux à l'assertion « droits et obligations » pour un immeuble inscrit au bilan ?","answer":"Le titre de propriété (acte notarié)","distractors":["Une visite physique de l'immeuble","Le contrat d'assurance","Le tableau des amortissements"],"explain":"La visite prouve l'existence, pas la propriété. L'acte de propriété démontre que l'entité détient les droits sur le bien.","ref":"ISA 315 (assertions) ; NEP 500","difficulty":1,"time":35},{"id":"T106","module":"technique","lang":"fr","type":"qcm","theme":"risque","q":"Si le risque d'anomalies significatives est évalué comme élevé, l'auditeur doit :","answer":"Réduire le risque de non-détection en renforçant ses procédures de fond","distractors":["Augmenter le seuil de signification","Réduire le nombre de tests pour gagner du temps","Ne rien changer à son approche"],"explain":"Risque d'audit = risque d'anomalies significatives (inhérent et lié au contrôle) × risque de non-détection. Pour garder un risque d'audit acceptable, plus le premier est élevé, plus le second doit être faible : tests plus nombreux, plus probants, plus proches de la clôture.","ref":"NEP 200 et 330 ; ISA 200 et 330","difficulty":2,"time":45},{"id":"T107","module":"technique","lang":"fr","type":"qcm","theme":"risque","q":"Qu'est-ce que le risque inhérent ?","answer":"La possibilité qu'une assertion comporte une anomalie significative, avant prise en compte des contrôles","distractors":["Le risque que l'auditeur ne détecte pas une anomalie","Le risque que le contrôle interne ne prévienne pas une anomalie","Le risque de perdre le client"],"explain":"Le risque inhérent tient à la nature du poste (estimations complexes, transactions inhabituelles…) indépendamment des contrôles. Le risque lié au contrôle concerne la défaillance des contrôles ; le risque de non-détection, celle des procédures de l'auditeur.","ref":"ISA 200, § 13 ; NEP 200","difficulty":2,"time":40},{"id":"T108","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"Que sont les procédures analytiques ?","answer":"L'appréciation d'informations financières à partir de leurs corrélations avec d'autres données, financières ou non","distractors":["Le contrôle exhaustif de toutes les pièces d'un compte","La demande de confirmation à des tiers","L'observation physique des actifs"],"explain":"Exemples : évolution de la marge brute, ratio charges de personnel / effectif moyen, comparaison au budget. Elles servent à l'évaluation des risques, comme contrôle de substance et en revue finale.","ref":"NEP 520 ; ISA 520","difficulty":2,"time":40},{"id":"T109","module":"technique","lang":"fr","type":"qcm","theme":"materialite","q":"Le seuil de signification correspond :","answer":"Au montant au-delà duquel une anomalie peut influencer le jugement des utilisateurs des comptes","distractors":["Au montant minimal des honoraires d'audit","Au total des anomalies relevées l'an dernier","À 10 % du chiffre d'affaires, par convention"],"explain":"Il est fixé par l'auditeur selon son jugement professionnel (souvent un pourcentage d'un agrégat : résultat, chiffre d'affaires, capitaux propres…). Il sert à planifier les travaux et à évaluer les anomalies.","ref":"NEP 320 ; ISA 320","difficulty":2,"time":40},{"id":"T110","module":"technique","lang":"fr","type":"qcm","theme":"opinion","q":"Quand le commissaire aux comptes certifie-t-il les comptes sans réserve ?","answer":"Lorsqu'il a obtenu l'assurance raisonnable que les comptes, pris dans leur ensemble, ne comportent pas d'anomalies significatives","distractors":["Lorsqu'il a vérifié toutes les écritures de l'exercice","Lorsque l'entreprise est bénéficiaire","Lorsque la direction lui a remis une lettre d'affirmation"],"explain":"L'audit fournit une assurance raisonnable, non absolue : il ne garantit pas l'absence de toute erreur. La lettre d'affirmation est nécessaire mais ne suffit pas.","ref":"NEP 700 ; ISA 700","difficulty":1,"time":35},{"id":"T111","module":"technique","lang":"fr","type":"qcm","theme":"opinion","q":"L'auditeur relève une anomalie significative ET diffuse que la direction refuse de corriger. Quelle opinion ?","answer":"Un refus de certifier (opinion défavorable)","distractors":["Une certification avec réserve","Une impossibilité de certifier","Une certification sans réserve avec observation"],"explain":"Désaccord significatif mais non diffus : réserve. Désaccord significatif et diffus : refus de certifier (adverse opinion). L'impossibilité de certifier sanctionne une limitation, pas un désaccord.","ref":"NEP 700 ; ISA 705","difficulty":2,"time":45},{"id":"T112","module":"technique","lang":"fr","type":"qcm","theme":"opinion","q":"L'auditeur n'a pas pu assister à l'inventaire d'un entrepôt dont le stock est significatif mais non diffus, et aucune procédure alternative n'a abouti. Quelle opinion ?","answer":"Une certification avec réserve pour limitation","distractors":["Un refus de certifier","Une certification sans réserve","Une démission du mandat"],"explain":"Il s'agit d'une limitation de l'étendue des travaux. Si son incidence possible est significative mais non diffuse, l'auditeur certifie avec réserve.","ref":"NEP 700 ; ISA 705, § 7","difficulty":2,"time":45},{"id":"T113","module":"technique","lang":"fr","type":"qcm","theme":"opinion","q":"Les limitations des travaux sont si nombreuses que l'auditeur ne peut se prononcer sur les comptes pris dans leur ensemble. Quelle opinion ?","answer":"Une impossibilité de certifier","distractors":["Un refus de certifier","Une certification avec réserve","Une certification avec observation"],"explain":"Limitation significative et diffuse : impossibilité de certifier (disclaimer of opinion). Le refus de certifier concerne un désaccord diffus.","ref":"NEP 700 ; ISA 705, § 9","difficulty":3,"time":45},{"id":"T114","module":"technique","lang":"fr","type":"qcm","theme":"opinion","q":"À quoi sert une observation (paragraphe d'observation) dans le rapport d'audit ?","answer":"Attirer l'attention du lecteur sur une information des comptes, sans remettre en cause l'opinion","distractors":["Exprimer un désaccord avec la direction","Signaler une anomalie non corrigée","Remplacer une réserve"],"explain":"L'observation renvoie à une information correctement présentée en annexe mais importante pour la compréhension (changement de méthode, litige majeur…). Elle ne modifie pas l'opinion.","ref":"NEP 700 ; ISA 706","difficulty":2,"time":40},{"id":"T115","module":"technique","lang":"fr","type":"qcm","theme":"opinion","q":"Les « points clés de l'audit » (key audit matters) doivent figurer dans le rapport d'audit :","answer":"Des entités d'intérêt public (sociétés cotées notamment)","distractors":["De toutes les sociétés, quelle que soit leur taille","Uniquement des sociétés en difficulté","Uniquement des comptes consolidés"],"explain":"En France, la justification des appréciations prend la forme de points clés de l'audit pour les EIP (risques d'anomalies les plus importants et réponses apportées). En normes internationales, ISA 701 les impose pour les entités cotées.","ref":"NEP 700 (justification des appréciations) ; ISA 701 ; règlement (UE) 537/2014","difficulty":2,"time":40},{"id":"T116","module":"technique","lang":"fr","type":"qcm","theme":"cac","q":"Pour combien d'exercices un commissaire aux comptes est-il nommé ?","answer":"6 exercices","distractors":["3 exercices","5 exercices","1 exercice, renouvelable"],"explain":"Le mandat du commissaire aux comptes couvre six exercices.","ref":"Code de commerce (mandat du commissaire aux comptes)","difficulty":1,"time":30},{"id":"T117","module":"technique","lang":"fr","type":"qcm","theme":"cac","q":"Parmi ces services, lequel est interdit au commissaire aux comptes d'une entité d'intérêt public ?","answer":"La tenue de sa comptabilité","distractors":["L'audit de ses comptes annuels","Une attestation demandée par une banque sur des informations comptables","La lecture du rapport de gestion"],"explain":"La tenue de la comptabilité et la préparation des états financiers figurent parmi les services autres que la certification interdits : l'auditeur se retrouverait à auditer son propre travail (autorévision), ce qui compromet son indépendance.","ref":"Règlement (UE) 537/2014, art. 5 ; Code de déontologie de la profession","difficulty":2,"time":45},{"id":"T118","module":"technique","lang":"fr","type":"qcm","theme":"controle-interne","q":"Quel exemple illustre une bonne séparation des tâches ?","answer":"La personne qui crée les fournisseurs dans le système n'est pas celle qui valide les paiements","distractors":["Le comptable fournisseurs crée les tiers, saisit les factures et lance les virements","Le directeur financier signe tous les chèques sans justificatif","Un seul salarié gère la caisse et son rapprochement"],"explain":"Séparer autorisation, enregistrement, conservation des actifs et contrôle évite qu'une même personne puisse commettre et dissimuler une fraude ou une erreur (par exemple créer un faux fournisseur puis le payer).","ref":"NEP 315 ; ISA 315 (contrôle interne)","difficulty":1,"time":40},{"id":"T119","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"« Vérifier sur un échantillon que les factures de plus de 5 000 € ont été approuvées par le responsable des achats » est :","answer":"Un test de procédures (test des contrôles)","distractors":["Un contrôle de substance sur les soldes","Une procédure analytique","Une confirmation de tiers"],"explain":"On teste l'efficacité de fonctionnement d'un contrôle (l'approbation). Un contrôle de substance porterait directement sur le montant des achats ou des dettes.","ref":"NEP 330 ; ISA 330, § 8-10","difficulty":2,"time":45},{"id":"T120","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"Qu'appelle-t-on « sondage » en audit ?","answer":"L'application de procédures à moins de 100 % des éléments d'une population, de façon que chacun ait une chance d'être sélectionné","distractors":["Le contrôle exhaustif d'un compte","La sélection des seuls éléments les plus importants","Un questionnaire envoyé au personnel"],"explain":"Le sondage permet de tirer une conclusion sur toute la population. La sélection des seuls éléments clés (gros montants, opérations inhabituelles) est une autre technique, qui ne permet pas d'extrapoler.","ref":"NEP 530 ; ISA 530","difficulty":2,"time":40},{"id":"T121","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"Qu'est-ce que la lettre d'affirmation ?","answer":"Une déclaration écrite de la direction confirmant notamment qu'elle a fourni toutes les informations nécessaires","distractors":["La lettre de mission signée avec le client","Le rapport de l'auditeur à l'assemblée générale","Une confirmation reçue d'une banque"],"explain":"Ces déclarations écrites complètent les éléments probants mais ne les remplacent pas. Leur refus est un signal grave qui peut affecter l'opinion.","ref":"NEP 580 ; ISA 580","difficulty":2,"time":40},{"id":"T122","module":"technique","lang":"fr","type":"qcm","theme":"evenements","q":"Un incendie détruit un entrepôt deux semaines après la clôture. Il n'y avait aucun problème à la clôture. Quel traitement dans les comptes de l'exercice clos ?","answer":"Pas d'ajustement des comptes ; une information en annexe si l'incidence est significative","distractors":["Déprécier l'entrepôt dans les comptes clos","Constituer une provision pour sinistre dans les comptes clos","Ignorer l'événement"],"explain":"L'événement ne révèle pas une situation existant à la clôture : il ne donne pas lieu à ajustement. Il est décrit en annexe s'il est significatif (et peut remettre en cause la continuité d'exploitation).","ref":"IAS 10, § 10 et 21 ; NEP 560 ; PCG","difficulty":2,"time":45},{"id":"T123","module":"technique","lang":"fr","type":"qcm","theme":"evenements","q":"Un client important est mis en liquidation un mois après la clôture ; ses difficultés existaient déjà à la clôture. Quel traitement ?","answer":"Ajuster la dépréciation de la créance dans les comptes de l'exercice clos","distractors":["Mentionner le fait en annexe sans ajustement","Comptabiliser la perte sur l'exercice suivant","Ne rien faire, l'événement est postérieur"],"explain":"L'événement apporte une information sur une situation qui existait à la clôture (insolvabilité) : c'est un événement à ajuster.","ref":"IAS 10, § 8-9 ; NEP 560","difficulty":2,"time":45},{"id":"T124","module":"technique","lang":"fr","type":"qcm","theme":"continuite","q":"Il existe une incertitude significative sur la continuité d'exploitation, correctement décrite en annexe. Que fait le commissaire aux comptes ?","answer":"Il certifie et inclut une partie « Incertitude significative liée à la continuité d'exploitation » dans son rapport","distractors":["Il refuse de certifier","Il certifie sans aucune mention","Il démissionne"],"explain":"Si l'information en annexe est adéquate, l'opinion n'est pas modifiée, mais le rapport comporte une partie spécifique attirant l'attention sur l'incertitude. Une information insuffisante entraînerait une réserve ou un refus.","ref":"NEP 570 ; ISA 570, § 22","difficulty":3,"time":50},{"id":"T125","module":"technique","lang":"fr","type":"qcm","theme":"fraude","q":"À qui incombe en premier lieu la responsabilité de prévenir et de détecter les fraudes ?","answer":"À la direction et aux personnes chargées de la gouvernance","distractors":["Au commissaire aux comptes","À l'administration fiscale","Aux salariés du service comptable"],"explain":"L'auditeur doit obtenir l'assurance raisonnable que les comptes ne comportent pas d'anomalies significatives, y compris dues à des fraudes, mais la prévention et la détection relèvent d'abord de l'entité.","ref":"NEP 240 ; ISA 240, § 4","difficulty":2,"time":40},{"id":"T126","module":"technique","lang":"fr","type":"qcm","theme":"ethique","q":"Que désigne le scepticisme professionnel ?","answer":"Une attitude d'esprit critique : rester attentif aux éléments qui contredisent les autres et ne pas accepter une explication sans élément probant","distractors":["Une méfiance systématique envers toutes les personnes de l'entité","L'obligation de contrôler 100 % des écritures","Le refus de toute explication orale"],"explain":"Le scepticisme suppose de questionner, de rester vigilant aux signaux de fraude ou d'erreur et d'évaluer de façon critique les éléments probants, sans présumer la malhonnêteté de la direction.","ref":"ISA 200, § 15 ; NEP 200","difficulty":1,"time":40},{"id":"T127","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"Que permet notamment de vérifier une confirmation bancaire ?","answer":"Les soldes des comptes, les emprunts et les engagements donnés ou reçus auprès de la banque","distractors":["Le chiffre d'affaires de l'exercice","Le salaire des dirigeants","Les quantités en stock"],"explain":"La réponse de la banque, obtenue directement par l'auditeur, couvre l'existence des soldes et l'exhaustivité des dettes et engagements (cautions, garanties, instruments financiers).","ref":"NEP 505 ; ISA 505","difficulty":2,"time":40},{"id":"T128","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"Quelle procédure fournit des éléments probants sur l'existence des stocks ?","answer":"Assister à l'inventaire physique","distractors":["Recalculer le coût unitaire moyen","Analyser l'évolution de la marge","Lire le procès-verbal d'assemblée"],"explain":"L'observation de l'inventaire permet de vérifier que les stocks existent, d'apprécier leur état (obsolescence) et de tester les comptages.","ref":"NEP 501 ; ISA 501","difficulty":1,"time":35},{"id":"T129","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"Le taux de marge brute est resté identique alors que les prix des matières premières ont fortement augmenté et que les prix de vente n'ont pas bougé. Que doit faire l'auditeur ?","answer":"Rechercher l'explication et la corroborer par des éléments probants (cut-off, stocks, chiffre d'affaires)","distractors":["Conclure que tout est normal puisque la marge est stable","Demander à la direction de modifier son budget","Ignorer l'écart s'il est inférieur au seuil de l'an dernier"],"explain":"Une stabilité incohérente avec l'évolution connue des coûts est un signal : erreur de valorisation des stocks, de séparation des exercices, voire manipulation. L'explication de la direction doit être corroborée.","ref":"NEP 520 ; ISA 520, § 7","difficulty":2,"time":45},{"id":"T130","module":"technique","lang":"fr","type":"qcm","theme":"assertions","q":"Le reclassement de la partie d'un emprunt remboursable à moins d'un an relève de quelle assertion ?","answer":"La présentation et le classement","distractors":["L'existence","L'exhaustivité","L'évaluation"],"explain":"Le montant total est juste, mais il doit être correctement réparti et présenté (part à plus et à moins d'un an en annexe).","ref":"ISA 315 (assertions de présentation)","difficulty":2,"time":40},{"id":"T131","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"L'auditeur utilise les travaux d'un expert immobilier pour valoriser des immeubles. Qui est responsable de l'opinion d'audit ?","answer":"Le commissaire aux comptes, seul","distractors":["L'expert, pour la partie qui le concerne","L'expert et l'auditeur, solidairement","La direction de l'entité"],"explain":"L'auditeur doit apprécier la compétence, l'objectivité et les travaux de l'expert, mais il conserve l'entière responsabilité de son opinion.","ref":"NEP 620 ; ISA 620, § 3","difficulty":2,"time":40},{"id":"T132","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"Quel document formalise l'accord entre l'auditeur et l'entité sur les termes de la mission ?","answer":"La lettre de mission","distractors":["La lettre d'affirmation","Le rapport d'audit","Le plan de mission"],"explain":"La lettre de mission précise notamment l'objectif, l'étendue, les responsabilités de chacun et les honoraires.","ref":"NEP 210 ; ISA 210","difficulty":1,"time":35},{"id":"T133","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Selon IFRS 15, quelle est la deuxième des cinq étapes de comptabilisation du revenu ?","answer":"Identifier les obligations de prestation du contrat","distractors":["Déterminer le prix de la transaction","Comptabiliser le revenu lorsque l'obligation est remplie","Répartir le prix entre les obligations"],"explain":"Les cinq étapes : 1) identifier le contrat ; 2) identifier les obligations de prestation ; 3) déterminer le prix ; 4) répartir le prix entre les obligations ; 5) comptabiliser le revenu quand (ou à mesure que) chaque obligation est remplie.","ref":"IFRS 15, § IN7","difficulty":2,"time":40},{"id":"T134","module":"technique","lang":"fr","type":"calcul","theme":"ifrs","q":"Un contrat vend un logiciel et un an de maintenance pour 120 €. Prix de vente séparés : logiciel 100 €, maintenance 50 €. Quel revenu affecter au logiciel selon IFRS 15 ?","answer":"80 €","distractors":["100 €","70 €","120 €"],"explain":"Le prix est réparti au prorata des prix de vente spécifiques : 120 × 100 ÷ 150 = 80 € pour le logiciel, 40 € pour la maintenance (reconnus sur l'année).","ref":"IFRS 15, § 73-80","difficulty":3,"time":75},{"id":"T135","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Selon IFRS 16, quelles locations le preneur peut-il exclure de la comptabilisation au bilan ?","answer":"Les contrats de courte durée (12 mois au plus) et ceux portant sur des actifs de faible valeur","distractors":["Toutes les locations simples","Les locations immobilières","Aucune : tous les contrats vont au bilan"],"explain":"Le preneur inscrit un droit d'utilisation et une dette locative pour tous ses contrats, sauf s'il utilise les exemptions courte durée et faible valeur ; les loyers correspondants vont alors en charges.","ref":"IFRS 16, § 5-8","difficulty":2,"time":40},{"id":"T136","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Après leur comptabilisation initiale, IAS 16 permet d'évaluer les immobilisations corporelles selon :","answer":"Le modèle du coût ou le modèle de la réévaluation, appliqué par catégorie d'actifs","distractors":["Uniquement le modèle du coût","Uniquement la juste valeur par résultat","La valeur de marché à chaque clôture, obligatoirement"],"explain":"Le choix se fait par catégorie. En réévaluation, les écarts positifs vont en capitaux propres (écart de réévaluation), sauf reprise d'une baisse antérieure passée en résultat.","ref":"IAS 16, § 29-31","difficulty":2,"time":40},{"id":"T137","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Selon IAS 36, la valeur recouvrable d'un actif est :","answer":"La plus élevée entre sa juste valeur diminuée des coûts de sortie et sa valeur d'utilité","distractors":["La plus faible entre sa juste valeur et sa valeur d'utilité","Sa valeur nette comptable","Son coût de remplacement"],"explain":"Un actif ne doit pas être inscrit pour plus que ce qu'il permet de récupérer, par la vente ou par l'utilisation : on retient le plus élevé des deux montants.","ref":"IAS 36, § 18","difficulty":2,"time":40},{"id":"T138","module":"technique","lang":"fr","type":"calcul","theme":"ifrs","q":"Valeur comptable d'une unité génératrice de trésorerie : 500. Juste valeur diminuée des coûts de sortie : 420. Valeur d'utilité : 460. Dépréciation à comptabiliser ?","answer":"40","distractors":["80","0","60"],"explain":"Valeur recouvrable = max(420 ; 460) = 460. Dépréciation = 500 − 460 = 40. Retenir la plus faible des deux valeurs (80) est l'erreur classique.","ref":"IAS 36, § 59","difficulty":2,"time":55},{"id":"T139","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Pour IAS 37, une sortie de ressources est « probable » lorsqu'elle est :","answer":"Plus probable qu'improbable","distractors":["Certaine","Possible","Supérieure à 90 %"],"explain":"Probable signifie plus probable qu'improbable (probabilité supérieure à 50 %). Une sortie seulement possible relève du passif éventuel, mentionné en annexe.","ref":"IAS 37, § 23","difficulty":2,"time":40},{"id":"T140","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Quand une provision pour restructuration peut-elle être comptabilisée selon IAS 37 ?","answer":"Quand un plan formalisé et détaillé existe et que l'entité a créé chez les personnes concernées une attente fondée qu'il sera mis en œuvre","distractors":["Dès que la direction envisage une restructuration","Quand le budget de l'année suivante prévoit des économies","Uniquement après le départ effectif des salariés"],"explain":"Il faut une obligation implicite : plan détaillé ET début d'exécution ou annonce aux personnes concernées avant la clôture. Une simple décision de la direction ne suffit pas.","ref":"IAS 37, § 72","difficulty":3,"time":50},{"id":"T141","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Selon IAS 2, les stocks sont évalués :","answer":"Au plus faible du coût et de la valeur nette de réalisation","distractors":["À la juste valeur","Au prix de vente","Au coût de remplacement"],"explain":"La valeur nette de réalisation est le prix de vente estimé dans le cours normal de l'activité, diminué des coûts estimés d'achèvement et de vente.","ref":"IAS 2, § 9","difficulty":1,"time":35},{"id":"T142","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"En IFRS, des frais de développement satisfaisant à tous les critères d'IAS 38 (faisabilité technique, intention, ressources, avantages futurs…) doivent être :","answer":"Obligatoirement immobilisés","distractors":["Obligatoirement comptabilisés en charges","Immobilisés ou passés en charges, au choix","Provisionnés"],"explain":"IAS 38 impose l'activation lorsque les six critères sont démontrés. En PCG, l'activation des frais de développement est une option. Les frais de recherche sont toujours en charges.","ref":"IAS 38, § 57","difficulty":2,"time":45},{"id":"T143","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Pour déprécier ses créances commerciales, IFRS 9 prévoit :","answer":"Un modèle de pertes de crédit attendues, avec une approche simplifiée possible pour les créances commerciales","distractors":["Une dépréciation seulement en cas de faillite du client","Une dépréciation forfaitaire de 5 %","Aucune dépréciation : la créance reste au nominal"],"explain":"IFRS 9 anticipe les pertes attendues (et non plus seulement subies). Pour les créances commerciales, l'approche simplifiée calcule directement les pertes attendues sur la durée de vie, souvent à l'aide d'une matrice par ancienneté.","ref":"IFRS 9, § 5.5.15","difficulty":2,"time":45},{"id":"T144","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Dans le tableau des flux de trésorerie (IAS 7), l'achat d'une machine est classé en flux :","answer":"D'investissement","distractors":["Opérationnels","De financement","Non monétaires"],"explain":"Les acquisitions et cessions d'actifs à long terme sont des flux d'investissement ; les emprunts et dividendes relèvent du financement.","ref":"IAS 7, § 16","difficulty":1,"time":35},{"id":"T145","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Quelle norme remplace IAS 1 (présentation des états financiers) pour les exercices ouverts à compter du 1er janvier 2027 ?","answer":"IFRS 18","distractors":["IFRS 17","IFRS 16","IAS 8"],"explain":"IFRS 18, publiée en 2024, impose notamment de nouveaux sous-totaux au compte de résultat (résultat opérationnel…) et une information sur les indicateurs de performance définis par la direction. IFRS 17 traite des contrats d'assurance.","ref":"IFRS 18","difficulty":3,"time":40},{"id":"T146","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"Selon IFRS 13, la juste valeur est :","answer":"Le prix qui serait reçu pour vendre un actif (ou payé pour transférer un passif) lors d'une transaction normale entre participants de marché, à la date d'évaluation","distractors":["Le prix payé à l'origine pour l'actif","La valeur d'utilité de l'actif pour l'entreprise","Le coût de remplacement à neuf"],"explain":"C'est un prix de sortie, déterminé du point de vue des participants de marché et non de l'entité.","ref":"IFRS 13, § 9","difficulty":2,"time":40},{"id":"T147","module":"technique","lang":"fr","type":"qcm","theme":"ifrs","q":"En IFRS (IAS 21), à la clôture, une créance libellée en devise est :","answer":"Convertie au cours de clôture, l'écart de change étant comptabilisé en résultat","distractors":["Maintenue au cours historique","Convertie au cours de clôture avec écart en capitaux propres","Convertie au cours moyen de l'exercice"],"explain":"Les éléments monétaires sont convertis au cours de clôture et les écarts de change passent en résultat, gains comme pertes. En PCG, seuls les écarts latents défavorables affectent le résultat (via une provision).","ref":"IAS 21, § 23 et 28","difficulty":2,"time":45},{"id":"T148","module":"technique","lang":"fr","type":"qcm","theme":"normes","q":"En France, selon quelles normes le commissaire aux comptes exerce-t-il sa mission de certification ?","answer":"Les normes d'exercice professionnel (NEP)","distractors":["Les normes IFRS","Les normes IPSAS","Le plan comptable général"],"explain":"Les NEP, homologuées par arrêté, s'inspirent largement des normes internationales d'audit (ISA). Les IFRS et le PCG sont des référentiels comptables, pas des normes d'audit.","ref":"Code de commerce ; NEP","difficulty":1,"time":35},{"id":"T149","module":"technique","lang":"fr","type":"qcm","theme":"controle-interne","q":"Lors de la prise de connaissance, l'auditeur constate une faiblesse significative du contrôle interne. Que doit-il faire ?","answer":"La communiquer par écrit, en temps utile, à la direction et aux personnes chargées de la gouvernance, et en tenir compte dans son approche","distractors":["La corriger lui-même dans le système","N'en parler qu'à l'assemblée générale","L'ignorer si elle n'a pas encore causé d'anomalie"],"explain":"L'auditeur informe des faiblesses significatives identifiées et adapte ses procédures (davantage de contrôles de substance, si le contrôle n'est pas fiable). Il n'a pas à concevoir ou modifier les contrôles de l'entité.","ref":"NEP 265 ; ISA 265","difficulty":2,"time":45},{"id":"T150","module":"technique","lang":"fr","type":"qcm","theme":"procedures","q":"Quel élément probant est en principe le plus fiable ?","answer":"Une confirmation obtenue directement par l'auditeur auprès d'un tiers indépendant","distractors":["Une explication orale de la direction","Une copie de document fournie par l'entité","Un document interne non signé"],"explain":"La fiabilité augmente lorsque l'élément vient d'une source indépendante, est obtenu directement par l'auditeur, existe sous forme écrite et en original.","ref":"NEP 500 ; ISA 500, § A31","difficulty":2,"time":45}]},{"module":"verbal","title":"Raisonnement verbal","passages":[{"id":"V01","lang":"fr","title":"Rotation des commissaires aux comptes","text":"Pour les entités d'intérêt public, la réglementation européenne limite la durée pendant laquelle un même cabinet peut certifier les comptes d'une société. À l'issue de cette durée, le cabinet doit être remplacé, sauf prolongation lorsque la société organise un appel d'offres ou nomme plusieurs commissaires aux comptes. L'objectif affiché est de préserver l'indépendance de l'auditeur, qu'une relation trop longue avec le même client pourrait fragiliser. Certains dirigeants regrettent toutefois la perte de connaissance de l'entreprise qu'entraîne chaque changement de cabinet, et la charge de travail supplémentaire pour les équipes financières pendant la première année du nouveau mandat.","difficulty":1,"statements":[{"id":"V01-1","s":"La rotation obligatoire des cabinets vise à préserver l'indépendance de l'auditeur.","answer":"vrai","why":"Le texte indique que « l'objectif affiché est de préserver l'indépendance de l'auditeur »."},{"id":"V01-2","s":"Aucune prolongation de la durée maximale n'est possible.","answer":"faux","why":"Le texte prévoit une prolongation « lorsque la société organise un appel d'offres ou nomme plusieurs commissaires aux comptes »."},{"id":"V01-3","s":"Le changement de cabinet entraîne une hausse des honoraires d'audit.","answer":"nsp","why":"Le texte évoque une perte de connaissance et une charge de travail accrue pour les équipes financières, mais ne dit rien des honoraires."},{"id":"V01-4","s":"Ces règles s'appliquent à toutes les sociétés commerciales.","answer":"faux","why":"Le texte précise qu'elles concernent les entités d'intérêt public, pas toutes les sociétés."}]},{"id":"V02","lang":"fr","title":"Le BFR d'un distributeur","text":"Le distributeur Kerlis a vu son besoin en fonds de roulement augmenter de 18 % en un an, alors que son chiffre d'affaires n'a progressé que de 6 %. La direction financière attribue cet écart à l'allongement des délais de paiement accordés à deux grands clients, ainsi qu'à la constitution de stocks de sécurité après les ruptures d'approvisionnement du printemps. Pour financer ce besoin, l'entreprise a davantage utilisé sa ligne de crédit à court terme. Le directeur financier estime que les stocks reviendront à leur niveau habituel d'ici la fin de l'exercice prochain, mais n'a pas indiqué si les conditions accordées aux clients seraient renégociées.","difficulty":2,"statements":[{"id":"V02-1","s":"Le besoin en fonds de roulement de Kerlis a augmenté plus vite que son chiffre d'affaires.","answer":"vrai","why":"+18 % pour le BFR contre +6 % pour le chiffre d'affaires."},{"id":"V02-2","s":"Les délais de paiement des deux grands clients seront renégociés l'an prochain.","answer":"nsp","why":"Le texte dit précisément que le directeur financier « n'a pas indiqué si les conditions accordées aux clients seraient renégociées »."},{"id":"V02-3","s":"L'entreprise a financé la hausse de son BFR par une augmentation de capital.","answer":"faux","why":"Elle a « davantage utilisé sa ligne de crédit à court terme »."},{"id":"V02-4","s":"Les ruptures d'approvisionnement ont eu lieu au printemps.","answer":"vrai","why":"Le texte mentionne « les ruptures d'approvisionnement du printemps »."}]},{"id":"V03","lang":"fr","title":"Le contrôle interne des achats","text":"Lors de sa mission intermédiaire, l'équipe d'audit a constaté que, dans la filiale de Lyon, une même personne pouvait créer un nouveau fournisseur dans le logiciel et valider son paiement. Aucune anomalie n'a été relevée sur l'échantillon de paiements testés, mais l'équipe considère que cette situation crée un risque de fraude. Elle recommande de confier la création des fournisseurs au service de contrôle de gestion. La direction de la filiale a accepté la recommandation et prévoit de la mettre en place au cours du prochain trimestre. L'équipe d'audit n'a pas encore décidé si elle étendrait ses tests aux autres filiales.","difficulty":2,"statements":[{"id":"V03-1","s":"Des paiements frauduleux ont été découverts dans la filiale de Lyon.","answer":"faux","why":"Le texte indique qu'« aucune anomalie n'a été relevée sur l'échantillon de paiements testés »."},{"id":"V03-2","s":"La direction de la filiale a accepté la recommandation de l'équipe d'audit.","answer":"vrai","why":"La direction « a accepté la recommandation »."},{"id":"V03-3","s":"Les mêmes faiblesses existent dans les autres filiales du groupe.","answer":"nsp","why":"Le texte ne dit rien de la situation des autres filiales ; l'équipe n'a même pas décidé d'y étendre ses tests."},{"id":"V03-4","s":"L'équipe recommande de confier la création des fournisseurs au service comptable.","answer":"faux","why":"Elle recommande de la confier au service de contrôle de gestion."}]},{"id":"V04","lang":"fr","title":"Les taux d'intérêt et les PME","text":"Après deux années de hausse, les taux des crédits accordés aux petites et moyennes entreprises se sont stabilisés au cours des six derniers mois. Selon l'enquête trimestrielle d'une fédération professionnelle, près d'un dirigeant sur trois déclare avoir reporté un investissement en raison du coût du financement. Les secteurs de la construction et du commerce de détail sont les plus touchés. L'enquête souligne cependant que la demande de crédits de trésorerie reste soutenue, signe que les entreprises cherchent avant tout à sécuriser leurs liquidités. Les auteurs de l'enquête ne formulent pas de prévision sur l'évolution des taux pour l'année à venir.","difficulty":1,"statements":[{"id":"V04-1","s":"Les taux des crédits aux PME ont continué d'augmenter au cours des six derniers mois.","answer":"faux","why":"Ils « se sont stabilisés au cours des six derniers mois »."},{"id":"V04-2","s":"Environ un tiers des dirigeants interrogés ont reporté un investissement à cause du coût du financement.","answer":"vrai","why":"« Près d'un dirigeant sur trois » l'a déclaré."},{"id":"V04-3","s":"Les taux baisseront l'année prochaine.","answer":"nsp","why":"Les auteurs « ne formulent pas de prévision sur l'évolution des taux »."}]},{"id":"V05","lang":"fr","title":"Le seuil de signification","text":"Avant de commencer ses travaux, l'auditeur fixe un seuil de signification, c'est-à-dire le montant à partir duquel une anomalie, seule ou cumulée avec d'autres, pourrait influencer les décisions des utilisateurs des comptes. Ce seuil est généralement calculé à partir d'un indicateur de référence, comme le résultat avant impôt ou le chiffre d'affaires, auquel on applique un pourcentage. Le choix de l'indicateur dépend de ce qui intéresse le plus les lecteurs des comptes. Le seuil n'est pas figé : il peut être révisé en cours de mission si l'auditeur obtient des informations qui l'auraient conduit à retenir un montant différent dès le départ.","difficulty":2,"statements":[{"id":"V05-1","s":"Le seuil de signification ne peut plus être modifié une fois la mission commencée.","answer":"faux","why":"Le texte dit qu'il « peut être révisé en cours de mission »."},{"id":"V05-2","s":"Le chiffre d'affaires peut servir d'indicateur de référence pour calculer le seuil.","answer":"vrai","why":"Le texte cite le chiffre d'affaires parmi les indicateurs possibles."},{"id":"V05-3","s":"Le pourcentage appliqué au résultat avant impôt est de 5 %.","answer":"nsp","why":"Le texte parle d'« un pourcentage » sans en donner la valeur."},{"id":"V05-4","s":"Une anomalie inférieure au seuil peut être prise en compte lorsqu'elle se cumule avec d'autres.","answer":"vrai","why":"Le seuil vise une anomalie « seule ou cumulée avec d'autres »."}]},{"id":"V06","lang":"fr","title":"La facturation électronique","text":"La généralisation de la facturation électronique entre entreprises assujetties à la TVA se fait par étapes. Toutes les entreprises devront d'abord être en mesure de recevoir des factures électroniques ; l'obligation d'en émettre sera ensuite étendue selon leur taille, les grandes et moyennes entreprises étant concernées les premières. Les factures transiteront par des plateformes agréées, qui transmettront certaines données à l'administration fiscale. Pour les pouvoirs publics, la réforme doit réduire la fraude à la TVA et accélérer les délais de paiement. Plusieurs éditeurs de logiciels comptables signalent que de nombreuses petites entreprises n'ont pas encore choisi leur plateforme.","difficulty":2,"statements":[{"id":"V06-1","s":"Les petites entreprises devront émettre des factures électroniques avant les grandes entreprises.","answer":"faux","why":"Les grandes et moyennes entreprises sont « concernées les premières » pour l'émission."},{"id":"V06-2","s":"Selon les pouvoirs publics, la réforme doit contribuer à réduire la fraude à la TVA.","answer":"vrai","why":"C'est l'un des deux objectifs cités."},{"id":"V06-3","s":"La majorité des petites entreprises n'a pas encore choisi de plateforme.","answer":"nsp","why":"Les éditeurs parlent de « nombreuses » petites entreprises, ce qui ne permet pas de conclure à une majorité."},{"id":"V06-4","s":"Les plateformes agréées transmettront certaines données à l'administration fiscale.","answer":"vrai","why":"Le texte l'indique explicitement."}]},{"id":"V07","lang":"fr","title":"Les estimations comptables","text":"Les estimations comptables, comme les dépréciations de stocks ou les provisions pour litiges, reposent sur des hypothèses formulées par la direction. Elles présentent un risque particulier, car un biais même involontaire peut orienter le résultat dans le sens souhaité. L'auditeur ne se contente donc pas de vérifier les calculs : il apprécie le caractère raisonnable des hypothèses retenues, les compare aux données observées et examine, l'année suivante, comment les estimations passées se sont dénouées. Un écart entre une estimation et son dénouement ne prouve pas à lui seul une erreur, mais des écarts répétés dans le même sens peuvent révéler un biais.","difficulty":3,"statements":[{"id":"V07-1","s":"Un écart entre une estimation et son dénouement prouve que la direction a commis une erreur.","answer":"faux","why":"Le texte précise qu'un écart « ne prouve pas à lui seul une erreur »."},{"id":"V07-2","s":"L'auditeur examine la façon dont les estimations des années précédentes se sont dénouées.","answer":"vrai","why":"Il « examine, l'année suivante, comment les estimations passées se sont dénouées »."},{"id":"V07-3","s":"Les provisions pour litiges sont l'estimation comptable la plus risquée.","answer":"nsp","why":"Le texte les cite comme exemple, sans les classer par niveau de risque."},{"id":"V07-4","s":"Selon le texte, un biais dans les estimations est toujours volontaire.","answer":"faux","why":"Le texte évoque un biais « même involontaire »."}]},{"id":"V08","lang":"fr","title":"Le télétravail dans les cabinets","text":"Une étude menée auprès de 1 200 salariés de cabinets d'audit et de conseil montre que 72 % d'entre eux télétravaillent au moins un jour par semaine. Les jeunes collaborateurs sont toutefois plus nombreux que leurs aînés à souhaiter davantage de présence au bureau, qu'ils jugent indispensable pour apprendre au contact des équipes. Les managers interrogés estiment de leur côté que le télétravail n'a pas réduit la productivité, mais qu'il a rendu plus difficile l'intégration des nouveaux arrivants. L'étude ne précise pas comment les cabinets comptent faire évoluer leurs règles.","difficulty":1,"statements":[{"id":"V08-1","s":"Plus des deux tiers des salariés interrogés télétravaillent au moins un jour par semaine.","answer":"vrai","why":"72 % est supérieur à deux tiers (environ 67 %)."},{"id":"V08-2","s":"Les managers estiment que le télétravail a réduit la productivité.","answer":"faux","why":"Ils « estiment que le télétravail n'a pas réduit la productivité »."},{"id":"V08-3","s":"Les cabinets vont réduire le nombre de jours de télétravail autorisés.","answer":"nsp","why":"L'étude « ne précise pas » comment les cabinets feront évoluer leurs règles."}]},{"id":"V09","lang":"fr","title":"Une acquisition dans l'agroalimentaire","text":"Le groupe Montavia a annoncé l'acquisition d'un fabricant de biscuits régional pour un montant de 48 millions d'euros, financé pour moitié par endettement et pour moitié par sa trésorerie disponible. La cible a réalisé l'an dernier un chiffre d'affaires de 31 millions d'euros, en progression régulière depuis cinq ans. Montavia espère réaliser des économies d'achats en regroupant les commandes de matières premières des deux entreprises. L'opération doit encore être autorisée par l'autorité de la concurrence. Le dirigeant fondateur de la cible restera à la tête de l'entreprise pendant au moins deux ans.","difficulty":2,"statements":[{"id":"V09-1","s":"L'acquisition est financée intégralement par endettement.","answer":"faux","why":"Elle est financée « pour moitié par endettement et pour moitié par sa trésorerie disponible »."},{"id":"V09-2","s":"L'opération a déjà été autorisée par l'autorité de la concurrence.","answer":"faux","why":"Elle « doit encore être autorisée »."},{"id":"V09-3","s":"Le chiffre d'affaires de la cible est en hausse depuis cinq ans.","answer":"vrai","why":"Le texte parle d'une « progression régulière depuis cinq ans »."},{"id":"V09-4","s":"La cible est rentable.","answer":"nsp","why":"Le texte donne le chiffre d'affaires mais rien sur le résultat."}]},{"id":"V10","lang":"fr","title":"La continuité d'exploitation","text":"Les comptes annuels sont normalement établis en supposant que l'entreprise poursuivra son activité pendant au moins les douze mois qui suivent la clôture. Lorsque des événements font peser un doute important sur cette hypothèse, la direction doit l'indiquer dans l'annexe. L'auditeur, de son côté, apprécie si l'hypothèse retenue par la direction est appropriée et si l'information fournie est suffisante. Un doute sur la continuité d'exploitation ne conduit pas automatiquement à un refus de certifier : si l'information donnée dans l'annexe est adéquate, l'auditeur peut certifier les comptes tout en attirant l'attention des lecteurs sur cette incertitude.","difficulty":3,"statements":[{"id":"V10-1","s":"Un doute important sur la continuité d'exploitation entraîne toujours un refus de certifier.","answer":"faux","why":"Le texte dit précisément que ce n'est pas automatique."},{"id":"V10-2","s":"C'est d'abord à la direction de signaler dans l'annexe un doute important sur la continuité d'exploitation.","answer":"vrai","why":"« La direction doit l'indiquer dans l'annexe »."},{"id":"V10-3","s":"L'hypothèse de continuité porte sur au moins les douze mois qui suivent la clôture.","answer":"vrai","why":"C'est la durée indiquée au début du texte."},{"id":"V10-4","s":"Les entreprises en difficulté sont de plus en plus nombreuses.","answer":"nsp","why":"Le texte ne donne aucune information sur le nombre d'entreprises en difficulté."}]},{"id":"V11","lang":"fr","title":"Les prix de l'énergie","text":"La hausse des prix de l'énergie a pesé sur les marges des industriels l'an dernier, en particulier dans la chimie et la métallurgie. Certaines entreprises ont pu répercuter cette hausse sur leurs prix de vente grâce à des clauses d'indexation prévues dans leurs contrats. D'autres, liées par des prix fixes sur plusieurs années, ont dû absorber l'intégralité du surcoût. Cette année, les prix de gros de l'électricité ont reculé, mais une partie des entreprises reste engagée dans des contrats d'approvisionnement signés au plus haut du marché, ce qui retarde pour elles le bénéfice de la baisse.","difficulty":2,"statements":[{"id":"V11-1","s":"Toutes les entreprises industrielles ont subi une baisse de leurs marges l'an dernier.","answer":"nsp","why":"Le texte dit que la hausse « a pesé sur les marges des industriels », mais certaines ont répercuté la hausse : on ne peut pas affirmer que toutes ont vu leurs marges baisser."},{"id":"V11-2","s":"Les clauses d'indexation ont permis à certaines entreprises de répercuter la hausse sur leurs clients.","answer":"vrai","why":"C'est ce qu'indique la deuxième phrase."},{"id":"V11-3","s":"Les prix de gros de l'électricité ont augmenté cette année.","answer":"faux","why":"Ils « ont reculé » cette année."}]},{"id":"V12","lang":"fr","title":"Le contrôle fiscal","text":"Une entreprise qui reçoit un avis de vérification de comptabilité dispose de garanties. Elle peut se faire assister par un conseil de son choix, et la vérification ne peut en principe pas durer plus de trois mois pour les petites entreprises. À l'issue du contrôle, l'administration adresse une proposition de rectification motivée, à laquelle l'entreprise peut répondre dans un délai déterminé. En cas de désaccord persistant, certaines commissions peuvent être saisies avant tout recours devant le juge. La loi ne fixe toutefois pas de limite de durée à la vérification pour les grandes entreprises.","difficulty":2,"statements":[{"id":"V12-1","s":"Une petite entreprise peut se faire assister par un conseil pendant la vérification.","answer":"vrai","why":"Toute entreprise vérifiée peut se faire assister « par un conseil de son choix »."},{"id":"V12-2","s":"La vérification d'une grande entreprise ne peut pas dépasser trois mois.","answer":"faux","why":"Le texte dit que la loi ne fixe pas de limite de durée pour les grandes entreprises."},{"id":"V12-3","s":"La plupart des contrôles fiscaux aboutissent à un redressement.","answer":"nsp","why":"Le texte ne donne aucune statistique sur l'issue des contrôles."}]},{"id":"V13","lang":"fr","title":"Les parties liées","text":"Les transactions avec des parties liées, comme les filiales, les dirigeants ou leurs proches, ne sont pas illégales en soi. Elles exigent cependant une attention particulière, car elles peuvent être conclues à des conditions différentes de celles du marché. Les normes comptables imposent de donner en annexe une information sur ces transactions, afin que les lecteurs des comptes puissent en mesurer l'effet. L'auditeur doit identifier les parties liées et vérifier que les transactions importantes ont été correctement autorisées et présentées. Il s'appuie notamment sur les déclarations de la direction, qu'il confronte à d'autres sources d'information.","difficulty":3,"statements":[{"id":"V13-1","s":"Les transactions avec des parties liées sont interdites.","answer":"faux","why":"Le texte précise qu'elles « ne sont pas illégales en soi »."},{"id":"V13-2","s":"Les transactions avec des parties liées sont le plus souvent conclues à des conditions défavorables à l'entreprise.","answer":"nsp","why":"Le texte dit seulement qu'elles « peuvent » être conclues à des conditions différentes de celles du marché ; il ne dit pas si c'est fréquent ni dans quel sens."},{"id":"V13-3","s":"L'auditeur ne se fie pas uniquement aux déclarations de la direction pour identifier les parties liées.","answer":"vrai","why":"Il les « confronte à d'autres sources d'information »."},{"id":"V13-4","s":"Les proches des dirigeants peuvent être des parties liées.","answer":"vrai","why":"Ils sont cités parmi les exemples."}]},{"id":"V14","lang":"fr","title":"Le marché de l'emploi des jeunes diplômés","text":"Selon une enquête d'une association d'écoles, 81 % des diplômés d'un master en finance ont trouvé un emploi moins de six mois après la fin de leurs études. Les cabinets d'audit et les directions financières de grandes entreprises sont les premiers recruteurs. Le salaire médian à l'embauche a progressé de 4 % par rapport à l'année précédente. L'enquête indique également que les diplômés ayant effectué leur cursus en alternance trouvent un emploi plus rapidement que les autres, sans préciser l'écart de salaire entre les deux groupes.","difficulty":1,"statements":[{"id":"V14-1","s":"Moins d'un diplômé sur cinq n'avait pas trouvé d'emploi six mois après ses études.","answer":"vrai","why":"81 % ont trouvé un emploi, donc 19 % n'en avaient pas, soit moins d'un sur cinq (20 %)."},{"id":"V14-2","s":"Les diplômés en alternance sont mieux payés que les autres.","answer":"nsp","why":"L'enquête ne précise pas l'écart de salaire entre les deux groupes."},{"id":"V14-3","s":"Le salaire médian à l'embauche a baissé par rapport à l'année précédente.","answer":"faux","why":"Il a progressé de 4 %."}]},{"id":"V15","lang":"fr","title":"La lutte contre le blanchiment","text":"Les professionnels du chiffre, dont les experts-comptables et les commissaires aux comptes, sont soumis à des obligations de lutte contre le blanchiment de capitaux. Ils doivent identifier leurs clients, comprendre la nature de leur activité et exercer une vigilance adaptée au niveau de risque. Lorsqu'ils soupçonnent qu'une opération pourrait provenir d'une infraction, ils doivent effectuer une déclaration auprès de la cellule nationale de renseignement financier. Cette déclaration est confidentielle : le client concerné ne doit pas en être informé. Le niveau de vigilance peut être allégé lorsque le risque est faible.","difficulty":2,"statements":[{"id":"V15-1","s":"Un commissaire aux comptes doit prévenir son client lorsqu'il effectue une déclaration de soupçon le concernant.","answer":"faux","why":"Le client « ne doit pas en être informé »."},{"id":"V15-2","s":"Le niveau de vigilance est identique pour tous les clients.","answer":"faux","why":"Il est « adapté au niveau de risque » et peut être allégé quand le risque est faible."},{"id":"V15-3","s":"Les experts-comptables sont soumis aux obligations de lutte contre le blanchiment.","answer":"vrai","why":"Ils sont cités explicitement."},{"id":"V15-4","s":"Les déclarations de soupçon ont augmenté ces dernières années.","answer":"nsp","why":"Le texte ne donne aucune donnée sur leur évolution."}]},{"id":"V16","lang":"fr","title":"Les indicateurs de performance","text":"De nombreuses sociétés cotées publient, en plus de leurs comptes, des indicateurs qu'elles définissent elles-mêmes, comme un « résultat opérationnel ajusté ». Ces indicateurs peuvent aider les investisseurs à comprendre la performance récurrente, en excluant des éléments jugés exceptionnels. Les régulateurs rappellent cependant qu'ils ne doivent pas être présentés de manière plus visible que les indicateurs comptables, et que leur rapprochement avec les comptes doit être fourni. Ils constatent que certaines sociétés excluent chaque année les mêmes charges « exceptionnelles », ce qui interroge sur leur caractère réellement inhabituel.","difficulty":2,"statements":[{"id":"V16-1","s":"Les indicateurs ajustés sont définis par les normes comptables.","answer":"faux","why":"Les sociétés les définissent « elles-mêmes »."},{"id":"V16-2","s":"Selon les régulateurs, un rapprochement entre ces indicateurs et les comptes doit être fourni.","answer":"vrai","why":"C'est l'une des deux règles rappelées."},{"id":"V16-3","s":"Toutes les sociétés cotées publient un résultat opérationnel ajusté.","answer":"nsp","why":"Le texte parle de « nombreuses » sociétés, et le résultat ajusté n'est qu'un exemple."},{"id":"V16-4","s":"Les régulateurs doutent du caractère exceptionnel de charges exclues chaque année.","answer":"vrai","why":"Cette pratique « interroge sur leur caractère réellement inhabituel »."}]},{"id":"V17","lang":"fr","title":"L'inventaire physique","text":"Chaque année, l'entrepôt de la société Brévalis est fermé pendant deux jours pour l'inventaire physique des stocks. Les équipes comptent les articles par zones, en binômes, et chaque zone est recomptée par une autre équipe si l'écart avec le stock théorique dépasse 2 %. Les auditeurs assistent à l'opération et effectuent eux-mêmes des comptages par sondage. Cette année, l'écart total constaté entre le stock physique et le stock théorique a été inférieur à celui de l'année précédente.","difficulty":1,"statements":[{"id":"V17-1","s":"Toutes les zones de l'entrepôt sont recomptées par une seconde équipe.","answer":"faux","why":"Seules les zones dont l'écart dépasse 2 % sont recomptées."},{"id":"V17-2","s":"Les auditeurs réalisent eux-mêmes certains comptages.","answer":"vrai","why":"Ils « effectuent eux-mêmes des comptages par sondage »."},{"id":"V17-3","s":"L'écart total constaté cette année est inférieur à 2 %.","answer":"nsp","why":"Le texte indique seulement qu'il est inférieur à celui de l'an dernier, sans en donner le niveau."}]},{"id":"V18","lang":"fr","title":"Les crédits d'impôt et la présentation des comptes","text":"Le traitement comptable de certains crédits d'impôt fait débat. Lorsqu'un crédit d'impôt peut être remboursé à l'entreprise même si elle ne paie pas d'impôt, de nombreux praticiens considèrent qu'il s'apparente à une subvention et le présentent en diminution des charges qu'il finance plutôt qu'en réduction de l'impôt sur les sociétés. Ce choix modifie le résultat d'exploitation, mais pas le résultat net. Les entreprises doivent appliquer la même méthode d'un exercice à l'autre et la décrire dans l'annexe.","difficulty":3,"statements":[{"id":"V18-1","s":"Le choix de présentation de ces crédits d'impôt modifie le résultat net.","answer":"faux","why":"Il modifie le résultat d'exploitation, « mais pas le résultat net »."},{"id":"V18-2","s":"Tous les praticiens présentent ces crédits d'impôt en diminution des charges.","answer":"faux","why":"Le texte parle de « nombreux praticiens » et dit que le traitement « fait débat »."},{"id":"V18-3","s":"La méthode retenue doit être décrite dans l'annexe.","answer":"vrai","why":"Les entreprises doivent « la décrire dans l'annexe »."},{"id":"V18-4","s":"Les crédits d'impôt remboursables représentent un montant important pour les entreprises françaises.","answer":"nsp","why":"Le texte ne donne aucun montant."}]},{"id":"V19","lang":"fr","title":"Le rapport de durabilité","text":"Les grandes entreprises européennes doivent progressivement publier des informations détaillées sur leurs enjeux environnementaux, sociaux et de gouvernance, selon des normes communes. Ces informations font l'objet d'une vérification par un tiers indépendant, qui peut être un commissaire aux comptes ou un organisme accrédité. Le calendrier d'application a été aménagé à plusieurs reprises, ce qui a reporté les obligations de certaines catégories d'entreprises. Les entreprises déjà concernées soulignent le coût de la collecte des données, notamment auprès de leurs fournisseurs.","difficulty":2,"statements":[{"id":"V19-1","s":"Seul un commissaire aux comptes peut vérifier les informations de durabilité.","answer":"faux","why":"La vérification peut être faite par un commissaire aux comptes « ou un organisme accrédité »."},{"id":"V19-2","s":"Le calendrier d'application a été modifié au moins une fois.","answer":"vrai","why":"Il « a été aménagé à plusieurs reprises »."},{"id":"V19-3","s":"Le coût de la collecte des données a dissuadé certaines entreprises de publier.","answer":"nsp","why":"Le texte mentionne le coût, mais pas qu'il ait conduit des entreprises à renoncer."}]},{"id":"V20","lang":"fr","title":"Le recouvrement des créances","text":"Pour réduire ses délais de paiement clients, la société Valcourt a mis en place une procédure de relance en trois étapes : un courriel automatique cinq jours après l'échéance, un appel téléphonique à quinze jours, puis une mise en demeure à trente jours. Depuis son lancement il y a six mois, la part des factures payées en retard est passée de 34 % à 21 %. La direction n'a cependant pas encore mesuré l'effet de la procédure sur la satisfaction des clients. Elle envisage de proposer un escompte pour paiement anticipé.","difficulty":2,"statements":[{"id":"V20-1","s":"La part des factures payées en retard a diminué de 13 points.","answer":"vrai","why":"Elle est passée de 34 % à 21 %, soit 13 points de moins."},{"id":"V20-2","s":"La procédure a dégradé la satisfaction des clients.","answer":"nsp","why":"La direction « n'a pas encore mesuré » cet effet."},{"id":"V20-3","s":"Valcourt accorde déjà un escompte pour paiement anticipé.","answer":"faux","why":"Elle « envisage de proposer » un escompte : elle ne l'accorde pas encore."},{"id":"V20-4","s":"La mise en demeure intervient quinze jours après l'échéance.","answer":"faux","why":"Elle intervient à trente jours ; l'appel téléphonique a lieu à quinze jours."}]},{"id":"V21","lang":"en","title":"Audit firm graduate intake","text":"Professional services firms have traditionally relied on large graduate intakes to staff their audit practices. In recent years, however, several firms have reduced the number of graduates they hire, citing the automation of routine testing and slower growth in demand for some services. At the same time, the firms continue to report shortages of experienced staff at senior and manager level. Industry observers note that hiring fewer graduates today may make it harder to fill these more senior roles in five to ten years' time, although the firms have not commented on this risk.","difficulty":1,"statements":[{"id":"V21-1","s":"Some firms have cut the number of graduates they recruit.","answer":"vrai","why":"The passage says several firms \"have reduced the number of graduates they hire\" (« plusieurs cabinets ont réduit leurs recrutements »)."},{"id":"V21-2","s":"The firms report a surplus of staff at manager level.","answer":"faux","why":"They \"continue to report shortages\" at senior and manager level (pénurie, et non excédent)."},{"id":"V21-3","s":"The firms have publicly acknowledged that fewer graduate hires could create future staffing problems.","answer":"faux","why":"The passage states that \"the firms have not commented on this risk\" (les cabinets ne se sont pas exprimés)."},{"id":"V21-4","s":"Automation has eliminated all routine testing in audit.","answer":"nsp","why":"Automation is cited as a reason for hiring fewer graduates, but nothing says it has eliminated all routine testing (le texte ne permet pas de l'affirmer)."}]},{"id":"V22","lang":"en","title":"Supply chain finance","text":"Supply chain finance allows a company's suppliers to be paid early by a bank, while the company itself pays the bank at a later date. The arrangement can help suppliers manage their cash flow, but it can also make the buyer's liabilities harder to understand. Because amounts owed under these programmes are often still presented as trade payables, investors may underestimate how much the company effectively owes to banks. New disclosure requirements now oblige companies to provide information about the terms and size of such arrangements. Critics argue that disclosure alone does not address the risk that banks may withdraw the facilities at short notice.","difficulty":2,"statements":[{"id":"V22-1","s":"Under supply chain finance, the company pays its suppliers early.","answer":"faux","why":"It is the bank that pays the suppliers early; the company pays the bank later (c'est la banque qui paie les fournisseurs)."},{"id":"V22-2","s":"Companies must now disclose information about these arrangements.","answer":"vrai","why":"\"New disclosure requirements now oblige companies to provide information\" (nouvelle obligation d'information)."},{"id":"V22-3","s":"Banks have recently withdrawn many supply chain finance facilities.","answer":"nsp","why":"Critics mention the risk that banks \"may\" withdraw facilities; nothing says this has happened (simple risque évoqué)."}]},{"id":"V23","lang":"en","title":"Inventory write-downs","text":"Retailer Norvane recorded an inventory write-down of €4.2 million in its latest financial year, compared with €1.1 million the year before. The increase mainly relates to winter clothing that remained unsold after an unusually mild season. Management expects to sell most of the affected stock through discount channels over the coming months. The auditors reviewed post year-end sales prices to assess whether the write-down was sufficient. The company's overall gross margin fell by two percentage points, although management did not specify
